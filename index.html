function editAnnivBg(){
  const a=state.anniversary;if(!a)return;
  const cover=a.cover||{type:'gradient'};
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='背景';box.appendChild(t);
  const seg=document.createElement('div');seg.className='seg';seg.style.margin='0 0 14px';
  const bC=document.createElement('button');bC.textContent='纯色';bC.className=cover.type==='color'?'active':'';
  const bI=document.createElement('button');bI.textContent='图片';bI.className=cover.type==='image'?'active':'';
  seg.appendChild(bC);seg.appendChild(bI);box.appendChild(seg);
  const panel=document.createElement('div');box.appendChild(panel);
  function drawC(){
    panel.innerHTML='';
    const ci=document.createElement('input');ci.type='color';ci.value=cover.type==='color'?cover.value:'#007aff';
    ci.style.cssText='width:100%;height:52px;border:none;border-radius:12px;cursor:pointer;background:transparent;';
    panel.appendChild(ci);
    const sw=document.createElement('div');sw.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px;';
    ['#007aff','#5ac8fa','#ff2d55','#ff9500','#34c759','#af52de','#ffcc00','#1c1c1e'].forEach(col=>{
      const s=document.createElement('div');s.style.cssText='aspect-ratio:1;border-radius:50%;background:'+col+';cursor:pointer;';
      s.addEventListener('click',()=>{ci.value=col;});sw.appendChild(s);
    });
    panel.appendChild(sw);panel._get=()=>ci.value;
  }
  function drawI(){
    panel.innerHTML='';
    const btn=document.createElement('button');btn.className='modal-btn confirm';btn.textContent='上传图片';btn.style.width='100%';
    const prev=document.createElement('div');
    prev.style.cssText='margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg-soft);min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;';
    prev.textContent=cover.type==='image'?'已设置':'未选择';
    let img=cover.type==='image'?cover.value:null;
    btn.addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>openCrop(ev.target.result,url=>{
          img=url;
          prev.innerHTML='<img src="'+url+'" style="width:100%;display:block;max-height:200px;object-fit:cover;">';
        },'square');
        r.readAsDataURL(f);
      });
      inp.click();
    });
    panel.appendChild(btn);panel.appendChild(prev);panel._get=()=>img;
  }
  bC.addEventListener('click',()=>{bC.classList.add('active');bI.classList.remove('active');drawC();});
  bI.addEventListener('click',()=>{bI.classList.add('active');bC.classList.remove('active');drawI();});

/* ============================================================
   裁剪器 v2（微信/小红书风格）
   ============================================================ */
const cropCtl = {
  img: null,
  naturalW: 0,
  naturalH: 0,
  baseW: 0,
  baseH: 0,
  x: 0,
  y: 0,
  scale: 1,
  minScale: 1,
  maxScale: 3,
  vpSize: 0,
  shape: 'round',
  cb: null,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
  dragOriginX: 0,
  dragOriginY: 0,
  pinching: false,
  pinchStartDist: 0,
  pinchStartScale: 1,
  pinchStartX: 0,
  pinchStartY: 0,
  pinchMidX: 0,
  pinchMidY: 0
};

function openCrop(src, cb, shape){
  cropCtl.cb = cb;
  cropCtl.shape = shape === 'square' ? 'square' : 'round';

  const vp = $('cropViewport');
  const img = $('cropImg');
  vp.classList.remove('round','square');
  vp.classList.add(cropCtl.shape);
  $('cropTitle').textContent = cropCtl.shape === 'round' ? '裁剪头像' : '裁剪封面';
  $('cropZoom').value = 1;

  requestAnimationFrame(()=>{
    cropCtl.vpSize = vp.clientWidth;
    img.onload = ()=>{
      cropCtl.naturalW = img.naturalWidth;
      cropCtl.naturalH = img.naturalHeight;
      const ratio = cropCtl.naturalW / cropCtl.naturalH;
      if(ratio >= 1){
        cropCtl.baseH = cropCtl.vpSize;
        cropCtl.baseW = cropCtl.vpSize * ratio;
      }else{
        cropCtl.baseW = cropCtl.vpSize;
        cropCtl.baseH = cropCtl.vpSize / ratio;
      }
      cropCtl.minScale = 1;
      cropCtl.maxScale = 3;
      cropCtl.scale = 1;
      cropCtl.x = 0;
      cropCtl.y = 0;
      img.style.width = cropCtl.baseW + 'px';
      img.style.height = cropCtl.baseH + 'px';
      renderCrop();
      $('crop').classList.add('open');
    };
    img.src = src;
  });
}

function renderCrop(){
  const img = $('cropImg');
  const s = cropCtl.scale;
  const tx = cropCtl.x;
  const ty = cropCtl.y;
  img.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) scale(${s})`;
  clampCrop();
}
function clampCrop(){
  const halfW = (cropCtl.baseW * cropCtl.scale) / 2;
  const halfH = (cropCtl.baseH * cropCtl.scale) / 2;
  const vp = cropCtl.vpSize / 2;
  const maxX = Math.max(0, halfW - vp);
  const maxY = Math.max(0, halfH - vp);
  if(cropCtl.x >  maxX) cropCtl.x =  maxX;
  if(cropCtl.x < -maxX) cropCtl.x = -maxX;
  if(cropCtl.y >  maxY) cropCtl.y =  maxY;
  if(cropCtl.y < -maxY) cropCtl.y = -maxY;
}

$('cropStage').addEventListener('pointerdown', e=>{
  if(e.pointerType === 'touch' && e.isPrimary === false) return;
  cropCtl.dragging = true;
  cropCtl.dragStartX = e.clientX;
  cropCtl.dragStartY = e.clientY;
  cropCtl.dragOriginX = cropCtl.x;
  cropCtl.dragOriginY = cropCtl.y;
  e.currentTarget.setPointerCapture(e.pointerId);
});
$('cropStage').addEventListener('pointermove', e=>{
  if(!cropCtl.dragging) return;
  cropCtl.x = cropCtl.dragOriginX + (e.clientX - cropCtl.dragStartX);
  cropCtl.y = cropCtl.dragOriginY + (e.clientY - cropCtl.dragStartY);
  renderCrop();
});
$('cropStage').addEventListener('pointerup', ()=>{ cropCtl.dragging = false; });
$('cropStage').addEventListener('pointercancel', ()=>{ cropCtl.dragging = false; });

$('cropStage').addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    e.preventDefault();
    cropCtl.dragging = false;
    cropCtl.pinching = true;
    const [a,b] = e.touches;
    cropCtl.pinchStartDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    cropCtl.pinchStartScale = cropCtl.scale;
    cropCtl.pinchStartX = cropCtl.x;
    cropCtl.pinchStartY = cropCtl.y;
    cropCtl.pinchMidX = (a.clientX + b.clientX) / 2;
    cropCtl.pinchMidY = (a.clientY + b.clientY) / 2;
  }
}, {passive:false});

$('cropStage').addEventListener('touchmove', e=>{
  if(!cropCtl.pinching || e.touches.length !== 2) return;
  e.preventDefault();
  const [a,b] = e.touches;
  const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  let newScale = cropCtl.pinchStartScale * (dist / cropCtl.pinchStartDist);
  newScale = Math.max(cropCtl.minScale, Math.min(cropCtl.maxScale, newScale));

  const midX = (a.clientX + b.clientX) / 2;
  const midY = (a.clientY + b.clientY) / 2;
  const dx = midX - cropCtl.pinchMidX;
  const dy = midY - cropCtl.pinchMidY;

  const k = newScale / cropCtl.pinchStartScale;
  cropCtl.scale = newScale;
  cropCtl.x = (cropCtl.pinchStartX + dx) * k;
  cropCtl.y = (cropCtl.pinchStartY + dy) * k;

  $('cropZoom').value = newScale;
  renderCrop();
}, {passive:false});

$('cropStage').addEventListener('touchend', e=>{
  if(e.touches.length < 2) cropCtl.pinching = false;
}, {passive:true});

$('cropZoom').addEventListener('input', e=>{
  const s = parseFloat(e.target.value);
  const k = s / cropCtl.scale;
  cropCtl.scale = s;
  cropCtl.x *= k;
  cropCtl.y *= k;
  renderCrop();
});

$('cropReset').addEventListener('click', ()=>{
  cropCtl.scale = 1;
  cropCtl.x = 0;
  cropCtl.y = 0;
  $('cropZoom').value = 1;
  renderCrop();
});

$('cropCancel').addEventListener('click', ()=>{
  $('crop').classList.remove('open');
  cropCtl.cb = null;
});

$('cropConfirm').addEventListener('click', ()=>{
  const img = $('cropImg');
  const vp = cropCtl.vpSize;
  const outSize = cropCtl.shape === 'round' ? 512 : 1024;

  const displayedW = cropCtl.baseW * cropCtl.scale;
  const displayedH = cropCtl.baseH * cropCtl.scale;
  const imgLeftInVp = cropCtl.x - displayedW / 2 + vp / 2;
  const imgTopInVp  = cropCtl.y - displayedH / 2 + vp / 2;

  const ratio = cropCtl.naturalW / displayedW;
  const sx = imgLeftInVp * ratio;
  const sy = imgTopInVp  * ratio;
  const sSize = vp * ratio;

  const cv = document.createElement('canvas');
  cv.width = outSize;
  cv.height = outSize;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if(cropCtl.shape === 'round'){
    ctx.save();
    ctx.beginPath();
    ctx.arc(outSize/2, outSize/2, outSize/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
  }
  ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, outSize, outSize);
  if(cropCtl.shape === 'round') ctx.restore();

  const url = cv.toDataURL('image/jpeg', 0.9);
  $('crop').classList.remove('open');
  if(cropCtl.cb) cropCtl.cb(url);
  cropCtl.cb = null;
});

  const m=String(d.getMinutes()).padStart(2,'0');
  $('statusTime').textContent=h+':'+m;

  buildThemeGrid();
  bindCustomInputs();
  applyTheme(localStorage.getItem(THEME_KEY)||'white');
  setTimeout(()=>{hideLoad();showEntry();},100);
}
boot();
