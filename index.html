/* ---------- 日历：CSS Grid 绝对对齐 ---------- */
function renderCalendar(){
  const c=$('viewCal');
  const first=new Date(calYear,calMonth,1);
  const startW=first.getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  if(!selectedDate)selectedDate=todayStr;

  let h='<div class="cal-wrap">';
  h+='<div class="cal-nav"><div class="cal-month">'+calYear+'年 '+(calMonth+1)+'月</div><div class="cal-btns"><button class="cal-btn" id="calPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="cal-btn" id="calNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></div>';
  h+='<div class="cal-card"><div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cal-grid">';
  for(let i=0;i<startW;i++)h+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=calYear+'-'+pad(calMonth+1)+'-'+pad(d);
    const todos=state.todos[ds]||[];
    let cls='cal-cell';
    if(ds===todayStr)cls+=' today';
    if(ds===selectedDate)cls+=' selected';
    let dot='';
    if(todos.length){
      const undone=todos.some(t=>!t.done);
      dot='<div class="cal-dot '+(undone?'':'done')+'"></div>';
    }
    h+='<div class="'+cls+'" data-date="'+ds+'"><div class="cal-num">'+d+'</div>'+dot+'</div>';
  }
  h+='</div></div>';

  const sd=selectedDate;
  const sdd=new Date(sd+'T00:00:00');
  const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
  const todos=state.todos[sd]||[];
  const note=state.notes[sd]||'';
  h+='<div class="cal-detail"><div class="cal-detail-head"><div><div class="cal-detail-date">'+(sdd.getMonth()+1)+'月'+sdd.getDate()+'日</div><div class="cal-detail-week">'+weekdays[sdd.getDay()]+'</div></div><button class="cal-detail-add" id="calAddTodo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="cal-todos">';
  if(!todos.length)h+='<div class="cal-empty">还没有待办</div>';
  else todos.forEach(t=>{
    const u=state.users[t.by];
    h+='<div class="cal-todo"><div class="cal-check '+(t.done?'done':'')+'" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div><div class="cal-todo-body"><div class="cal-todo-text '+(t.done?'done':'')+'">'+esc(t.text)+'</div><div class="cal-todo-meta">'+esc(u?u.name:'Ta')+' · '+fmtHm(t.createdAt)+'</div></div><button class="cal-todo-del" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  });
  h+='</div>';
  if(note)h+='<div class="cal-note"><div class="cal-note-label">备注</div><div class="cal-note-text">'+esc(note)+'</div></div>';
  else h+='<div class="cal-note"><div class="cal-note-label">备注</div><textarea class="cal-note-input" id="calNoteInput" placeholder="写点什么…" maxlength="300"></textarea></div>';
  h+='</div></div>';
  c.innerHTML=h;

  $('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();});
  $('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();});
  c.querySelectorAll('.cal-cell[data-date]').forEach(el=>{el.addEventListener('click',()=>{selectedDate=el.dataset.date;renderCalendar();});});
  $('calAddTodo').addEventListener('click',()=>openTodoModal(sd));
  c.querySelectorAll('.cal-check').forEach(el=>{
    el.addEventListener('click',()=>{const t=(state.todos[sd]||[]).find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;saveRoom();renderCalendar();});
  });
  c.querySelectorAll('.cal-todo-del').forEach(b=>{
    b.addEventListener('click',()=>{if(!confirm('删除这条待办？'))return;state.todos[sd]=(state.todos[sd]||[]).filter(x=>x.id!==b.dataset.id);if(!state.todos[sd].length)delete state.todos[sd];saveRoom();renderCalendar();});
  });
  const ni=$('calNoteInput');
  if(ni)ni.addEventListener('blur',()=>{const v=ni.value.trim();if(v)state.notes[sd]=v;else delete state.notes[sd];saveRoom();renderCalendar();});
}
function openTodoModal(ds){
  const d=new Date(ds+'T00:00:00');
  $('todoTitle').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
  $('todoSub').textContent=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  renderTodoList(ds);
  $('todoModal').classList.add('open');
  $('todoModal').dataset.date=ds;
  setTimeout(()=>$('todoInput').focus(),100);
}
function renderTodoList(ds){
  const c=$('todoList');
  const arr=state.todos[ds]||[];
  if(!arr.length){c.innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px 0;">还没有待办</div>';return;}
  c.innerHTML=arr.map(t=>{
    const u=state.users[t.by];
    return '<div class="cal-todo" style="padding-left:0;padding-right:0;"><div class="cal-check '+(t.done?'done':'')+'" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div><div class="cal-todo-body"><div class="cal-todo-text '+(t.done?'done':'')+'">'+esc(t.text)+'</div><div class="cal-todo-meta">'+esc(u?u.name:'Ta')+' · '+fmtHm(t.createdAt)+'</div></div><button class="cal-todo-del" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  }).join('');
  c.querySelectorAll('.cal-check').forEach(el=>{
    el.addEventListener('click',()=>{const t=(state.todos[ds]||[]).find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;saveRoom();renderTodoList(ds);renderCalendar();});
  });
  c.querySelectorAll('.cal-todo-del').forEach(b=>{
    b.addEventListener('click',()=>{if(!confirm('删除？'))return;state.todos[ds]=(state.todos[ds]||[]).filter(x=>x.id!==b.dataset.id);if(!state.todos[ds].length)delete state.todos[ds];saveRoom();renderTodoList(ds);renderCalendar();});
  });
}
$('todoAdd').addEventListener('click',()=>{
  const ds=$('todoModal').dataset.date;
  const v=$('todoInput').value.trim();
  if(!v||!ds)return;
  if(!state.todos[ds])state.todos[ds]=[];
  state.todos[ds].push({id:genId('t'),text:v,done:false,by:currentUser,createdAt:Date.now()});
  $('todoInput').value='';saveRoom();renderTodoList(ds);renderCalendar();
});
$('todoInput').addEventListener('keypress',e=>{if(e.key==='Enter')$('todoAdd').click();});
$('todoModal').addEventListener('click',e=>{if(e.target===$('todoModal'))$('todoModal').classList.remove('open');});

/* ---------- 纪念日 ---------- */
function renderAnniv(){
  const c=$('viewAnniv');
  const a=state.anniversary;
  let main='';
  if(!a||!a.date){
    main='<div class="anniv-empty"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><div class="anniv-empty-title">还没有设置纪念日</div><button class="btn btn-primary" id="setAnniv">设置纪念日</button></div>';
  }else{
    const start=new Date(a.date+'T00:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const days=Math.floor((today-start)/86400000)+1;
    let bgLayer='',bgStyle='';
    if(a.cover&&a.cover.type==='color')bgStyle='background:'+a.cover.value+';';
    else if(a.cover&&a.cover.type==='image'){
      bgStyle='background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, #fff));';
      bgLayer='<div class="anniv-bg" style="background-image:url(\''+a.cover.value+'\');--anniv-blur:'+(state.annivBlur||0)+'px;"></div><div class="anniv-overlay"></div>';
    }
    main='<div class="anniv-card" style="'+bgStyle+'border-radius:'+state.annivRadius+'px;--anniv-blur:'+(state.annivBlur||0)+'px;">'+bgLayer+'<div class="anniv-content"><div class="anniv-label">'+esc(a.label||'在一起')+'</div><div class="anniv-days">'+days+'<span class="anniv-unit">天</span></div><div class="anniv-date">从 '+a.date+'</div></div></div>'+
      '<div class="anniv-btns"><button class="btn btn-ghost" id="editAnniv">编辑</button><button class="btn btn-ghost" id="editAnnivBg">背景</button></div>'+
      '<div class="anniv-controls">'+
        '<div class="anniv-row"><label><span>圆角</span><span id="rVal">'+state.annivRadius+'px</span></label><input type="range" id="rSlider" min="0" max="75" value="'+state.annivRadius+'"></div>'+
        '<div class="anniv-row"><label><span>背景模糊</span><span id="bVal">'+(state.annivBlur||0)+'px</span></label><input type="range" id="bSlider" min="0" max="20" value="'+(state.annivBlur||0)+'"></div>'+
      '</div>';
  }
  const list=state.customAnnivs||[];
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...list].map(x=>({...x,diff:Math.round((new Date(x.date+'T00:00:00')-today)/86400000)})).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
  let listH='';
  if(!sorted.length)listH='<div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px 0;width:100%;max-width:340px;">还没有自定义纪念日</div>';
  else listH=sorted.map(it=>{
    let txt;
    if(it.diff>0)txt='还有 '+it.diff+' 天';
    else if(it.diff===0)txt='今天';
    else txt='已过 '+Math.abs(it.diff)+' 天';
    return '<div class="custom-anniv" data-id="'+it.id+'"><div class="ca-body"><div class="ca-title">'+esc(it.label)+'</div><div class="ca-date">'+it.date+'</div></div><div class="ca-days '+(it.diff===0?'today':'')+'">'+txt+'</div><button class="ca-del" data-id="'+it.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  }).join('');
  c.innerHTML='<div class="anniv-wrap">'+main+'<div class="anniv-sec">自定义纪念日</div>'+listH+'<button class="add-anniv" id="addAnniv">+ 添加纪念日</button></div>';

  if(a&&a.date){
    $('editAnniv').addEventListener('click',editAnniv);
    $('editAnnivBg').addEventListener('click',editAnnivBg);
    const rs=$('rSlider');
    rs.addEventListener('input',()=>{state.annivRadius=parseInt(rs.value);$('rVal').textContent=state.annivRadius+'px';const card=c.querySelector('.anniv-card');if(card)card.style.borderRadius=state.annivRadius+'px';});
    rs.addEventListener('change',()=>saveRoom());
    const bs=$('bSlider');
    bs.addEventListener('input',()=>{state.annivBlur=parseInt(bs.value);$('bVal').textContent=state.annivBlur+'px';const bg=c.querySelector('.anniv-bg');if(bg)bg.style.setProperty('--anniv-blur',state.annivBlur+'px');});
    bs.addEventListener('change',()=>saveRoom());
  }else{
    $('setAnniv').addEventListener('click',editAnniv);
  }
  $('addAnniv').addEventListener('click',()=>editCustomAnniv(null));
  c.querySelectorAll('.custom-anniv').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.closest('.ca-del'))return;editCustomAnniv(el.dataset.id);});
  });
  c.querySelectorAll('.ca-del').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();if(!confirm('删除？'))return;state.customAnnivs=state.customAnnivs.filter(x=>x.id!==b.dataset.id);saveRoom();renderAnniv();});
  });
}
function editAnniv(){
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='设置纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称（如：在一起）';lab.maxLength=12;lab.value=state.anniversary?state.anniversary.label||'':'在一起';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';dt.value=state.anniversary?state.anniversary.date||'':'';box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{if(!dt.value){alert('请选择日期');return;}const old=state.anniversary&&state.anniversary.cover;state.anniversary={label:lab.value.trim()||'在一起',date:dt.value,cover:old||{type:'gradient'}};saveRoom();$('modal').classList.remove('open');renderAnniv();});
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}
function editAnnivBg(){
  const a=state.anniversary;if(!a)return;
  const cover=a.cover||{type:'gradient'};
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='背景';box.appendChild(t);
  const seg=document.createElement('div');seg.className='seg';seg.style.margin='0 0 14px';
  const bC=document.createElement('button');bC.textContent='纯色';bC.className=cover.type==='color'?'active':'';
  const bI=document.createElement('button');bI.textContent='图片';bI.className=cover.type==='image'?'active':'';
  seg.appendChild(bC);seg.appendChild(bI);box.appendChild(seg);
  const panel=document.createElement('div');box.appendChild(panel);
  function drawC(){
    panel.innerHTML='';
    const ci=document.createElement('input');ci.type='color';ci.value=cover.type==='color'?cover.value:'#007aff';
    ci.style.cssText='width:100%;height:52px;border:none;border-radius:12px;cursor:pointer;background:transparent;';
    panel.appendChild(ci);
    const sw=document.createElement('div');sw.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px;';
    ['#007aff','#5ac8fa','#ff2d55','#ff9500','#34c759','#af52de','#ffcc00','#1c1c1e'].forEach(col=>{
      const s=document.createElement('div');s.style.cssText='aspect-ratio:1;border-radius:50%;background:'+col+';cursor:pointer;';
      s.addEventListener('click',()=>{ci.value=col;});sw.appendChild(s);
    });
    panel.appendChild(sw);panel._get=()=>ci.value;
  }
  function drawI(){
    panel.innerHTML='';
    const btn=document.createElement('button');btn.className='modal-btn confirm';btn.textContent='上传图片';btn.style.width='100%';
    const prev=document.createElement('div');
    prev.style.cssText='margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg-soft);min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;';
    prev.textContent=cover.type==='image'?'已设置':'未选择';
    let img=cover.type==='image'?cover.value:null;
    btn.addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>openCrop(ev.target.result,url=>{img=url;prev.innerHTML='<img src="'+url+'" style="width:100%;display:block;max-height:200px;object-fit:cover;">';});
        r.readAsDataURL(f);
      });
      inp.click();
    });
    panel.appendChild(btn);panel.appendChild(prev);panel._get=()=>img;
  }
  bC.addEventListener('click',()=>{bC.classList.add('active');bI.classList.remove('active');drawC();});
  bI.addEventListener('click',()=>{bI.classList.add('active');bC.classList.remove('active');drawI();});
  if(cover.type==='image')drawI();else drawC();
  const ac=document.createElement('div');ac.className='modal-actions';ac.style.marginTop='14px';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    if(bC.classList.contains('active'))a.cover={type:'color',value:panel._get()};
    else{const img=panel._get();if(!img){alert('请先选择图片');return;}a.cover={type:'image',value:img};}
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}
function editCustomAnniv(id){

  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent=it?'编辑纪念日':'添加纪念日';box.appendChild(t);

  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));

/* ---------- 头像 / 背景 ---------- */
function pickImage(type){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;

      if(currentTab==='me')renderMe();

function editBio(){

/* ---------- 编辑器 ---------- */
function openEditor(post){
  editingPostId=post?post.id:null;
  editorImage=post?post.image:null;
  editorScheduleAt=post?post.publishAt:null;
  $('editorText').value=post?post.text||'':'';
  renderEditorPreview();updatePubBtn();
  $('editor').classList.add('open');
  setTimeout(()=>$('editorText').focus(),100);
}
function closeEditor(){$('editor').classList.remove('open');editingPostId=null;editorImage=null;editorScheduleAt=null;$('editorText').value='';}
function renderEditorPreview(){
  const w=$('editorPvWrap');
  if(!editorImage){w.innerHTML='';return;}
  w.innerHTML='<div class="editor-pv"><img src="'+editorImage+'"><button class="rm" id="rmImg"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  $('rmImg').addEventListener('click',()=>{editorImage=null;renderEditorPreview();updatePubBtn();});
}
function updatePubBtn(){$('editorPub').disabled=!($('editorText').value.trim()||editorImage);}
$('editorText').addEventListener('input',updatePubBtn);
$('editorCancel').addEventListener('click',closeEditor);
$('toolImg').addEventListener('click',()=>$('editorImg').click());
$('editorImg').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>openCrop(ev.target.result,url=>{editorImage=url;renderEditorPreview();updatePubBtn();});
  r.readAsDataURL(f);e.target.value='';
});
$('toolTime').addEventListener('click',()=>{
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='定时发布';box.appendChild(t);
  const inp=document.createElement('input');inp.type='datetime-local';inp.className='modal-input';
  const def=editorScheduleAt?new Date(editorScheduleAt):new Date(Date.now()+3600000);
  inp.value=def.getFullYear()+'-'+pad(def.getMonth()+1)+'-'+pad(def.getDate())+'T'+pad(def.getHours())+':'+pad(def.getMinutes());
  box.appendChild(inp);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{const ts=new Date(inp.value).getTime();if(isNaN(ts)||ts<=Date.now()){alert('请选择未来时间');return;}editorScheduleAt=ts;$('modal').classList.remove('open');});
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
});
$('editorPub').addEventListener('click',()=>{
  const text=$('editorText').value.trim();
  if(!text&&!editorImage)return;
  if(editingPostId){
    const p=state.posts.find(x=>x.id===editingPostId);if(!p)return;
    p.text=text;p.image=editorImage;
    if(editorScheduleAt)p.publishAt=editorScheduleAt;else delete p.publishAt;
  }else{
    state.posts.push({id:genId('p'),author:currentUser,text:text,image:editorImage,createdAt:Date.now(),publishAt:editorScheduleAt||null,comments:[],readBy:{}});
  }
  saveRoom();closeEditor();
  if(currentTab==='feed')renderFeed();else if(currentTab==='me')renderMe();
});

/* ---------- 裁剪 ---------- */
let cropState={imgW:0,imgH:0,dW:0,dH:0,x:0,y:0,w:0,h:0};
let cropCb=null,dragStart=null;
function openCrop(src,cb){
  cropCb=cb;
  $('cropImg').onload=function(){
    requestAnimationFrame(()=>{
      const area=$('cropWrap').parentElement;
      const maxW=area.clientWidth-20,maxH=area.clientHeight-20;
      const r=$('cropImg').naturalWidth/$('cropImg').naturalHeight;
      let dw=maxW,dh=maxW/r;
      if(dh>maxH){dh=maxH;dw=maxH*r;}
      $('cropWrap').style.width=dw+'px';$('cropWrap').style.height=dh+'px';
      $('cropImg').style.width=dw+'px';$('cropImg').style.height=dh+'px';
      cropState.dW=dw;cropState.dH=dh;
      cropState.imgW=$('cropImg').naturalWidth;cropState.imgH=$('cropImg').naturalHeight;
      cropState.w=dw*0.6;cropState.h=dh*0.6;
      cropState.x=(dw-cropState.w)/2;cropState.y=(dh-cropState.h)/2;
      updateCropUI();$('crop').classList.add('open');
    });
  };
  $('cropImg').src=src;
}
function updateCropUI(){
  const s=$('cropSel');
  s.style.left=cropState.x+'px';s.style.top=cropState.y+'px';
  s.style.width=cropState.w+'px';s.style.height=cropState.h+'px';
}
$('cropSel').addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('crop-h'))return;
  dragStart={type:'move',sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y};
  e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
$('cropSel').querySelectorAll('.crop-h').forEach(h=>{
  h.addEventListener('pointerdown',e=>{
    dragStart={type:h.dataset.dir,sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y,w:cropState.w,h:cropState.h};
    e.target.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();
  });
});
$('cropSel').addEventListener('pointermove',e=>{
  if(!dragStart)return;
  const dx=e.clientX-dragStart.sx,dy=e.clientY-dragStart.sy,min=40;
  if(dragStart.type==='move'){
    let nx=dragStart.x+dx,ny=dragStart.y+dy;
    nx=Math.max(0,Math.min(cropState.dW-cropState.w,nx));
    ny=Math.max(0,Math.min(cropState.dH-cropState.h,ny));
    cropState.x=nx;cropState.y=ny;
  }else{
    let nx=dragStart.x,ny=dragStart.y,nw=dragStart.w,nh=dragStart.h;
    if(dragStart.type==='tl'){nx+=dx;ny+=dy;nw-=dx;nh-=dy;}
    if(dragStart.type==='tr'){ny+=dy;nw+=dx;nh-=dy;}
    if(dragStart.type==='bl'){nx+=dx;nw-=dx;nh+=dy;}
    if(dragStart.type==='br'){nw+=dx;nh+=dy;}
    if(nw<min){nw=min;if(dragStart.type.includes('l'))nx=dragStart.x+dragStart.w-min;}
    if(nh<min){nh=min;if(dragStart.type.includes('t'))ny=dragStart.y+dragStart.h-min;}
    if(nx<0){nw+=nx;nx=0;}
    if(ny<0){nh+=ny;ny=0;}
    if(nx+nw>cropState.dW)nw=cropState.dW-nx;
    if(ny+nh>cropState.dH)nh=cropState.dH-ny;
    cropState.x=nx;cropState.y=ny;cropState.w=nw;cropState.h=nh;
  }
  updateCropUI();
});
$('cropSel').addEventListener('pointerup',()=>{dragStart=null;});
$('cropSel').addEventListener('pointercancel',()=>{dragStart=null;});
$('cropCancel').addEventListener('click',()=>{$('crop').classList.remove('open');cropCb=null;});
$('cropConfirm').addEventListener('click',()=>{
  const sx=cropState.x*(cropState.imgW/cropState.dW);
  const sy=cropState.y*(cropState.imgH/cropState.dH);
  const sw=cropState.w*(cropState.imgW/cropState.dW);
  const sh=cropState.h*(cropState.imgH/cropState.dH);
  const cv=document.createElement('canvas');
  cv.width=Math.round(sw);cv.height=Math.round(sh);
  cv.getContext('2d').drawImage($('cropImg'),sx,sy,sw,sh,0,0,cv.width,cv.height);
  const url=cv.toDataURL('image/jpeg',0.85);
  $('crop').classList.remove('open');
  if(cropCb)cropCb(url);cropCb=null;
});

/* ---------- 事件绑定 ---------- */
document.getElementById('tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;switchTab(b.dataset.tab);});
$('fab').addEventListener('click',()=>openEditor(null));
$('themeOverlay').addEventListener('click',()=>$('themePicker').classList.remove('open'));
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open');});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});
['cBg','cCard','cAccent','cText'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    if(localStorage.getItem(THEME_KEY)!=='custom')applyTheme('custom');
    saveCustom();updateThemeUI();
  });
});

function tickClock(){const d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
function boot(){
  tickClock();setInterval(tickClock,1000);
  buildThemeGrid();
  applyTheme(localStorage.getItem(THEME_KEY)||'white');
  setTimeout(()=>{hideLoad();showEntry();},100);
}
boot();

})();
