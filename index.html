<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>私密房间</title>
<style>
:root{
  --bg-body:#f2f2f7; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#f8f8fc; --bg-input:#f2f2f7; --bg-modal:#ffffff;
  --text-primary:#000000; --text-secondary:#8e8e93; --text-tertiary:#c7c7cc; --text-placeholder:#b0b0b8;
  --accent:#007aff; --accent-soft:rgba(0,122,255,.1); --accent-shadow:rgba(0,122,255,.25);
  --border:rgba(0,0,0,.06); --border-strong:#e5e5ea;
  --danger:#ff3b30; --success:#34c759; --schedule:#ff9500;
  --frame-shadow:0 30px 60px rgba(0,0,0,.15);
  --blur-bg:rgba(255,255,255,.75);
}
[data-theme="light-pink"]{
  --bg-body:#fdf2f5; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#fdf2f5; --bg-input:#fae8ee; --bg-modal:#ffffff;
  --text-primary:#1c1c1e; --text-secondary:#a88b95; --text-tertiary:#d4c2ca;
  --accent:#ff2d55; --accent-soft:rgba(255,45,85,.1); --accent-shadow:rgba(255,45,85,.25);
  --border:rgba(255,45,85,.1); --border-strong:#f5dce3;
  --blur-bg:rgba(255,255,255,.75);
}
[data-theme="light-cream"]{
  --bg-body:#faf6ee; --bg-frame:#fffdf7; --bg-card:#fffdf7;
  --bg-soft:#f7f1e3; --bg-input:#f2ead8; --bg-modal:#fffdf7;
  --text-primary:#3a3226; --text-secondary:#9c9280;
  --accent:#e08a00; --accent-soft:rgba(224,138,0,.1); --accent-shadow:rgba(224,138,0,.25);
  --border:rgba(0,0,0,.05); --border-strong:#ecdfc8;
  --blur-bg:rgba(255,253,247,.8);
}
[data-theme="light-mint"]{
  --bg-body:#eef9f3; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#eef9f3; --bg-input:#e0f2e8; --bg-modal:#ffffff;
  --text-primary:#1a2e26; --text-secondary:#6b8a7d;
  --accent:#00a86b; --accent-soft:rgba(0,168,107,.1); --accent-shadow:rgba(0,168,107,.25);
  --border:rgba(0,168,107,.08); --border-strong:#d5e8dd;
  --blur-bg:rgba(255,255,255,.75);
}
[data-theme="light-lavender"]{
  --bg-body:#f5f2fb; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#f5f2fb; --bg-input:#ebe4f5; --bg-modal:#ffffff;
  --text-primary:#2a2340; --text-secondary:#8078a0;
  --accent:#7c5cff; --accent-soft:rgba(124,92,255,.1); --accent-shadow:rgba(124,92,255,.25);
  --border:rgba(124,92,255,.08); --border-strong:#e0d6f0;
  --blur-bg:rgba(255,255,255,.75);
}
[data-theme="dark"]{
  --bg-body:#000000; --bg-frame:#1c1c1e; --bg-card:#1c1c1e;
  --bg-soft:#2c2c2e; --bg-input:#2c2c2e; --bg-modal:#1c1c1e;
  --text-primary:#ffffff; --text-secondary:#98989e; --text-tertiary:#5a5a5e; --text-placeholder:#6a6a6e;
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --accent-shadow:rgba(10,132,255,.3);
  --border:rgba(255,255,255,.1); --border-strong:#3a3a3c;
  --danger:#ff453a; --success:#32d74b; --schedule:#ff9f0a;
  --blur-bg:rgba(28,28,30,.85);
}
[data-theme="dark-blue"]{
  --bg-body:#000000; --bg-frame:#0f1a2c; --bg-card:#152238;
  --bg-soft:#1e2e48; --bg-input:#1e2e48; --bg-modal:#0f1a2c;
  --text-primary:#e8eef8; --text-secondary:#8898b0;
  --accent:#4a9eff; --accent-soft:rgba(74,158,255,.2); --accent-shadow:rgba(74,158,255,.3);
  --border:rgba(255,255,255,.08); --border-strong:#2a3a52;
  --danger:#ff5a52; --success:#3ddc84; --schedule:#ffb340;
  --blur-bg:rgba(15,26,44,.85);
}
[data-theme="dark-purple"]{
  --bg-body:#000000; --bg-frame:#1a1230; --bg-card:#221842;
  --bg-soft:#2e2254; --bg-input:#2e2254; --bg-modal:#1a1230;
  --text-primary:#ede8f8; --text-secondary:#9888b8;
  --accent:#a78bfa; --accent-soft:rgba(167,139,250,.2); --accent-shadow:rgba(167,139,250,.3);
  --border:rgba(255,255,255,.08); --border-strong:#3a2a5a;
  --danger:#ff6a6a; --success:#4ade80; --schedule:#fbbf24;
  --blur-bg:rgba(26,18,48,.85);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg-body);display:flex;justify-content:center;align-items:center;min-height:100vh;transition:background-color .4s;overflow:hidden;}

/* 手机容器 */
.phone{width:100%;max-width:430px;height:100vh;max-height:932px;background:var(--bg-frame);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:background-color .4s;}
@media(min-width:480px){.phone{border-radius:44px;max-height:92vh;box-shadow:var(--frame-shadow);}}

/* 状态栏 */
.status-bar{padding:14px 24px 6px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--text-primary);flex-shrink:0;letter-spacing:-.2px;z-index:5;}

/* 主内容 */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.screen::-webkit-scrollbar{display:none;}
.page{display:none;padding-bottom:100px;}
.page.active{display:block;}

/* 大标题 */
.page-header{padding:8px 20px 16px;display:flex;align-items:flex-end;justify-content:space-between;}
.page-title{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--text-primary);line-height:1.1;}
.page-sub{font-size:13px;color:var(--text-secondary);margin-top:4px;}

/* 图标按钮 */
.icon-btn{background:none;border:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);transition:background .15s;}
.icon-btn:active{background:var(--bg-soft);}
.icon-btn svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

/* ===== 动态流 - 卡片 ===== */
.post-grid{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.post-card{background:var(--bg-card);border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .12s;}
.post-card:active{transform:scale(.98);}
.post-card-image{width:100%;aspect-ratio:1/1;background:var(--bg-soft);overflow:hidden;position:relative;}
.post-card-image img{width:100%;height:100%;object-fit:cover;display:block;}
.post-card-image.no-image{display:none;}
.post-card-body{padding:14px 16px;}
.post-card-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-card-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.post-card-avatar img{width:100%;height:100%;object-fit:cover;}
.post-card-avatar svg{width:18px;height:18px;color:var(--text-tertiary);}
.post-card-author{flex:1;min-width:0;}
.post-card-name{font-size:14px;font-weight:600;color:var(--text-primary);}
.post-card-time{font-size:11px;color:var(--text-secondary);margin-top:1px;}
.post-card-text{font-size:15px;line-height:1.5;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;max-height:80px;overflow:hidden;}
.post-card-footer{display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--border);}
.post-card-stat{display:flex;align-items:center;gap:5px;color:var(--text-secondary);font-size:12px;font-weight:500;}
.post-card-stat svg{width:16px;height:16px;stroke-width:1.8;fill:none;stroke:currentColor;}

/* ===== 空状态 ===== */
.empty{padding:80px 40px;text-align:center;color:var(--text-secondary);}
.empty svg{width:56px;height:56px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);margin-bottom:16px;}
.empty-title{font-size:17px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--text-secondary);line-height:1.5;}

/* ===== 帖子详情页（全屏滑入） ===== */
.detail-overlay{position:absolute;inset:0;background:var(--bg-frame);z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
.detail-overlay.open{transform:translateX(0);}
.detail-header{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--blur-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0;z-index:2;}
.detail-back{background:none;border:none;cursor:pointer;color:var(--text-primary);display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;}
.detail-back svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor;}
.detail-back:active{background:var(--bg-soft);}
.detail-title{font-size:16px;font-weight:600;color:var(--text-primary);}
.detail-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.detail-scroll::-webkit-scrollbar{display:none;}

/* 详情页图片区 - 占40% */
.detail-image{width:100%;aspect-ratio:5/4;background:var(--bg-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.detail-image img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-image svg{width:48px;height:48px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);}

.detail-body{padding:16px 20px 20px;}
.detail-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.detail-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.detail-avatar img{width:100%;height:100%;object-fit:cover;}
.detail-avatar svg{width:20px;height:20px;color:var(--text-tertiary);}
.detail-name{font-size:15px;font-weight:600;color:var(--text-primary);}
.detail-time{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.detail-text{font-size:16px;line-height:1.6;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;}

/* 评论区 */
.comment-list{padding:0 20px 20px;}
.comment-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.comment-item:last-child{border-bottom:none;}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.comment-avatar img{width:100%;height:100%;object-fit:cover;}
.comment-avatar svg{width:16px;height:16px;color:var(--text-tertiary);}
.comment-body{flex:1;min-width:0;}
.comment-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px;}
.comment-text{font-size:14px;line-height:1.5;color:var(--text-primary);word-break:break-word;}
.comment-actions{display:flex;gap:14px;margin-top:6px;}
.comment-actions button{background:none;border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:inherit;padding:0;font-weight:500;}
.comment-actions button:active{color:var(--accent);}
.comment-replies{margin-top:10px;padding-left:14px;border-left:2px solid var(--border);}
.comment-replies .comment-item{padding:8px 0;}

/* 底部输入栏 */
.detail-input-bar{padding:10px 16px 14px;border-top:1px solid var(--border);background:var(--blur-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;gap:10px;align-items:center;flex-shrink:0;}
.detail-input{flex:1;border:none;background:var(--bg-soft);border-radius:22px;padding:10px 16px;font-size:14px;outline:none;color:var(--text-primary);font-family:inherit;border:1px solid transparent;transition:border .15s;}
.detail-input:focus{border-color:var(--accent);}
.detail-input::placeholder{color:var(--text-placeholder);}
.detail-send{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;padding:6px 8px;}
.detail-send:disabled{opacity:.4;pointer-events:none;}

.reply-hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:12px;margin:8px 16px 0;}
.reply-hint .close{margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;}

/* ===== 底部 Tab Bar ===== */
.tab-bar{position:absolute;bottom:0;left:0;right:0;background:var(--blur-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:30;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-family:inherit;padding:4px 0;transition:color .2s;position:relative;}
.tab-btn.active{color:var(--accent);}
.tab-btn svg{width:26px;height:26px;stroke-width:1.6;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.tab-btn .label{font-size:10px;font-weight:500;letter-spacing:-.1px;}
.tab-btn .badge{position:absolute;top:0;left:50%;margin-left:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ===== 悬浮发帖 FAB ===== */
.fab{position:absolute;bottom:100px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px var(--accent-shadow);display:flex;align-items:center;justify-content:center;z-index:20;transition:transform .15s;}
.fab:active{transform:scale(.92);}
.fab svg{width:26px;height:26px;stroke-width:2.2;fill:none;stroke:#fff;stroke-linecap:round;}
.fab.hidden{display:none;}

/* ===== 通知条 (iOS 风格) ===== */
.notif{position:absolute;top:12px;left:12px;right:12px;background:var(--blur-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:100;transform:translateY(-120%);transition:transform .38s cubic-bezier(.2,.9,.3,1.1);cursor:pointer;border:1px solid var(--border);}
.notif.show{transform:translateY(0);}
.notif-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.notif-avatar img{width:100%;height:100%;object-fit:cover;}
.notif-avatar svg{width:18px;height:18px;color:var(--text-tertiary);}
.notif-body{flex:1;min-width:0;}
.notif-title{font-size:13px;font-weight:600;color:var(--text-primary);}
.notif-text{font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===== 设置页 ===== */
.settings-list{padding:0 16px;}
.settings-group{margin-bottom:24px;}
.settings-group-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;padding:0 8px 8px;}
.settings-item{background:var(--bg-card);border-radius:14px;padding:14px 16px;margin-bottom:1px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .12s;}
.settings-item:first-of-type{border-top-left-radius:14px;border-top-right-radius:14px;}
.settings-item:last-of-type{border-bottom-left-radius:14px;border-bottom-right-radius:14px;}
.settings-item:active{background:var(--bg-soft);}
.settings-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent);color:#fff;}
.settings-icon svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.settings-label{flex:1;font-size:15px;color:var(--text-primary);}
.settings-value{font-size:13px;color:var(--text-secondary);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.settings-arrow{color:var(--text-tertiary);width:18px;height:18px;flex-shrink:0;}
.settings-arrow svg{width:100%;height:100%;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.settings-item.danger .settings-label{color:var(--danger);}
.settings-item.danger .settings-icon{background:var(--danger);}

/* ===== 个人主页 ===== */
.profile-cover{width:100%;aspect-ratio:16/9;background:var(--bg-soft);overflow:hidden;position:relative;cursor:pointer;}
.profile-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.profile-cover-placeholder svg{width:40px;height:40px;stroke-width:1.2;fill:none;stroke:currentColor;}
.profile-cover .edit-hint{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:16px;padding:5px 12px;color:#fff;font-size:11px;font-weight:500;}
.profile-info{padding:0 20px;margin-top:-40px;position:relative;}
.profile-avatar{width:88px;height:88px;border-radius:50%;background:var(--bg-soft);border:3px solid var(--bg-frame);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.08);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-avatar svg{width:36px;height:36px;color:var(--text-tertiary);}
.profile-name{font-size:24px;font-weight:700;letter-spacing:-.4px;color:var(--text-primary);margin-top:14px;cursor:pointer;display:flex;align-items:center;gap:6px;word-break:break-word;}
.profile-bio{font-size:14px;color:var(--text-secondary);margin-top:6px;cursor:pointer;line-height:1.4;word-break:break-word;}
.profile-bio.empty{color:var(--text-tertiary);font-style:italic;}
.profile-section-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;padding:24px 20px 10px;}

/* ===== 日历 ===== */
.calendar{padding:0 20px 20px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-month{font-size:20px;font-weight:700;color:var(--text-primary);letter-spacing:-.3px;}
.cal-nav{display:flex;gap:4px;}
.cal-nav-btn{background:none;border:none;width:32px;height:32px;border-radius:50%;color:var(--accent);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn svg{width:20px;height:20px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.cal-nav-btn:active{background:var(--accent-soft);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;}
.cal-weekday{text-align:center;font-size:11px;color:var(--text-secondary);font-weight:600;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.12s;border:1px solid transparent;}
.cal-cell.empty{cursor:default;pointer-events:none;}
.cal-cell:not(.empty):active{background:var(--bg-soft);}
.cal-cell.today .cal-num{color:var(--accent);font-weight:700;}
.cal-cell.has-todo{background:var(--accent-soft);}
.cal-num{font-size:14px;font-weight:500;color:var(--text-primary);}
.cal-dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-dot.done{background:var(--success);}

/* ===== 待办弹窗 ===== */
.todo-modal{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
.todo-modal.open{opacity:1;visibility:visible;}
.todo-panel{background:var(--bg-modal);border-radius:24px 24px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));width:100%;max-height:85%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
.todo-modal.open .todo-panel{transform:translateY(0);}
.todo-grabber{width:36px;height:5px;background:var(--text-tertiary);border-radius:3px;margin:0 auto 14px;}
.todo-date{font-size:20px;font-weight:700;color:var(--text-primary);text-align:center;}
.todo-week{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:3px;margin-bottom:18px;}
.todo-list{flex:1;overflow-y:auto;margin-bottom:14px;min-height:60px;}
.todo-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.todo-row:last-child{border-bottom:none;}
.todo-check{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--text-tertiary);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px;}
.todo-check.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.todo-check svg{width:12px;height:12px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.todo-check.done svg{opacity:1;}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:15px;color:var(--text-primary);word-break:break-word;line-height:1.4;}
.todo-text.done{text-decoration:line-through;color:var(--text-tertiary);}
.todo-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.todo-del{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:4px;font-family:inherit;flex-shrink:0;}
.todo-del svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;}
.todo-add{display:flex;gap:8px;}
.todo-add input{flex:1;border:1px solid var(--border-strong);background:var(--bg-soft);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;color:var(--text-primary);font-family:inherit;}
.todo-add input:focus{border-color:var(--accent);}
.todo-add button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.todo-note{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.todo-note-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.todo-note textarea{width:100%;border:1px solid var(--border-strong);background:var(--bg-soft);border-radius:12px;padding:11px 14px;font-size:13px;outline:none;color:var(--text-primary);font-family:inherit;resize:none;min-height:60px;}
.todo-note textarea:focus{border-color:var(--accent);}

/* ===== 纪念日 ===== */
.anniv-card{aspect-ratio:1;border-radius:var(--anniv-radius,24px);background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 60%, #fff));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;position:relative;overflow:hidden;text-align:center;box-shadow:0 12px 32px var(--accent-shadow);}
.anniv-card::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.12);z-index:0;}
.anniv-card>*{position:relative;z-index:1;}
.anniv-label{font-size:14px;opacity:.95;margin-bottom:8px;font-weight:500;}
.anniv-days{font-size:76px;font-weight:700;letter-spacing:-3px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.15);}
.anniv-unit{font-size:20px;font-weight:500;opacity:.9;margin-left:6px;}
.anniv-date{font-size:12px;opacity:.9;margin-top:8px;}
.anniv-actions{position:absolute;bottom:16px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:2;}
.anniv-mini{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:7px 14px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.anniv-mini:active{background:rgba(255,255,255,.38);}
.anniv-empty{background:var(--bg-soft);border-radius:20px;padding:44px 24px;text-align:center;border:1px solid var(--border);}
.anniv-empty svg{width:48px;height:48px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);margin-bottom:12px;}
.anniv-empty-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:16px;}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 24px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.radius-slider{margin-top:14px;padding:12px 16px;background:var(--bg-soft);border-radius:14px;border:1px solid var(--border);}
.radius-slider label{font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;margin-bottom:8px;font-weight:500;}
.radius-slider input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--bg-input);outline:none;}
.radius-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px var(--accent-shadow);}
.custom-anniv-item{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.custom-anniv-item:active{background:var(--bg-soft);}
.ca-info{flex:1;min-width:0;}
.ca-title{font-size:14px;font-weight:600;color:var(--text-primary);word-break:break-word;}
.ca-date{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.ca-days{font-size:13px;font-weight:600;color:var(--schedule);flex-shrink:0;}
.ca-days.today{color:var(--danger);}
.ca-del{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:6px;font-family:inherit;flex-shrink:0;}
.ca-del svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;}
.add-anniv{width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--text-tertiary);background:transparent;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;}

/* ===== 分段控制 ===== */
.segmented{display:flex;background:var(--bg-soft);border-radius:12px;padding:3px;margin:0 20px 20px;}
.segmented button{flex:1;background:none;border:none;padding:9px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:.15s;}
.segmented button.active{background:var(--bg-card);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ===== 发帖编辑器（LINE 风格） ===== */
.editor{position:absolute;inset:0;background:var(--bg-frame);z-index:80;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
.editor.open{transform:translateY(0);}
.editor-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.editor-btn{background:none;border:none;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;padding:8px 12px;color:var(--text-secondary);border-radius:10px;}
.editor-btn:active{background:var(--bg-soft);}
.editor-btn.primary{color:var(--accent);font-weight:600;}
.editor-btn:disabled{opacity:.4;pointer-events:none;}
.editor-body{flex:1;padding:20px;overflow-y:auto;}
.editor-textarea{width:100%;border:none;background:transparent;resize:none;font-size:17px;line-height:1.5;color:var(--text-primary);outline:none;font-family:inherit;min-height:140px;}
.editor-textarea::placeholder{color:var(--text-placeholder);}
.editor-preview{margin-top:16px;border-radius:14px;overflow:hidden;position:relative;}
.editor-preview img{width:100%;display:block;max-height:340px;object-fit:cover;}
.editor-preview .remove{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:none;border-radius:50%;width:32px;height:32px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.editor-preview .remove svg{width:16px;height:16px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}
.editor-toolbar{padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;}
.toolbar-btn{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;color:var(--text-primary);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
.toolbar-btn svg{width:18px;height:18px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.toolbar-btn:active{background:var(--accent-soft);}

/* ===== 通用弹窗 ===== */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;}
.modal.open{opacity:1;visibility:visible;}
.modal-box{background:var(--bg-modal);border-radius:20px;padding:22px;width:100%;max-width:340px;max-height:85%;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;color:var(--text-primary);text-align:center;margin-bottom:16px;}
.modal-input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--bg-soft);font-size:15px;outline:none;color:var(--text-primary);font-family:inherit;margin-bottom:12px;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.modal-btn.cancel{background:var(--bg-soft);color:var(--text-primary);}
.modal-btn.confirm{background:var(--accent);color:#fff;}
.modal-btn.danger{background:var(--danger);color:#fff;}

/* 底部操作单 */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;padding:12px;}
.sheet.open{display:flex;}
.sheet-box{width:100%;animation:sheetUp .25s ease;}
@keyframes sheetUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-btn{display:block;width:100%;padding:16px;background:var(--bg-modal);border:none;font-size:16px;color:var(--accent);border-radius:14px;margin-bottom:8px;cursor:pointer;font-weight:500;font-family:inherit;}
.sheet-btn.danger{color:var(--danger);}
.sheet-btn.cancel{color:var(--text-primary);font-weight:600;}
.sheet-btn:active{background:var(--bg-soft);}

/* ===== 裁剪 ===== */
.crop{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column;padding:16px;color:#fff;}
.crop.open{display:flex;}
.crop-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.crop-btn{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;font-family:inherit;padding:6px;font-weight:500;}
.crop-btn.primary{color:#0a84ff;font-weight:700;}
.crop-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.crop-wrap{position:relative;line-height:0;touch-action:none;user-select:none;}
.crop-wrap img{max-width:100%;max-height:70vh;display:block;border-radius:8px;pointer-events:none;}
.crop-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);box-sizing:border-box;touch-action:none;}
.crop-h{position:absolute;width:28px;height:28px;z-index:2;touch-action:none;}
.crop-h::after{content:'';position:absolute;width:18px;height:18px;border:3px solid #fff;border-radius:3px;}
.crop-h.tl{top:-14px;left:-14px;}
.crop-h.tl::after{top:11px;left:11px;border-right:none;border-bottom:none;}
.crop-h.tr{top:-14px;right:-14px;}
.crop-h.tr::after{top:11px;right:11px;border-left:none;border-bottom:none;}
.crop-h.bl{bottom:-14px;left:-14px;}
.crop-h.bl::after{bottom:11px;left:11px;border-right:none;border-top:none;}
.crop-h.br{bottom:-14px;right:-14px;}
.crop-h.br::after{bottom:11px;right:11px;border-left:none;border-top:none;}
.crop-hint{text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin-top:14px;}

/* 主题选择器 */
.theme-picker{position:absolute;inset:0;z-index:200;pointer-events:none;}
.theme-picker.open{pointer-events:auto;}
.theme-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;}
.theme-picker.open .theme-overlay{opacity:1;}
.theme-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg-modal);border-radius:24px 24px 0 0;padding:16px 20px max(24px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow-y:auto;}
.theme-picker.open .theme-panel{transform:translateY(0);}
.theme-grabber{width:36px;height:5px;background:var(--text-tertiary);border-radius:3px;margin:0 auto 14px;}
.theme-title{font-size:16px;font-weight:600;color:var(--text-primary);text-align:center;margin-bottom:16px;}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.theme-opt{background:var(--bg-soft);border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;position:relative;}
.theme-opt.active{border-color:var(--accent);}
.theme-preview{height:44px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:6px;position:relative;border:1px solid var(--border);}
.theme-preview .card-preview{position:absolute;top:6px;left:6px;right:6px;bottom:6px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.theme-preview .dot-preview{position:absolute;bottom:5px;right:5px;width:10px;height:10px;border-radius:50%;}
.theme-name{font-size:11px;font-weight:500;color:var(--text-primary);text-align:center;}
.theme-opt.active .theme-name{font-weight:700;color:var(--accent);}
.theme-opt .check{position:absolute;top:5px;right:5px;background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.custom-panel{background:var(--bg-soft);border-radius:14px;padding:14px;display:none;}
.custom-panel.open{display:block;}
.custom-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.custom-row:last-child{margin-bottom:0;}
.custom-row label{flex:1;font-size:13px;font-weight:500;color:var(--text-primary);}
.custom-row input[type=color]{width:44px;height:32px;border:none;border-radius:8px;cursor:pointer;background:transparent;padding:0;}

/* 加载页 */
.loading{position:absolute;inset:0;background:var(--bg-frame);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .3s;}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text-secondary);}

/* 入口页 */
.entry{position:absolute;inset:0;background:var(--bg-frame);z-index:100;display:flex;flex-direction:column;padding:40px 24px;overflow-y:auto;transition:opacity .3s,visibility .3s;}
.entry.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.entry-logo{width:72px;height:72px;border-radius:22px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:60px auto 20px;box-shadow:0 8px 24px var(--accent-shadow);}
.entry-logo svg{width:38px;height:38px;stroke-width:1.8;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;}
.entry-title{font-size:28px;font-weight:700;letter-spacing:-.6px;color:var(--text-primary);text-align:center;margin-bottom:6px;}
.entry-sub{font-size:14px;color:var(--text-secondary);text-align:center;margin-bottom:36px;line-height:1.5;}
.entry-tabs{display:flex;background:var(--bg-soft);border-radius:12px;padding:3px;margin-bottom:20px;}
.entry-tab{flex:1;background:none;border:none;padding:10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:.15s;}
.entry-tab.active{background:var(--bg-card);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.entry-input{width:100%;padding:16px 18px;border-radius:14px;border:1.5px solid var(--border-strong);background:var(--bg-soft);font-size:16px;margin-bottom:12px;outline:none;color:var(--text-primary);font-family:inherit;}
.entry-input.code{text-align:center;letter-spacing:4px;font-family:ui-monospace,monospace;text-transform:lowercase;}
.entry-input:focus{border-color:var(--accent);}
.entry-input::placeholder{color:var(--text-placeholder);letter-spacing:normal;text-transform:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.entry-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;width:100%;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px var(--accent-shadow);}
.entry-btn:active{transform:scale(.98);}
.entry-btn:disabled{opacity:.5;pointer-events:none;}
.entry-err{margin-top:12px;font-size:12px;color:var(--danger);text-align:center;line-height:1.5;}
.entry-hint{margin-top:18px;font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.6;}
.room-item{background:var(--bg-soft);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.room-item:active{transform:scale(.98);}
.room-item .icon{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.room-item .icon svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.room-item .info{flex:1;min-width:0;}
.room-item .name{font-size:15px;font-weight:600;color:var(--text-primary);word-break:break-word;}
.room-item .code{font-size:12px;color:var(--text-secondary);margin-top:2px;font-family:ui-monospace,monospace;letter-spacing:1px;}
.room-item .arrow{color:var(--text-tertiary);width:18px;height:18px;flex-shrink:0;}
.room-item .arrow svg{width:100%;height:100%;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}

.hidden-input{display:none;}
</style>
</head>

      <span class="label">我</span>

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function rgba(hex,a){const {r,g,b}=hexToRgb(hex);return `rgba(${r},${g},${b},${a})`;}
function isDark(hex){const {r,g,b}=hexToRgb(hex);return (r*.299+g*.587+b*.114)<128;}

function fmtHm(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtDt(ts){const d=new Date(ts);return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtPost(p){
  if(p.publishAt&&p.publishAt>Date.now())return{text:`定时 · ${fmtDt(p.publishAt)}`,scheduled:true};
  const ts=p.publishAt||p.createdAt||Date.now();
  const d=new Date(ts),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.floor((today-pd)/86400000);
  if(diff===0)return{text:fmtHm(ts),scheduled:false};
  if(diff===1)return{text:`昨天 ${fmtHm(ts)}`,scheduled:false};
  if(diff<7)return{text:`${diff}天前`,scheduled:false};
  return{text:`${pad(d.getMonth()+1)}-${pad(d.getDate())} ${fmtHm(ts)}`,scheduled:false};
}

// ===== Supabase =====
async function cloudGet(code){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms?code=eq.${encodeURIComponent(code)}&select=data`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  const arr=await res.json();
  if(!arr.length)return null;
  return arr[0].data;
}
async function cloudInsert(code,data){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms`,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json','Prefer':'return=minimal'
    },
    body:JSON.stringify([{code,data,updated_at:new Date().toISOString()}])
  });
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}
async function cloudUpdate(code,data){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms?code=eq.${encodeURIComponent(code)}`,{
    method:'PATCH',
    headers:{
      'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json','Prefer':'return=minimal'
    },
    body:JSON.stringify({data,updated_at:new Date().toISOString()})
  });
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}

// ===== 房间数据 =====
function emptyRoom(){
  return {
    users:{user1:null,user2:null},
    posts:[],
    anniversary:null,
    customAnnivs:[],
    todos:{},
    notes:{},
    annivRadius:24,
    roomName:'',
    createdAt:Date.now(),
    notifications:[], // 通知列表
    _v:3
  };
}
function normRoom(data){
  if(!data||typeof data!=='object')return emptyRoom();
  const d=Object.assign(emptyRoom(),data);
  if(!d.users)d.users={user1:null,user2:null};
  if(!Array.isArray(d.posts))d.posts=[];
  if(!Array.isArray(d.customAnnivs))d.customAnnivs=[];
  if(!Array.isArray(d.notifications))d.notifications=[];
  if(!d.todos||typeof d.todos!=='object')d.todos={};
  if(!d.notes||typeof d.notes!=='object')d.notes={};
  if(typeof d.annivRadius!=='number')d.annivRadius=24;
  if(!d.roomName)d.roomName='';
  d.posts.forEach(p=>{
    if(!p.createdAt)p.createdAt=Date.now();
    if(!p.comments)p.comments=[];
    migC(p.comments);
    if(!p.readBy)p.readBy={};
    if(!p.id)p.id=genId('p');
  });
  return d;
}
function migC(arr){
  arr.forEach(c=>{
    if(!c.id)c.id=genId('c');
    if(!c.replies)c.replies=[];
    if(c.replies.length)migC(c.replies);
  });
}

function saveRoom(){
  if(!roomCode||!state)return;
  localStorage.setItem('cache_'+roomCode,JSON.stringify(state));
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRoom,700);
}
async function pushRoom(){
  if(!roomCode||!state||isSyncing)return;
  const js=JSON.stringify(state);
  if(js===lastSyncedJSON)return;
  isSyncing=true;
  try{
    await cloudUpdate(roomCode,state);
    lastSyncedJSON=js;
  }catch(e){
    console.warn('同步失败',e);
    setTimeout(()=>{isSyncing=false;pushRoom();},2000);
    return;
  }
  isSyncing=false;
}
async function pullRoom(){
  if(!roomCode||isSyncing)return;
  try{
    const data=await cloudGet(roomCode);
    if(!data)return;
    const n=normRoom(data);
    const js=JSON.stringify(n);
    if(js!==lastSyncedJSON){

      state=n;
      lastSyncedJSON=js;
      localStorage.setItem('cache_'+roomCode,js);
      detectNew(old,n);

      else if(currentTab==='other')renderOther();
      else if(currentTab==='settings')renderSettings();

  }catch(e){}
}

// 检测新评论 & 生成通知
function detectNew(oldS,newS){
  if(!oldS||!currentUser)return;
  const pk=partnerKey();
  newS.posts.forEach(p=>{
    if(p.author!==currentUser)return;
    const oldP=oldS.posts?oldS.posts.find(x=>x.id===p.id):null;
    const oldCnt=oldP?cntC(oldP.comments):0;
    const newCnt=cntC(p.comments);
    if(newCnt>oldCnt){
      const latest=findLatest(p.comments,pk);
      if(latest){
        // 添加到通知列表
        if(!newS.notifications)newS.notifications=[];
        newS.notifications.unshift({
          id:genId('n'),
          type:'comment',
          postId:p.id,
          from:pk,
          text:latest.text,
          createdAt:Date.now(),
          read:false
        });
        // 只保留最近 50 条
        if(newS.notifications.length>50)newS.notifications.length=50;
        // 弹通知条
        showNotif(latest.text,pk,p.id);
      }
    }
  });
}
function cntC(arr){let n=0;arr.forEach(c=>{n++;if(c.replies)n+=cntC(c.replies);});return n;}
function findLatest(arr,author){
  let l=null;
  arr.forEach(c=>{
    if(c.author===author&&(!l||c.id>l.id))l=c;
    if(c.replies){const r=findLatest(c.replies,author);if(r&&(!l||r.id>l.id))l=r;}
  });
  return l;
}
function showNotif(text,fromKey,postId){
  const p=state.users[fromKey];
  $('notifAvatar').innerHTML=p&&p.avatar?`<img src="${p.avatar}">`:avatarSvg();
  $('notifTitle').textContent=(p?p.name:'Ta')+' 评论了你';
  $('notifText').textContent=text;
  $('notif').classList.add('show');
  $('notif').onclick=()=>{
    $('notif').classList.remove('show');
    openDetail(postId);
  };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('notif').classList.remove('show'),3500);
}

      Object.keys(myRooms).sort((a,b)=>(myRooms[b].lastVisit||0)-(myRooms[a].lastVisit||0)).forEach(code=>{
        const room=myRooms[code];
        const el=document.createElement('div');
        el.className='room-item';
        el.innerHTML=`<div class="icon"><svg viewBox="0 0 24 24"><path d="M3 21V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14"/><path d="M3 21h18M9 21V11h6v10"/></svg></div>
          <div class="info"><div class="name">${esc(room.name||code)}</div><div class="code">${esc(code)}</div></div>
          <div class="arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>`;
        el.addEventListener('click',()=>openRoom(code));
        c.appendChild(el);
      });
      const div=document.createElement('div');
      div.style.cssText='font-size:12px;color:var(--text-tertiary);margin:20px 0 12px;text-align:center;';
      div.textContent='— 或 —';c.appendChild(div);
    }

    const tabs=document.createElement('div');tabs.className='entry-tabs';
    const tC=document.createElement('button');tC.className='entry-tab'+(mode==='create'?' active':'');tC.textContent='创建房间';
    const tJ=document.createElement('button');tJ.className='entry-tab'+(mode==='join'?' active':'');tJ.textContent='加入房间';
    tC.addEventListener('click',()=>{mode='create';draw();});
    tJ.addEventListener('click',()=>{mode='join';draw();});
    tabs.appendChild(tC);tabs.appendChild(tJ);c.appendChild(tabs);

    const ci=document.createElement('input');
    ci.type='text';ci.className='entry-input code';ci.placeholder='邀请码 (4字母+4数字)';ci.maxLength=8;ci.autocomplete='off';
    c.appendChild(ci);
    const ni=document.createElement('input');
    ni.type='text';ni.className='entry-input';ni.placeholder='你的昵称';ni.maxLength=16;ni.autocomplete='off';
    c.appendChild(ni);
    const btn=document.createElement('button');
    btn.className='entry-btn';
    btn.textContent=mode==='create'?'创建并进入':'加入';
    c.appendChild(btn);
    const hint=document.createElement('div');
    hint.className='entry-hint';
    hint.textContent=mode==='create'?'邀请码你自己定，4个小写字母+4个数字':'输入对方的邀请码，进入同一个房间';
    c.appendChild(hint);
    const err=document.createElement('div');err.className='entry-err';c.appendChild(err);

    ci.addEventListener('input',()=>{ci.value=ci.value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);});

    const submit=async()=>{
      err.textContent='';
      const code=ci.value.trim().toLowerCase();
      const name=ni.value.trim();
      if(!/^[a-z]{4}[0-9]{4}$/.test(code)){err.textContent='邀请码格式：4个小写字母 + 4个数字（如 love1234）';ci.focus();return;}
      if(!name){err.textContent='请输入昵称';ni.focus();return;}
      btn.disabled=true;btn.textContent='处理中…';
      try{
        const ex=await cloudGet(code);
        if(mode==='create'){
          if(ex){err.textContent='邀请码已被使用，换一个';btn.disabled=false;btn.textContent='创建并进入';return;}
          const data=emptyRoom();
          data.users.user1={name,bio:'',avatar:null,cover:null};
          data.roomName='房间 '+code;
          await cloudInsert(code,data);
          myRooms[code]={name:data.roomName,joinedAt:Date.now(),lastVisit:Date.now()};
          myIdentities[code]='user1';
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }else{
          if(!ex){err.textContent='房间不存在，检查邀请码';btn.disabled=false;btn.textContent='加入';return;}
          const data=normRoom(ex);
          if(data.users.user1&&data.users.user1.name===name)myIdentities[code]='user1';
          else if(data.users.user2&&data.users.user2.name===name)myIdentities[code]='user2';
          else if(!data.users.user2){
            data.users.user2={name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,data);
            myIdentities[code]='user2';
          }else if(!data.users.user1){
            data.users.user1={name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,data);
            myIdentities[code]='user1';
          }else{err.textContent='房间已满';btn.disabled=false;btn.textContent='加入';return;}
          myRooms[code]=myRooms[code]||{name:data.roomName||('房间 '+code),joinedAt:Date.now()};
          myRooms[code].lastVisit=Date.now();
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }
      }catch(e){
        console.error(e);
        err.textContent='网络错误：'+e.message;
        btn.disabled=false;btn.textContent=mode==='create'?'创建并进入':'加入';
      }
    };
    btn.addEventListener('click',submit);
    ci.addEventListener('keypress',e=>{if(e.key==='Enter')ni.focus();});
    ni.addEventListener('keypress',e=>{if(e.key==='Enter')submit();});
    setTimeout(()=>ci.focus(),100);
  }
  draw();
}

async function openRoom(code,name){
  showLoad('正在进入…');
  try{
    const data=await cloudGet(code);
    if(!data)throw new Error('房间不存在');
    state=normRoom(data);
    roomCode=code;
    currentUser=myIdentities[code];
    if(!currentUser){
      if(name){
        if(state.users.user1&&state.users.user1.name===name)currentUser='user1';
        else if(state.users.user2&&state.users.user2.name===name)currentUser='user2';
      }
      if(!currentUser){hideLoad();showEntry();return;}
      myIdentities[code]=currentUser;
      localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
    }
    localStorage.setItem(LAST_ROOM_KEY,code);
    lastSyncedJSON=JSON.stringify(state);
    localStorage.setItem('cache_'+code,lastSyncedJSON);
    if(!myRooms[code])myRooms[code]={name:state.roomName||('房间 '+code),joinedAt:Date.now()};
    myRooms[code].lastVisit=Date.now();
    localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
    // 初始化已知评论数
    state.posts.forEach(p=>{knownCommentCounts[p.id]=cntC(p.comments||[]);});
    hideLoad();
    enterMain();
  }catch(e){
    console.error(e);
    hideLoad();
    alert('进入失败：'+e.message);
    showEntry();
  }
}

function openDetail(postId){

  renderDetail(postId);

  $('detailReplyHint').innerHTML='';
}
function closeDetail(){
  $('detail').classList.remove('open');
  detailPostId=null;
  replyingTo=null;
}
function renderDetail(postId){
  const p=state.posts.find(x=>x.id===postId);
  if(!p)return;
  const u=state.users[p.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?`<img src="${u.avatar}">`:avatarSvg();
  const t=fmtPost(p);
  // 图片
  $('detailImage').innerHTML=p.image?`<img src="${p.image}">`:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
  $('detailAvatar').innerHTML=av;
  $('detailName').textContent=name;
  $('detailTime').textContent=t.text;
  $('detailText').textContent=p.text||'';
  // 评论
  const cs=p.comments||[];
  if(!cs.length){
    $('detailComments').innerHTML=`<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:30px 0;">还没有评论</div>`;
  }else{
    $('detailComments').innerHTML=cs.map(c=>renderCmt(c,p.id)).join('');
  }
  bindDetailEvents();
}
function renderCmt(c,postId){
  const u=state.users[c.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?`<img src="${u.avatar}">`:avatarSvg();
  const canDel=c.author===currentUser;
  const replies=(c.replies||[]).map(r=>renderCmt(r,postId)).join('');
  return `<div class="comment-item" data-comment-id="${c.id}">
    <div class="comment-avatar">${av}</div>
    <div class="comment-body">
      <div class="comment-name">${esc(name)}</div>
      <div class="comment-text">${esc(c.text)}</div>
      <div class="comment-actions">
        <button class="reply-btn" data-post-id="${postId}" data-comment-id="${c.id}">回复</button>
        ${canDel?`<button class="del-btn" data-post-id="${postId}" data-comment-id="${c.id}">删除</button>`:''}
      </div>
      ${replies?`<div class="comment-replies">${replies}</div>`:''}
    </div>
  </div>`;
}
function bindDetailEvents(){
  $('detailComments').querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!confirm('删除这条评论？'))return;
      const p=state.posts.find(x=>x.id===b.dataset.postId);
      if(!p)return;
      rmCmt(p.comments,b.dataset.commentId);
      saveRoom();
      renderDetail(detailPostId);
    });
  });
  $('detailComments').querySelectorAll('.reply-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const pid=b.dataset.postId,cid=b.dataset.commentId;
      const p=state.posts.find(x=>x.id===pid);if(!p)return;
      const c=findCmt(p.comments,cid);if(!c)return;
      const u=state.users[c.author];
      replyingTo={postId:pid,commentId:cid};
      $('detailReplyHint').innerHTML=`<div class="reply-hint">回复 <strong>${esc(u?u.name:'Ta')}</strong>：<button class="close" id="closeReply">✕</button></div>`;
      $('closeReply').addEventListener('click',()=>{replyingTo=null;$('detailReplyHint').innerHTML='';});
      $('detailInput').focus();
    });
  });
}
function findCmt(arr,id){
  for(const c of arr){
    if(c.id===id)return c;
    const r=findCmt(c.replies||[],id);
    if(r)return r;
  }
  return null;
}
function rmCmt(arr,id){
  for(let i=0;i<arr.length;i++){
    if(arr[i].id===id){arr.splice(i,1);return true;}
    if(arr[i].replies&&rmCmt(arr[i].replies,id))return true;
  }
  return false;
}
$('detailInput').addEventListener('input',e=>{
  $('detailSend').disabled=!e.target.value.trim();
});
$('detailInput').addEventListener('keypress',e=>{
  if(e.key==='Enter')$('detailSend').click();
});
$('detailSend').addEventListener('click',()=>{
  const v=$('detailInput').value.trim();
  if(!v||!detailPostId)return;
  const p=state.posts.find(x=>x.id===detailPostId);
  if(!p)return;
  const nc={id:genId('c'),author:currentUser,text:v,replies:[]};
  if(replyingTo&&replyingTo.postId===detailPostId){
    const t=findCmt(p.comments,replyingTo.commentId);
    if(t){if(!t.replies)t.replies=[];t.replies.push(nc);}
    else p.comments.push(nc);
    replyingTo=null;
    $('detailReplyHint').innerHTML='';
  }else p.comments.push(nc);
  $('detailInput').value='';
  $('detailSend').disabled=true;
  saveRoom();
  renderDetail(detailPostId);
});

// 日历
function renderCal(){
  const c=$('calendarView');
  const first=new Date(calYear,calMonth,1);
  const startW=first.getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  let h=`<div class="calendar">
    <div class="cal-header">
      <div class="cal-month">${calYear}年 ${calMonth+1}月</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="cal-nav-btn" id="calNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div>
      <div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div>
      <div class="cal-weekday">六</div>
    </div>
    <div class="cal-grid">`;
  for(let i=0;i<startW;i++)h+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const todos=state.todos[ds]||[];
    const cls=['cal-cell'];
    if(ds===todayStr)cls.push('today');
    if(todos.length&&todos.every(t=>t.done))cls.push('has-todo');
    let dotHtml='';
    if(todos.length){
      const undone=todos.some(t=>!t.done);
      dotHtml=`<div class="cal-dot ${undone?'':'done'}"></div>`;
    }
    h+=`<div class="${cls.join(' ')}" data-date="${ds}"><div class="cal-num">${d}</div>${dotHtml}</div>`;
  }
  h+='</div></div>';
  c.innerHTML=h;
  $('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();});
  $('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();});
  c.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    el.addEventListener('click',()=>openTodo(el.dataset.date));
  });
}

function openTodo(ds){
  currentTodoDate=ds;

  $('todoDate').textContent=`${d.getMonth()+1}月${d.getDate()}日`;
  $('todoWeek').textContent=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  renderTodos();
  $('todoNote').value=state.notes[ds]||'';
  $('todoModal').classList.add('open');
  setTimeout(()=>$('todoInput').focus(),100);
}
function renderTodos(){

  const arr=state.todos[currentTodoDate]||[];
  if(!arr.length){
    c.innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px 0;">还没有待办</div>';
    return;
  }
  c.innerHTML=arr.map(t=>{
    const u=state.users[t.by];
    return `<div class="todo-row" data-id="${t.id}">
      <div class="todo-check ${t.done?'done':''}" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
      <div class="todo-body">

      </div>
      <button class="todo-del" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>`;
  }).join('');
  c.querySelectorAll('.todo-check').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=(state.todos[currentTodoDate]||[]).find(x=>x.id===el.dataset.id);
      if(!t)return;
      t.done=!t.done;
      saveRoom();renderTodos();
    });
  });
  c.querySelectorAll('.todo-del').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!confirm('删除？'))return;
      state.todos[currentTodoDate]=(state.todos[currentTodoDate]||[]).filter(x=>x.id!==b.dataset.id);
      if(!state.todos[currentTodoDate].length)delete state.todos[currentTodoDate];
      saveRoom();renderTodos();
    });
  });
}
$('todoAdd').addEventListener('click',()=>{
  const v=$('todoInput').value.trim();
  if(!v)return;
  if(!state.todos[currentTodoDate])state.todos[currentTodoDate]=[];
  state.todos[currentTodoDate].push({id:genId('t'),text:v,done:false,by:currentUser,createdAt:Date.now()});
  $('todoInput').value='';
  saveRoom();renderTodos();

$('todoNote').addEventListener('blur',()=>{

  if(!a||!a.date){
    main=`<div class="anniv-empty">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <div class="anniv-empty-title">还没有设置纪念日</div>
      <button class="btn-primary" id="setAnniv">设置纪念日</button>
    </div>`;
  }else{
    const start=new Date(a.date+'T00:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const days=Math.floor((today-start)/86400000)+1;
    let bg='';
    if(a.cover&&a.cover.type==='color')bg=`background:${a.cover.value};`;
    else if(a.cover&&a.cover.type==='image')bg=`background:url('${a.cover.value}') center/cover;`;
    main=`<div class="anniv-card" style="${bg};border-radius:${state.annivRadius}px;">
      <div class="anniv-label">${esc(a.label||'在一起')}</div>
      <div class="anniv-days">${days}<span class="anniv-unit">天</span></div>
      <div class="anniv-date">从 ${a.date} 开始</div>
      <div class="anniv-actions">
        <button class="anniv-mini" id="editAnniv">编辑</button>
        <button class="anniv-mini" id="editAnnivBg">背景</button>
      </div>
    </div>
    <div class="radius-slider">
      <label><span>圆角</span><span id="rVal">${state.annivRadius}px</span></label>
      <input type="range" id="rSlider" min="0" max="80" value="${state.annivRadius}">
    </div>`;
  }
  const list=state.customAnnivs||[];
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...list].map(x=>({...x,diff:Math.round((new Date(x.date+'T00:00:00')-today)/86400000)})).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
  let listH='';
  if(!sorted.length)listH='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px 0;">还没有自定义纪念日</div>';
  else listH=sorted.map(it=>{
    let txt;
    if(it.diff>0)txt=`还有 ${it.diff} 天`;
    else if(it.diff===0)txt='今天';
    else txt=`已过 ${Math.abs(it.diff)} 天`;
    return `<div class="custom-anniv-item" data-id="${it.id}">
      <div class="ca-info"><div class="ca-title">${esc(it.label)}</div><div class="ca-date">${it.date}</div></div>
      <div class="ca-days ${it.diff===0?'today':''}">${txt}</div>
      <button class="ca-del" data-id="${it.id}"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>`;
  }).join('');
  c.innerHTML=main+`<div class="profile-section-title" style="padding-left:0;">自定义纪念日</div>${listH}<button class="add-anniv" id="addAnniv">+ 添加纪念日</button>`;

  if(a&&a.date){
    $('editAnniv').addEventListener('click',editAnniv);
    $('editAnnivBg').addEventListener('click',editAnnivBg);
    const s=$('rSlider');
    s.addEventListener('input',()=>{
      state.annivRadius=parseInt(s.value);
      $('rVal').textContent=state.annivRadius+'px';
      const card=c.querySelector('.anniv-card');
      if(card)card.style.borderRadius=state.annivRadius+'px';
    });
    s.addEventListener('change',()=>saveRoom());
  }else{
    $('setAnniv').addEventListener('click',editAnniv);
  }
  $('addAnniv').addEventListener('click',()=>editCustomAnniv(null));
  c.querySelectorAll('.custom-anniv-item').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.ca-del'))return;
      editCustomAnniv(el.dataset.id);
    });
  });
  c.querySelectorAll('.ca-del').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm('删除？'))return;
      state.customAnnivs=state.customAnnivs.filter(x=>x.id!==b.dataset.id);
      saveRoom();renderAnniv();
    });
  });
}
function editAnniv(){
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='设置纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称（如：在一起）';lab.maxLength=12;
  lab.value=state.anniversary?state.anniversary.label||'':'在一起';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';
  dt.value=state.anniversary?state.anniversary.date||'':'';box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{
    if(!dt.value){alert('请选择日期');return;}
    const old=state.anniversary&&state.anniversary.cover;
    state.anniversary={label:lab.value.trim()||'在一起',date:dt.value,cover:old||{type:'gradient'}};
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}
function editAnnivBg(){
  const a=state.anniversary;if(!a)return;
  const cover=a.cover||{type:'gradient'};
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='背景';box.appendChild(t);
  const seg=document.createElement('div');seg.className='segmented';seg.style.margin='0 0 14px';
  const bC=document.createElement('button');bC.textContent='纯色';bC.className=cover.type==='color'?'active':'';
  const bI=document.createElement('button');bI.textContent='图片';bI.className=cover.type==='image'?'active':'';
  seg.appendChild(bC);seg.appendChild(bI);box.appendChild(seg);
  const panel=document.createElement('div');box.appendChild(panel);
  function drawC(){
    panel.innerHTML='';
    const ci=document.createElement('input');ci.type='color';ci.value=cover.type==='color'?cover.value:'#007aff';
    ci.style.cssText='width:100%;height:52px;border:none;border-radius:12px;cursor:pointer;background:transparent;';
    panel.appendChild(ci);
    const sw=document.createElement('div');sw.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px;';
    ['#007aff','#5ac8fa','#ff2d55','#ff9500','#34c759','#af52de','#ffcc00','#1c1c1e'].forEach(col=>{
      const s=document.createElement('div');s.style.cssText=`aspect-ratio:1;border-radius:50%;background:${col};cursor:pointer;`;
      s.addEventListener('click',()=>{ci.value=col;});sw.appendChild(s);
    });
    panel.appendChild(sw);
    panel._get=()=>ci.value;
  }
  function drawI(){
    panel.innerHTML='';
    const btn=document.createElement('button');btn.className='modal-btn confirm';btn.textContent='上传图片';btn.style.width='100%';
    const prev=document.createElement('div');prev.style.cssText='margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg-soft);min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;';
    prev.textContent=cover.type==='image'?'已设置':'未选择';
    let img=cover.type==='image'?cover.value:null;
    btn.addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>openCrop(ev.target.result,url=>{img=url;prev.innerHTML=`<img src="${url}" style="width:100%;display:block;max-height:200px;object-fit:cover;">`;});
        r.readAsDataURL(f);
      });
      inp.click();
    });
    panel.appendChild(btn);panel.appendChild(prev);
    panel._get=()=>img;
  }
  bC.addEventListener('click',()=>{bC.classList.add('active');bI.classList.remove('active');drawC();});
  bI.addEventListener('click',()=>{bI.classList.add('active');bC.classList.remove('active');drawI();});
  if(cover.type==='image')drawI();else drawC();
  const ac=document.createElement('div');ac.className='modal-actions';ac.style.marginTop='14px';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    if(bC.classList.contains('active'))a.cover={type:'color',value:panel._get()};
    else{
      const img=panel._get();
      if(!img){alert('请先选择图片');return;}
      a.cover={type:'image',value:img};
    }
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}
function editCustomAnniv(id){
  const it=id?state.customAnnivs.find(x=>x.id===id):null;
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent=it?'编辑':'添加纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称';lab.maxLength=20;
  lab.value=it?it.label:'';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';
  dt.value=it?it.date:new Date().toISOString().slice(0,10);box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{
    if(!lab.value.trim()){alert('请输入名称');return;}
    if(!dt.value){alert('请选择日期');return;}
    if(it){it.label=lab.value.trim();it.date=dt.value;}
    else state.customAnnivs.push({id:genId('a'),label:lab.value.trim(),date:dt.value});
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}

function pickImg(type){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>openCrop(ev.target.result,url=>{
      const u=me();if(!u)return;
      if(type==='avatar')u.avatar=url;else u.cover=url;
      saveRoom();
      if(currentTab==='me')renderMe();
      if(currentTab==='feed')renderFeed();
    });
    r.readAsDataURL(f);
  });
  inp.click();
}

// ===== 发帖编辑器 =====
function openEditor(post){
  editingPostId=post?post.id:null;
  editorImage=post?post.image:null;
  editorScheduleAt=post?post.publishAt:null;
  $('editorText').value=post?post.text||'':'';
  renderEditorImg();
  updatePubBtn();
  $('editor').classList.add('open');
  setTimeout(()=>$('editorText').focus(),100);
}
function closeEditor(){
  $('editor').classList.remove('open');
  editingPostId=null;editorImage=null;editorScheduleAt=null;
  $('editorText').value='';
}
function renderEditorImg(){
  const w=$('editorPreviewWrap');
  if(!editorImage){w.innerHTML='';return;}
  w.innerHTML=`<div class="editor-preview"><img src="${editorImage}"><button class="remove" id="rmImg"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
  $('rmImg').addEventListener('click',()=>{editorImage=null;renderEditorImg();updatePubBtn();});
}
function updatePubBtn(){
  $('editorPublish').disabled=!($('editorText').value.trim()||editorImage);
}
$('editorText').addEventListener('input',updatePubBtn);
$('editorCancel').addEventListener('click',closeEditor);
$('toolbarImage').addEventListener('click',()=>$('editorImage').click());
$('editorImage').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>openCrop(ev.target.result,url=>{editorImage=url;renderEditorImg();updatePubBtn();});
  r.readAsDataURL(f);
  e.target.value='';
});
$('toolbarSchedule').addEventListener('click',()=>{
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='定时发布';box.appendChild(t);
  const inp=document.createElement('input');inp.type='datetime-local';inp.className='modal-input';
  const def=editorScheduleAt?new Date(editorScheduleAt):new Date(Date.now()+3600000);
  inp.value=`${def.getFullYear()}-${pad(def.getMonth()+1)}-${pad(def.getDate())}T${pad(def.getHours())}:${pad(def.getMinutes())}`;
  box.appendChild(inp);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    const ts=new Date(inp.value).getTime();
    if(isNaN(ts)||ts<=Date.now()){alert('请选择未来时间');return;}
    editorScheduleAt=ts;
    $('modal').classList.remove('open');
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
});
$('editorPublish').addEventListener('click',()=>{
  const text=$('editorText').value.trim();
  if(!text&&!editorImage)return;
  if(editingPostId){
    const p=state.posts.find(x=>x.id===editingPostId);if(!p)return;
    p.text=text;p.image=editorImage;
    if(editorScheduleAt)p.publishAt=editorScheduleAt;else delete p.publishAt;
  }else{
    state.posts.push({
      id:genId('p'),author:currentUser,text,image:editorImage,
      createdAt:Date.now(),publishAt:editorScheduleAt||null,
      comments:[],readBy:{}
    });
  }
  saveRoom();closeEditor();
  if(currentTab==='feed')renderFeed();
  else if(currentTab==='me')renderMe();
});

// ===== 帖子操作 =====
function openPostActions(){
  const box=$('sheetBox');box.innerHTML='';
  const e=document.createElement('button');e.className='sheet-btn';e.textContent='编辑';
  e.addEventListener('click',()=>{
    $('sheet').classList.remove('open');
    const p=state.posts.find(x=>x.id===actionSheetPostId);
    if(p)openEditor(p);
  });
  const d=document.createElement('button');d.className='sheet-btn danger';d.textContent='删除';
  d.addEventListener('click',()=>{
    $('sheet').classList.remove('open');
    if(!confirm('删除这条动态？评论一起删。'))return;
    const i=state.posts.findIndex(x=>x.id===actionSheetPostId);
    if(i>=0)state.posts.splice(i,1);
    saveRoom();
    if(currentTab==='feed')renderFeed();else renderMe();
  });
  const c=document.createElement('button');c.className='sheet-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('sheet').classList.remove('open'));
  box.appendChild(e);box.appendChild(d);box.appendChild(c);
  $('sheet').classList.add('open');
}

// ===== 裁剪 =====
let cropState={imgW:0,imgH:0,dW:0,dH:0,x:0,y:0,w:0,h:0};
let cropCb=null,dragStart=null;
function openCrop(src,cb){
  cropCb=cb;
  $('cropImage').onload=function(){
    requestAnimationFrame(()=>{
      const area=$('cropWrap').parentElement;
      const maxW=area.clientWidth-20,maxH=area.clientHeight-20;
      const r=$('cropImage').naturalWidth/$('cropImage').naturalHeight;
      let dw=maxW,dh=maxW/r;
      if(dh>maxH){dh=maxH;dw=maxH*r;}
      $('cropWrap').style.width=dw+'px';$('cropWrap').style.height=dh+'px';
      $('cropImage').style.width=dw+'px';$('cropImage').style.height=dh+'px';
      cropState.dW=dw;cropState.dH=dh;
      cropState.imgW=$('cropImage').naturalWidth;cropState.imgH=$('cropImage').naturalHeight;
      cropState.w=dw*.6;cropState.h=dh*.6;
      cropState.x=(dw-cropState.w)/2;cropState.y=(dh-cropState.h)/2;
      updateCropUI();
      $('crop').classList.add('open');
    });
  };
  $('cropImage').src=src;
}
function updateCropUI(){
  const s=$('cropSel');
  s.style.left=cropState.x+'px';s.style.top=cropState.y+'px';
  s.style.width=cropState.w+'px';s.style.height=cropState.h+'px';
}
$('cropSel').addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('crop-h'))return;
  dragStart={type:'move',sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y};
  e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
$('cropSel').querySelectorAll('.crop-h').forEach(h=>{
  h.addEventListener('pointerdown',e=>{
    dragStart={type:h.dataset.dir,sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y,w:cropState.w,h:cropState.h};
    e.target.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();
  });
});
$('cropSel').addEventListener('pointermove',e=>{
  if(!dragStart)return;
  const dx=e.clientX-dragStart.sx,dy=e.clientY-dragStart.sy,min=40;
  if(dragStart.type==='move'){
    let nx=dragStart.x+dx,ny=dragStart.y+dy;
    nx=Math.max(0,Math.min(cropState.dW-cropState.w,nx));
    ny=Math.max(0,Math.min(cropState.dH-cropState.h,ny));
    cropState.x=nx;cropState.y=ny;
  }else{
    let nx=dragStart.x,ny=dragStart.y,nw=dragStart.w,nh=dragStart.h;
    if(dragStart.type==='tl'){nx+=dx;ny+=dy;nw-=dx;nh-=dy;}
    if(dragStart.type==='tr'){ny+=dy;nw+=dx;nh-=dy;}
    if(dragStart.type==='bl'){nx+=dx;nw-=dx;nh+=dy;}
    if(dragStart.type==='br'){nw+=dx;nh+=dy;}
    if(nw<min){nw=min;if(dragStart.type.includes('l'))nx=dragStart.x+dragStart.w-min;}
    if(nh<min){nh=min;if(dragStart.type.includes('t'))ny=dragStart.y+dragStart.h-min;}
    if(nx<0){nw+=nx;nx=0;}
    if(ny<0){nh+=ny;ny=0;}
    if(nx+nw>cropState.dW)nw=cropState.dW-nx;
    if(ny+nh>cropState.dH)nh=cropState.dH-ny;
    cropState.x=nx;cropState.y=ny;cropState.w=nw;cropState.h=nh;
  }
  updateCropUI();
});
$('cropSel').addEventListener('pointerup',()=>{dragStart=null;});
$('cropSel').addEventListener('pointercancel',()=>{dragStart=null;});
$('cropCancel').addEventListener('click',()=>{$('crop').classList.remove('open');cropCb=null;});
$('cropConfirm').addEventListener('click',()=>{
  const sx=cropState.x*(cropState.imgW/cropState.dW);
  const sy=cropState.y*(cropState.imgH/cropState.dH);
  const sw=cropState.w*(cropState.imgW/cropState.dW);
  const sh=cropState.h*(cropState.imgH/cropState.dH);
  const cv=document.createElement('canvas');
  cv.width=Math.round(sw);cv.height=Math.round(sh);
  cv.getContext('2d').drawImage($('cropImage'),sx,sy,sw,sh,0,0,cv.width,cv.height);
  const url=cv.toDataURL('image/jpeg',.85);
  $('crop').classList.remove('open');
  if(cropCb)cropCb(url);
  cropCb=null;
});

// ===== 事件绑定 =====
$('tabBar').addEventListener('click',e=>{
  const b=e.target.closest('.tab-btn');if(!b)return;
  switchTab(b.dataset.tab);
});
$('fab').addEventListener('click',()=>openEditor(null));
$('themeOverlay').addEventListener('click',()=>$('themePicker').classList.remove('open'));
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open');});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});
['cBg','cCard','cAccent','cText'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    if(localStorage.getItem(THEME_KEY)!=='custom')applyTheme('custom');
    saveCustom();
    updateThemeUI();
  });
});

// ===== 时钟 =====
function tickClock(){
  const d=new Date();
  $('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ===== 启动 =====
function boot(){
  tickClock();setInterval(tickClock,1000);
  buildThemeGrid();
  applyTheme(localStorage.getItem(THEME_KEY)||'light-blue');
  // 自动重连最近房间
  const last=localStorage.getItem(LAST_ROOM_KEY);
  if(last&&myRooms[last]){
    setTimeout(()=>{hideLoad();showEntry();},100);
  }else{
    setTimeout(()=>{hideLoad();showEntry();},100);
  }
}
boot();

})();
</script>
