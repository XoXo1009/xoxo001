function hex2rgb(hex){ hex=String(hex).replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join(''); return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}; }
function rgbaOf(hex,a){ const {r,g,b}=hex2rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function isDarkColor(hex){ const {r,g,b}=hex2rgb(hex); return (r*0.299+g*0.587+b*0.114)<128; }

function pad(n){return n.toString().padStart(2,'0');}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmtHm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDt(ts){const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtRel(ts){const now=Date.now(),diff=Math.floor((now-ts)/1000);if(diff<60)return '刚刚';if(diff<3600)return Math.floor(diff/60)+'分钟前';if(diff<86400)return Math.floor(diff/3600)+'小时前';if(diff<86400*7)return Math.floor(diff/86400)+'天前';const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts);}
function fmtPostTime(p){
  if(p.publishAt&&p.publishAt>Date.now())return{text:'定时 · '+fmtDt(p.publishAt),scheduled:true};
  const ts=p.publishAt||p.createdAt||Date.now();
  const d=new Date(ts),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.floor((today-pd)/86400000);
  if(diff===0)return{text:fmtHm(ts),scheduled:false};
  if(diff===1)return{text:'昨天 '+fmtHm(ts),scheduled:false};
  if(diff<7)return{text:diff+'天前',scheduled:false};
  return{text:pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts),scheduled:false};
}

/* ===== 云端读写 ===== */
async function cloudGet(code){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code)+'&select=data',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const arr=await res.json();
  if(!arr.length)return null;
  return arr[0].data;
}
async function cloudInsert(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify([{code:code,data:data,updated_at:new Date().toISOString()}])});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}
async function cloudUpdate(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code),{method:'PATCH',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({data:data,updated_at:new Date().toISOString()})});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}

function emptyRoom(){
  return {users:{user1:null,user2:null},posts:[],anniversary:null,customAnnivs:[],todos:{},notes:{},annivRadius:24,annivBlur:0,roomName:'',notifications:[],createdAt:Date.now(),_v:8};
}
function normRoom(data){
  if(!data||typeof data!=='object')return emptyRoom();
  const d=Object.assign(emptyRoom(),data);
  if(!d.users)d.users={user1:null,user2:null};
  if(!Array.isArray(d.posts))d.posts=[];
  if(!Array.isArray(d.customAnnivs))d.customAnnivs=[];
  if(!Array.isArray(d.notifications))d.notifications=[];
  if(!d.todos||typeof d.todos!=='object')d.todos={};
  if(!d.notes||typeof d.notes!=='object')d.notes={};
  if(typeof d.annivRadius!=='number')d.annivRadius=24;
  if(typeof d.annivBlur!=='number')d.annivBlur=0;
  if(!d.roomName)d.roomName='';
  d.posts.forEach(p=>{if(!p.createdAt)p.createdAt=Date.now();if(!p.comments)p.comments=[];migComments(p.comments);if(!p.readBy)p.readBy={};if(!p.id)p.id=genId('p');});
  const pidSet=new Set(d.posts.map(p=>p.id));
  d.notifications=d.notifications.filter(n=>!n.postId||pidSet.has(n.postId));
  return d;
}
function migComments(arr){
  arr.forEach(c=>{if(!c.id)c.id=genId('c');if(!c.replies)c.replies=[];if(c.createdAt===undefined)c.createdAt=Date.now();if(c.replies.length)migComments(c.replies);});
}
function saveRoom(){
  if(!roomCode||!state)return;
  pendingLocalChanges=true;
  localStorage.setItem('cache_'+roomCode,JSON.stringify(state));
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRoom,300);
}
async function pushRoom(){
  if(!roomCode||!state||isSyncing)return;
  const js=JSON.stringify(state);
  if(js===lastSyncedJSON){pendingLocalChanges=false;return;}
  isSyncing=true;
  try{
    await cloudUpdate(roomCode,state);
    lastSyncedJSON=js;
    if(JSON.stringify(state)===js)pendingLocalChanges=false;
  }catch(e){
    console.warn('同步失败',e);isSyncing=false;setTimeout(pushRoom,2000);return;
  }
  isSyncing=false;
  if(pendingLocalChanges){clearTimeout(syncTimer);syncTimer=setTimeout(pushRoom,500);}
}
async function pullRoom(){
  if(!roomCode||isSyncing||pendingLocalChanges)return;
  try{
    const data=await cloudGet(roomCode);
    if(!data)return;
    const n=normRoom(data);
    const js=JSON.stringify(n);
    if(js!==lastSyncedJSON){
      state=n;lastSyncedJSON=js;localStorage.setItem('cache_'+roomCode,js);rerenderCurrent();
    }
  }catch(e){}
}
function rerenderCurrent(){
  if(currentTab==='feed')renderFeed();
  else if(currentTab==='me')renderMe();
  else if(currentTab==='partner')renderPartner();
  else if(currentTab==='other')renderOther();
  else if(currentTab==='settings')renderSettings();
  if(detailPostId&&$('detail').classList.contains('open'))renderDetail(detailPostId);
  updateBadges();
}

/* ===== 通知 ===== */
function notifyCountForPost(postId){if(!state||!currentUser)return 0;return (state.notifications||[]).filter(n=>!n.read&&n.from!==currentUser&&n.postId===postId).length;}
function notifyUnreadTotal(){if(!state||!currentUser)return 0;return (state.notifications||[]).filter(n=>!n.read&&n.from!==currentUser).length;}
function pushNotification(n){
  if(!state)return;
  if(!state.notifications)state.notifications=[];
  const dup=state.notifications.some(x=>x.type===n.type&&x.from===n.from&&x.postId===n.postId&&x.commentId===n.commentId);
  if(dup)return;
  state.notifications.unshift(Object.assign({id:genId('n'),read:false,createdAt:Date.now()},n));
  if(state.notifications.length>100)state.notifications.length=100;
}
function notifyOnNewComment(post,newComment){
  if(!state||!currentUser)return;
  if(newComment.author!==currentUser)return;
  const from=currentUser;
  if(post.author!==from)pushNotification({type:'comment',postId:post.id,commentId:newComment.id,from:from,text:newComment.text});
  if(newComment.replyTo){
    const target=findComment(post.comments,newComment.replyTo);
    if(target&&target.author!==from)pushNotification({type:'reply',postId:post.id,commentId:newComment.id,replyToId:newComment.replyTo,from:from,text:newComment.text});
  }
}
function markPostNotificationsRead(postId){
  if(!state)return false;
  let changed=false;
  (state.notifications||[]).forEach(n=>{if(n.postId===postId&&!n.read&&n.from!==currentUser){n.read=true;changed=true;}});
  if(changed){updateBadges();saveRoom();}
  return changed;
}
function markAllRead(){if(!state)return;(state.notifications||[]).forEach(n=>{n.read=true;});updateBadges();saveRoom();rerenderCurrent();}
function updateBadges(){
  if(!state)return;
  const unread=notifyUnreadTotal();
  const fdot=$('feedDot');
  if(fdot){fdot.style.display=unread>0?'block':'none';fdot.textContent=unread>9?'9+':(unread||'');fdot.classList.toggle('num',unread>0);}
}
function countAllComments(arr){let n=0;arr.forEach(c=>{n++;if(c.replies)n+=countAllComments(c.replies);});return n;}
function findComment(arr,id){for(const c of arr){if(c.id===id)return c;const r=findComment(c.replies||[],id);if(r)return r;}return null;}
function rmComment(arr,id){for(let i=0;i<arr.length;i++){if(arr[i].id===id){arr.splice(i,1);return true;}if(arr[i].replies&&rmComment(arr[i].replies,id))return true;}return false;}

/* ===== 图片压缩 ===== */
function compressImage(file,maxSide,quality,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      const scale=Math.min(1,maxSide/Math.max(w,h));
      w=Math.round(w*scale);h=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

            const d=normRoom(existing);
            let slot=null;
            if(d.users.user1&&d.users.user1.name===name)slot='user1';
            else if(d.users.user2&&d.users.user2.name===name)slot='user2';
            else if(!d.users.user1)slot='user1';
            else if(!d.users.user2)slot='user2';
            else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='创建并进入';return;}
            if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
            if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,d);
            myIdentities[code]=slot;
            myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
            myRooms[code].lastVisit=Date.now();
            localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
            localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
            await openRoom(code,name);return;
          }
          const data=emptyRoom();
          data.users.user1={name:name,bio:'',avatar:null,cover:null};
          data.roomName='房间 '+code;
          await cloudInsert(code,data);
          myRooms[code]={name:data.roomName,joinedAt:Date.now(),lastVisit:Date.now()};
          myIdentities[code]='user1';
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }else{
          if(!existing){err.textContent='房间不存在，检查邀请码';btn.disabled=false;btn.textContent='进入房间';return;}
          const d=normRoom(existing);
          let slot=null;
          if(d.users.user1&&d.users.user1.name===name)slot='user1';
          else if(d.users.user2&&d.users.user2.name===name)slot='user2';
          else if(!d.users.user1)slot='user1';
          else if(!d.users.user2)slot='user2';
          else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='进入房间';return;}
          if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
          if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};
          await cloudUpdate(code,d);
          myIdentities[code]=slot;
          myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
          myRooms[code].lastVisit=Date.now();
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }
      }catch(e){console.error(e);err.textContent='网络错误：'+e.message;btn.disabled=false;btn.textContent=mode==='create'?'创建并进入':'进入房间';}
    };
    btn.addEventListener('click',submit);
    codeInput.addEventListener('keypress',e=>{if(e.key==='Enter')nameInput.focus();});
    nameInput.addEventListener('keypress',e=>{if(e.key==='Enter')submit();});
    setTimeout(()=>codeInput.focus(),100);
  }
  draw();
}

async function openRoom(code,name){
  showLoad('正在进入…');
  try{
    const data=await cloudGet(code);
    if(!data)throw new Error('房间不存在');
    state=normRoom(data);roomCode=code;currentUser=myIdentities[code];
    if(!currentUser){
      if(name){if(state.users.user1&&state.users.user1.name===name)currentUser='user1';else if(state.users.user2&&state.users.user2.name===name)currentUser='user2';}
      if(!currentUser){hideLoad();showEntry();return;}
      myIdentities[code]=currentUser;localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
    }
    localStorage.setItem(LAST_ROOM_KEY,code);
    lastSyncedJSON=JSON.stringify(state);localStorage.setItem('cache_'+code,lastSyncedJSON);pendingLocalChanges=false;
    if(!myRooms[code])myRooms[code]={name:state.roomName||('房间 '+code),joinedAt:Date.now()};
    myRooms[code].lastVisit=Date.now();localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
    const t=new Date();selectedDate=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());calAnchor=new Date();
    hideLoad();enterMain();
  }catch(e){console.error(e);hideLoad();alert('进入失败：'+e.message);showEntry();}
}

function enterMain(){

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(tab==='partner')$('page-partner').classList.add('active');else $('page-'+tab).classList.add('active');
  $('screen').scrollTop=0;
  if(tab==='feed')renderFeed();
  else if(tab==='other')renderOther();
  else if(tab==='me')renderMe();
  else if(tab==='partner')renderPartner();

function layoutWaterfallAsync(posts,cardHtmlFn,container){
  const left=document.createElement('div');left.className='feed-col';
  const right=document.createElement('div');right.className='feed-col';
  container.appendChild(left);container.appendChild(right);
  let lh=0,rh=0;
  posts.forEach(p=>{
    const tmp=document.createElement('div');tmp.innerHTML=cardHtmlFn(p);
    const card=tmp.firstElementChild;
    const wrapper=document.createElement('div');wrapper.style.visibility='hidden';wrapper.style.position='absolute';wrapper.appendChild(card);document.body.appendChild(wrapper);
    const h=card.offsetHeight||200;document.body.removeChild(wrapper);
    if(lh<=rh){left.appendChild(card);lh+=h;}else{right.appendChild(card);rh+=h;}
  });
}

function renderFeed(){
  if(!state)return;

  const ps=state.posts.filter(isPub).filter(p=>!p.hidden||p.author===currentUser).sort((a,b)=>(b.publishAt||b.createdAt||0)-(a.publishAt||a.createdAt||0));

function bindFeedEvents(c){
  c.querySelectorAll('.post').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.post-av')||e.target.closest('.post-name')||e.target.closest('.post-more'))return;
      openDetail(el.dataset.postId);
    });
  });
  c.querySelectorAll('.post-av,.post-name').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const pid=el.closest('.post').dataset.postId;
      const p=state.posts.find(x=>x.id===pid);if(!p)return;
      if(p.author===currentUser)switchTab('me');else switchTab('partner');
    });
  });
  c.querySelectorAll('.post-more').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const pid=b.dataset.postId;const p=state.posts.find(x=>x.id===pid);if(!p)return;
      const isMine=p.author===currentUser;const items=[];
      if(isMine){
        items.push({text:'编辑',fn:()=>openEditor(p)});
        items.push({text:p.hidden?'取消隐藏':'隐藏',fn:()=>{p.hidden=!p.hidden;saveRoom();rerenderCurrent();}});
        items.push({text:'删除',danger:true,fn:()=>{
          openActionSheet([{text:'确认删除这条动态？',danger:true,fn:()=>{state.posts=state.posts.filter(x=>x.id!==pid);state.notifications=(state.notifications||[]).filter(n=>n.postId!==pid);saveRoom();rerenderCurrent();}},{text:'取消',cancel:true}]);
        }});
      }else{
        items.push({text:p.hidden?'取消隐藏':'隐藏',fn:()=>{p.hidden=!p.hidden;saveRoom();rerenderCurrent();}});
      }
      items.push({text:'取消',cancel:true});
      openActionSheet(items);
    });
  });
}

function renderCard(p){
  const u=state.users[p.author];if(!u)return '';
  const name=u.name||'Ta';
  const av=u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const t=fmtPostTime(p);
  const cnt=countAllComments(p.comments||[]);
  let readTag='';
  if(p.author===currentUser){
    const pk=partnerKey();
    if(!isPub(p))readTag='<span class="post-read pending">待发布</span>';
    else if(p.readBy&&p.readBy[pk])readTag='<span class="post-read read">已读</span>';
    else readTag='<span class="post-read">未读</span>';
  }
  const badgeN=notifyCountForPost(p.id);
  const badgeHtml=badgeN>0?'<span class="post-badge">'+(badgeN>9?'9+':badgeN)+'</span>':'';
  const imgHtml=(p.images&&p.images.length)?'<div class="post-media"><img src="'+p.images[0]+'"></div>':(p.image?'<div class="post-media"><img src="'+p.image+'"></div>':'');
  return '<div class="post'+(p.hidden?' hidden-post':'')+'" data-post-id="'+p.id+'">'+badgeHtml+imgHtml+
    '<div class="post-body"><div class="post-head"><div class="post-av" data-uid="'+p.author+'">'+av+'</div><div class="post-meta"><div class="post-name" data-uid="'+p.author+'">'+esc(name)+'</div><div class="post-time '+(t.scheduled?'scheduled':'')+'">'+esc(t.text)+'</div></div></div>'+
    (p.text?'<div class="post-text">'+esc(p.text)+'</div>':'')+
    '</div>'+
    '<div class="post-foot">'+
      '<div class="post-stat '+(cnt>0?'has-cmt':'')+'"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+(cnt>0?cnt:'评论')+'</div>'+
      readTag+
      '<button class="post-more" data-post-id="'+p.id+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
    '</div></div>';
}

  h+='<div class="profile-bio-label">'+(isMe?'个性签名':'Ta 的签名')+'</div>';

  h+='</div>';
  h+='<div class="profile-stats">';
  h+='<div class="stat-pill"><div class="stat-num">'+mine.length+'</div><div class="stat-lbl">动态</div></div>';
  h+='<div class="stat-pill"><div class="stat-num">'+totalComments+'</div><div class="stat-lbl">评论</div></div>';
  h+='<div class="stat-pill"><div class="stat-num">'+totalRead+'</div><div class="stat-lbl">被读</div></div>';
  h+='</div>';

function openDetail(postId){

  const p=state.posts.find(x=>x.id===postId);if(!p)return;
  if(p.hidden&&p.author!==currentUser)return;
  detailPostId=postId;replyingTo=null;
  markPostNotificationsRead(postId);renderDetail(postId);

function renderDetail(postId){
  const p=state.posts.find(x=>x.id===postId);if(!p)return;
  const u=state.users[p.author];const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();

  $('detailAv').onclick=()=>{closeDetail();if(p.author===currentUser)switchTab('me');else switchTab('partner');};
  $('detailName').onclick=$('detailAv').onclick;

  $('cmtCount').textContent=cs.length>0?countAllComments(cs)+' 条':'';

  else $('cmtList').innerHTML=cs.map(c=>renderComment(c,postId)).join('');

function renderComment(c,postId){
  const u=state.users[c.author];const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const isMe=c.author===currentUser;const canDel=isMe;
  let quoteHtml='';
  if(c.replyTo){
    const post=state.posts.find(x=>x.id===postId);
    const parent=post?findComment(post.comments||[],c.replyTo):null;
    if(parent){const pu=state.users[parent.author];quoteHtml='<div class="cmt-reply-quote"><div class="bar"></div><div class="q-body"><div class="q-name">'+esc(pu?pu.name:'Ta')+'</div><div class="q-text">'+esc(parent.text||'')+'</div></div></div>';}
  }
  const timeStr=fmtRel(c.createdAt||Date.now());
  return '<div class="cmt '+(isMe?'me':'')+'" data-comment-id="'+c.id+'">'+
    '<div class="cmt-av" data-uid="'+c.author+'">'+av+'</div>'+
    '<div class="cmt-body"><div class="cmt-name">'+esc(name)+'<span class="time">'+timeStr+'</span></div>'+
      '<div class="cmt-bubble">'+quoteHtml+esc(c.text||'')+'</div>'+
      '<div class="cmt-actions"><button class="reply-btn" data-post-id="'+postId+'" data-comment-id="'+c.id+'">回复</button>'+
        (canDel?'<button class="del" data-post-id="'+postId+'" data-comment-id="'+c.id+'">删除</button>':'')+
      '</div></div></div>';
}

function renderReplyPreview(){
  const w=$('replyPreview');
  if(!replyingTo){w.innerHTML='';return;}
  const p=state.posts.find(x=>x.id===replyingTo.postId);if(!p){w.innerHTML='';return;}

function renderCalendar(){
  const c=$('viewCal');
  const year=calAnchor.getFullYear(),month=calAnchor.getMonth();
  const first=new Date(year,month,1),last=new Date(year,month+1,0),prevLast=new Date(year,month,0);
  const firstWeek=first.getDay();const cells=[];
  for(let i=firstWeek;i>0;i--){const d=prevLast.getDate()-i+1;cells.push({d:d,other:true,date:new Date(year,month-1,d)});}
  const today=new Date();
  for(let i=1;i<=last.getDate();i++){const ds=new Date(year,month,i);const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===i;cells.push({d:i,other:false,date:ds,today:isToday});}
  while(cells.length<42){const idx=cells.length-(firstWeek+last.getDate())+1;cells.push({d:idx,other:true,date:new Date(year,month+1,idx)});}
  let h='<div class="cal-wrap">';
  h+='<div class="cal-nav"><div class="cal-month">'+year+'年 '+(month+1)+'月</div><div class="cal-btns"><button class="cal-btn" id="calPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="cal-btn" id="calNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></div>';
  h+='<div class="cal-card"><div class="cal-week-row"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="cal-day-grid" id="calDayBox">';
  cells.forEach(cell=>{
    const ds=cell.date.getFullYear()+'-'+pad(cell.date.getMonth()+1)+'-'+pad(cell.date.getDate());
    const todos=state.todos[ds]||[];
    let cls='cal-day-item';
    if(cell.other)cls+=' other-month';
    if(cell.today)cls+=' today';
    if(ds===selectedDate)cls+=' selected';
    let dot='';
    if(!cell.other&&todos.length){const undone=todos.some(t=>!t.done);dot='<div class="cal-dot '+(undone?'':'done')+'"></div>';}
    h+='<div class="'+cls+'" data-date="'+ds+'">'+cell.d+' '+dot+'</div>';
  });
  h+='</div></div>';
  const sd=selectedDate;const sdd=new Date(sd+'T00:00:00');const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
  const todos=state.todos[sd]||[];
  h+='<div class="cal-detail"><div class="cal-detail-head"><div><div class="cal-detail-date">'+(sdd.getMonth()+1)+'月'+sdd.getDate()+'日</div><div class="cal-detail-week">'+weekdays[sdd.getDay()]+'</div></div><button class="cal-detail-add" id="calAddTodo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="cal-todos">';
  if(!todos.length)h+='<div class="cal-empty">还没有待办</div>';
  else todos.forEach(t=>{const u=state.users[t.by];h+='<div class="cal-todo"><div class="cal-check '+(t.done?'done':'')+'" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div><div class="cal-todo-body"><div class="cal-todo-text '+(t.done?'done':'')+'">'+esc(t.text)+'</div><div class="cal-todo-meta">'+esc(u?u.name:'Ta')+' · '+fmtHm(t.createdAt)+'</div></div><button class="cal-todo-del" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';});
  h+='</div>';
  h+='<div class="cal-note"><div class="cal-note-label">备注留言</div>';
  const notes=state.notes[sd];
  if(notes&&typeof notes==='object'&&!Array.isArray(notes)){
    h+='<div class="cal-note-list">';
    Object.keys(notes).forEach(uid=>{const u=state.users[uid];const txt=notes[uid];if(!txt)return;const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();h+='<div class="cal-note-item"><div class="cal-note-av">'+av+'</div><div class="cal-note-content"><div class="cal-note-name">'+esc(u?u.name:'Ta')+'</div><div class="cal-note-text">'+esc(txt)+'</div></div></div>';});
    h+='</div><div class="cal-note-add"><textarea class="cal-note-input" id="calNoteInput" placeholder="添加你的备注…" maxlength="300"></textarea></div>';
  }else{
    const oldTxt=typeof notes==='string'?notes:'';
    if(oldTxt)h+='<div class="cal-note-text" style="margin-bottom:12px;">'+esc(oldTxt)+'</div>';
    h+='<div class="cal-note-add"><textarea class="cal-note-input" id="calNoteInput" placeholder="添加你的备注…" maxlength="300"></textarea></div>';
  }
  h+='</div></div></div>';
  c.innerHTML=h;
  $('calPrev').addEventListener('click',()=>{calAnchor.setMonth(calAnchor.getMonth()-1);renderCalendar();});
  $('calNext').addEventListener('click',()=>{calAnchor.setMonth(calAnchor.getMonth()+1);renderCalendar();});
  c.querySelectorAll('.cal-day-item[data-date]').forEach(el=>{el.addEventListener('click',()=>{selectedDate=el.dataset.date;renderCalendar();});});
  $('calAddTodo').addEventListener('click',()=>openTodoModal(sd));
  c.querySelectorAll('.cal-check').forEach(el=>{el.addEventListener('click',()=>{const t=(state.todos[sd]||[]).find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;saveRoom();renderCalendar();});});
  c.querySelectorAll('.cal-todo-del').forEach(b=>{b.addEventListener('click',()=>{openActionSheet([{text:'删除待办',danger:true,fn:()=>{state.todos[sd]=(state.todos[sd]||[]).filter(x=>x.id!==b.dataset.id);if(!state.todos[sd].length)delete state.todos[sd];saveRoom();renderCalendar();}},{text:'取消',cancel:true}]);});});
  const ni=$('calNoteInput');
  if(ni)ni.addEventListener('blur',()=>{
    const v=ni.value.trim();
    if(!state.notes[sd]||typeof state.notes[sd]!=='object')state.notes[sd]={};
    if(v)state.notes[sd][currentUser]=v;else delete state.notes[sd][currentUser];
    if(!Object.keys(state.notes[sd]).length)delete state.notes[sd];
    saveRoom();renderCalendar();
  });
}

/* ===== 纪念日 ===== */
function renderAnniv(){
  const c=$('viewAnniv');const a=state.anniversary;let main='';
  if(!a||!a.date){main='<div class="anniv-empty"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><div class="anniv-empty-title">还没有设置纪念日</div><button class="btn btn-primary" id="setAnniv">设置纪念日</button></div>';}
  else{
    const start=new Date(a.date+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);
    const days=Math.floor((today-start)/86400000)+1;
    let bgLayer='',bgStyle='';
    if(a.cover&&a.cover.type==='color')bgStyle='background:'+a.cover.value+';';
    else if(a.cover&&a.cover.type==='image'){bgStyle='background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, #fff));';bgLayer='<div class="anniv-bg" style="background-image:url(\''+a.cover.value+'\');--anniv-blur:'+(state.annivBlur||0)+'px;"></div><div class="anniv-overlay"></div>';}
    main='<div class="anniv-card" style="'+bgStyle+'border-radius:'+state.annivRadius+'px;--anniv-blur:'+(state.annivBlur||0)+'px;">'+bgLayer+'<div class="anniv-content"><div class="anniv-label">'+esc(a.label||'在一起')+'</div><div class="anniv-days">'+days+'<span class="anniv-unit">天</span></div><div class="anniv-date">从 '+a.date+'</div></div></div>'+
      '<div class="anniv-btns"><button class="btn btn-ghost" id="editAnniv">编辑</button><button class="btn btn-ghost" id="editAnnivBg">背景</button></div>'+
      '<div class="anniv-controls"><div class="anniv-row"><label><span>圆角</span><span id="rVal">'+state.annivRadius+'px</span></label><input type="range" id="rSlider" min="0" max="75" value="'+state.annivRadius+'"></div><div class="anniv-row"><label><span>背景模糊</span><span id="bVal">'+(state.annivBlur||0)+'px</span></label><input type="range" id="bSlider" min="0" max="20" value="'+(state.annivBlur||0)+'"></div></div>';
  }
  const list=state.customAnnivs||[];
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...list].map(x=>({...x,diff:Math.round((new Date(x.date+'T00:00:00')-today)/86400000)})).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
  let listH='';
  if(!sorted.length)listH='<div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px 0;width:100%;max-width:320px;">还没有自定义纪念日</div>';
  else listH=sorted.map(it=>{
    let txt;
    if(it.diff>0)txt='还有 '+it.diff+' 天';else if(it.diff===0)txt='今天';else txt='已过 '+Math.abs(it.diff)+' 天';
    return '<div class="custom-anniv" data-id="'+it.id+'"><div class="ca-body"><div class="ca-title">'+esc(it.label)+'</div><div class="ca-date">'+it.date+'</div></div><div class="ca-days '+(it.diff===0?'today':'')+'">'+txt+'</div><button class="ca-del" data-id="'+it.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  }).join('');
  c.innerHTML='<div class="anniv-wrap">'+main+'<div class="anniv-sec">自定义纪念日</div>'+listH+'<button class="add-anniv" id="addAnniv">+ 添加纪念日</button></div>';
  if(a&&a.date){
    $('editAnniv').addEventListener('click',editAnniv);
    $('editAnnivBg').addEventListener('click',editAnnivBg);
    const rs=$('rSlider');
    rs.addEventListener('input',()=>{state.annivRadius=parseInt(rs.value);$('rVal').textContent=state.annivRadius+'px';const card=c.querySelector('.anniv-card');if(card)card.style.borderRadius=state.annivRadius+'px';});
    rs.addEventListener('change',()=>saveRoom());
    const bs=$('bSlider');
    bs.addEventListener('input',()=>{state.annivBlur=parseInt(bs.value);$('bVal').textContent=state.annivBlur+'px';const bg=c.querySelector('.anniv-bg');if(bg)bg.style.setProperty('--anniv-blur',state.annivBlur+'px');});
    bs.addEventListener('change',()=>saveRoom());
  }else{$('setAnniv').addEventListener('click',editAnniv);}
  $('addAnniv').addEventListener('click',()=>editCustomAnniv(null));
  c.querySelectorAll('.custom-anniv').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.ca-del'))return;editCustomAnniv(el.dataset.id);});});
  c.querySelectorAll('.ca-del').forEach(b=>{b.addEventListener('click',e=>{e.stopPropagation();openActionSheet([{text:'删除纪念日',danger:true,fn:()=>{state.customAnnivs=state.customAnnivs.filter(x=>x.id!==b.dataset.id);saveRoom();renderAnniv();}},{text:'取消',cancel:true}]);});});
}
function editAnniv(){
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='设置纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称（如：在一起）';lab.maxLength=12;lab.value=state.anniversary?state.anniversary.label||'':'在一起';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';dt.value=state.anniversary?state.anniversary.date||'':'';box.appendChild(dt);

  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{if(!dt.value){alert('请选择日期');return;}const old=state.anniversary&&state.anniversary.cover;state.anniversary={label:lab.value.trim()||'在一起',date:dt.value,cover:old||{type:'gradient'}};saveRoom();$('modal').classList.remove('open');renderAnniv();});
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);

function editAnnivBg(){
  const a=state.anniversary;if(!a)return;
  const cover=a.cover||{type:'gradient'};
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='背景';box.appendChild(t);
  const seg=document.createElement('div');seg.className='seg';seg.style.margin='0 0 14px';
  const bC=document.createElement('button');bC.textContent='纯色';bC.className=cover.type==='color'?'active':'';
  const bI=document.createElement('button');bI.textContent='图片';bI.className=cover.type==='image'?'active':'';
  seg.appendChild(bC);seg.appendChild(bI);box.appendChild(seg);
  const panel=document.createElement('div');box.appendChild(panel);
  function drawC(){
    panel.innerHTML='';
    const ci=document.createElement('input');ci.type='color';ci.value=cover.type==='color'?cover.value:'#007aff';
    ci.style.cssText='width:100%;height:52px;border:none;border-radius:12px;cursor:pointer;background:transparent;';
    panel.appendChild(ci);
    const sw=document.createElement('div');sw.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px;';
    ['#007aff','#5ac8fa','#ff2d55','#ff9500','#34c759','#af52de','#ffcc00','#1c1c1e'].forEach(col=>{const s=document.createElement('div');s.style.cssText='aspect-ratio:1;border-radius:50%;background:'+col+';cursor:pointer;';s.addEventListener('click',()=>{ci.value=col;});sw.appendChild(s);});
    panel.appendChild(sw);panel._get=()=>ci.value;
  }
  function drawI(){
    panel.innerHTML='';
    const btn=document.createElement('button');btn.className='modal-btn confirm';btn.textContent='上传图片';btn.style.width='100%';
    const prev=document.createElement('div');prev.style.cssText='margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg-soft);min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;';prev.textContent=cover.type==='image'?'已设置':'未选择';
    let img=cover.type==='image'?cover.value:null;
    btn.addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{img=ev.target.result;prev.innerHTML='<img src="'+img+'" style="width:100%;display:block;max-height:200px;object-fit:cover;">';};reader.readAsDataURL(f);});
      inp.click();
    });
    panel.appendChild(btn);panel.appendChild(prev);panel._get=()=>img;
  }
  bC.addEventListener('click',()=>{bC.classList.add('active');bI.classList.remove('active');drawC();});
  bI.addEventListener('click',()=>{bI.classList.add('active');bC.classList.remove('active');drawI();});
  if(cover.type==='image')drawI();else drawC();
  const ac=document.createElement('div');ac.className='modal-actions';ac.style.marginTop='14px';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    if(bC.classList.contains('active'))a.cover={type:'color',value:panel._get()};
    else{const img=panel._get();if(!img){alert('请先选择图片');return;}a.cover={type:'image',value:img};}
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}
function editCustomAnniv(id){
  const it=id?state.customAnnivs.find(x=>x.id===id):null;
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent=it?'编辑纪念日':'添加纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称';lab.maxLength=20;lab.value=it?it.label:'';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';dt.value=it?it.date:new Date().toISOString().slice(0,10);box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{
    if(!lab.value.trim()){alert('请输入名称');return;}
    if(!dt.value){alert('请选择日期');return;}
    if(it){it.label=lab.value.trim();it.date=dt.value;}else state.customAnnivs.push({id:genId('a'),label:lab.value.trim(),date:dt.value});
    saveRoom();$('modal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
}

    '<div class="sg"><div class="sg-title">当前房间</div><div class="sg-body">'+
      '<div class="si" id="setRoomName"><div class="si-icon"><svg viewBox="0 0 24 24"><path d="M3 21V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v13"/><path d="M3 21h18M9 21V11h6v10"/></svg></div><div class="si-label">房间名称</div><div class="si-value">'+esc(state.roomName||'未命名')+'</div><div class="si-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>'+
      '<div class="si" style="cursor:default;"><div class="si-icon" style="background:#8e8e93;"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></div><div class="si-label">邀请码</div><div class="si-value" style="font-family:ui-monospace,monospace;letter-spacing:1px;">'+esc(roomCode)+'</div></div>'+
      '<div class="si" id="setCopyCode"><div class="si-icon" style="background:#34c759;"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div><div class="si-label">复制邀请码</div><div class="si-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>'+
    '</div></div>'+
    '<div class="sg"><div class="sg-title">外观</div><div class="sg-body">'+
      '<div class="si" id="setTheme"><div class="si-icon" style="background:#af52de;"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".8" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".8" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".8" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".8" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></div><div class="si-label">主题</div><div class="si-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>'+
    '</div></div>'+
    '<div class="sg"><div class="sg-title">我的房间</div><div class="sg-body" id="roomsList"></div></div>'+
    '<div class="sg"><div class="sg-title">其他</div><div class="sg-body">'+
      '<div class="si danger" id="setExit"><div class="si-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></div><div class="si-label">退出当前房间</div><div class="si-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>'+
    '</div></div>';
  $('setRoomName').addEventListener('click',()=>{
    const box=$('modalBox');box.innerHTML='';
    const t=document.createElement('div');t.className='modal-title';t.textContent='修改房间名';box.appendChild(t);
    const inp=document.createElement('input');inp.className='modal-input';inp.value=state.roomName||'';box.appendChild(inp);
    const ac=document.createElement('div');ac.className='modal-actions';
    const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
    const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
    ok.addEventListener('click',()=>{state.roomName=inp.value.trim()||'未命名';saveRoom();if(myRooms[roomCode]){myRooms[roomCode].name=state.roomName;localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));}$('modal').classList.remove('open');renderSettings();});
    ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
    $('modal').classList.add('open');setTimeout(()=>inp.focus(),100);
  });
  $('setCopyCode').addEventListener('click',()=>{navigator.clipboard.writeText(roomCode).then(()=>{const el=$('setCopyCode');const v=el.querySelector('.si-value');if(v)v.textContent='已复制';}).catch(()=>alert('邀请码：'+roomCode));});
  $('setTheme').addEventListener('click',()=>{$('themePicker').classList.add('open');updateThemeUI();});
  $('setExit').addEventListener('click',()=>{openActionSheet([{text:'退出当前房间',danger:true,fn:()=>{if(pollTimer)clearInterval(pollTimer);roomCode=null;state=null;currentUser=null;showEntry();}},{text:'取消',cancel:true}]);});
  const rl=$('roomsList');rl.innerHTML='';
  Object.keys(myRooms).sort((a,b)=>(myRooms[b].lastVisit||0)-(myRooms[a].lastVisit||0)).forEach(code=>{
    const room=myRooms[code];
    const el=document.createElement('div');el.className='si';
    el.innerHTML='<div class="si-icon" style="background:'+(code===roomCode?'var(--accent)':'#8e8e93')+';"><svg viewBox="0 0 24 24"><path d="M3 21V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v13"/><path d="M3 21h18M9 21V11h6v10"/></svg></div><div class="si-label">'+esc(room.name||code)+'</div>'+(code===roomCode?'<div class="si-value" style="color:var(--accent);">当前</div>':'<div class="si-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>');
    if(code!==roomCode)el.addEventListener('click',()=>{openActionSheet([{text:'切换到「'+(room.name||code)+'」',fn:()=>{if(pollTimer)clearInterval(pollTimer);openRoom(code);}},{text:'取消',cancel:true}]);});
    rl.appendChild(el);
  });
}

/* ===== 图片选择（修复：挂 DOM + 压缩） ===== */
function pickImage(type){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;';
  document.body.appendChild(inp);
  inp.addEventListener('change',e=>{
    const f=e.target.files[0];
    if(!f){document.body.removeChild(inp);return;}
    const maxSide=type==='avatar'?400:1200;
    const quality=type==='avatar'?0.85:0.8;
    compressImage(f,maxSide,quality,(url)=>{
      const u=meUser();
      if(u){
        if(type==='avatar')u.avatar=url;else u.cover=url;
        saveRoom();
        if(currentTab==='me')renderMe();
        if(currentTab==='feed')renderFeed();
      }
      if(inp.parentNode)document.body.removeChild(inp);
    });
  });
  inp.click();
}

/* ===== 编辑器 ===== */
function openEditor(post){
  editingPostId=post?post.id:null;
  editorImages=post?(post.images?post.images.slice():(post.image?[post.image]:[])):[];
  editorScheduleAt=post?post.publishAt:null;
  $('editorText').value=post?post.text||'':'';
  renderEditorPreview();updatePubBtn();
  $('editor').classList.add('open');
  setTimeout(()=>$('editorText').focus(),100);
}
function closeEditor(){$('editor').classList.remove('open');editingPostId=null;editorImages=[];editorScheduleAt=null;$('editorText').value='';}
function renderEditorPreview(){
  const w=$('editorPvWrap');
  if(!editorImages.length){w.innerHTML='';return;}
  w.innerHTML='<div class="editor-pvs">'+editorImages.map((src,i)=>'<div class="editor-pv" data-i="'+i+'">'+(i===0?'<span class="cover-tag">封面</span>':'')+'<img src="'+src+'"><button class="rm" data-i="'+i+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>').join('')+'</div>';
  w.querySelectorAll('.rm').forEach(b=>{b.addEventListener('click',()=>{editorImages.splice(parseInt(b.dataset.i),1);renderEditorPreview();updatePubBtn();});});
}
function updatePubBtn(){$('editorPub').disabled=!($('editorText').value.trim()||editorImages.length);}
$('editorText').addEventListener('input',updatePubBtn);
$('editorCancel').addEventListener('click',closeEditor);
$('toolImg').addEventListener('click',()=>$('editorImg').click());
$('editorImg').addEventListener('change',e=>{
  const files=Array.from(e.target.files||[]);
  if(!files.length)return;
  const remain=9-editorImages.length;
  const list=files.slice(0,remain);
  if(files.length>remain)alert('最多 9 张图片，已截取前 '+remain+' 张');
  let idx=0;
  function next(){
    if(idx>=list.length){e.target.value='';return;}
    compressImage(list[idx++],1280,0.72,(url)=>{editorImages.push(url);renderEditorPreview();updatePubBtn();next();});
  }
  next();
});
$('toolTime').addEventListener('click',()=>{
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='定时发布';box.appendChild(t);
  const inp=document.createElement('input');inp.type='datetime-local';inp.className='modal-input';
  const def=editorScheduleAt?new Date(editorScheduleAt):new Date(Date.now()+3600000);
  inp.value=def.getFullYear()+'-'+pad(def.getMonth()+1)+'-'+pad(def.getDate())+'T'+pad(def.getHours())+':'+pad(def.getMinutes());
  box.appendChild(inp);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{const ts=new Date(inp.value).getTime();if(isNaN(ts)||ts<=Date.now()){alert('请选择未来时间');return;}editorScheduleAt=ts;$('modal').classList.remove('open');});
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('modal').classList.add('open');
});
$('editorPub').addEventListener('click',()=>{
  const text=$('editorText').value.trim();
  if(!text&&!editorImages.length)return;
  if(editingPostId){
    const p=state.posts.find(x=>x.id===editingPostId);if(!p)return;
    p.text=text;p.images=editorImages.slice();delete p.image;
    if(editorScheduleAt)p.publishAt=editorScheduleAt;else delete p.publishAt;
  }else{
    state.posts.push({id:genId('p'),author:currentUser,text:text,images:editorImages.slice(),createdAt:Date.now(),publishAt:editorScheduleAt||null,comments:[],readBy:{}});
  }
  saveRoom();closeEditor();
  if(currentTab==='feed')renderFeed();else if(currentTab==='me')renderMe();
});

/* ===== 全局事件 ===== */
document.getElementById('tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;switchTab(b.dataset.tab);});
$('fab').addEventListener('click',()=>openEditor(null));
$('themeOverlay').addEventListener('click',()=>$('themePicker').classList.remove('open'));
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open');});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});

function tickClock(){const d=new Date();$('statusTime').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}

function boot(){
  tickClock();setInterval(tickClock,1000);
  buildThemeGrid();bindCustomInputs();
  applyTheme(localStorage.getItem(THEME_KEY)||'white');
  setTimeout(()=>{hideLoad();showEntry();},100);
}
boot();

})();
</script>
