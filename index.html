<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>私密房间</title>
<style>
:root,[data-theme="white"]{
  --bg-base:#ffffff;--bg-grouped:#f5f5f7;--bg-card:#ffffff;--bg-soft:#f2f2f7;--bg-input:#f2f2f7;
  --bg-overlay:rgba(0,0,0,.4);--bg-blur:rgba(255,255,255,.78);
  --text-primary:#000000;--text-secondary:#8a8a8e;--text-tertiary:#c4c4c6;--text-placeholder:#b0b0b8;
  --accent:#007aff;--accent-soft:rgba(0,122,255,.1);--accent-shadow:rgba(0,122,255,.22);
  --border:rgba(60,60,67,.09);--border-strong:rgba(60,60,67,.16);
  --danger:#ff3b30;--success:#34c759;--warn:#ff9500;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 6px 20px rgba(0,0,0,.07);--shadow-lg:0 16px 40px rgba(0,0,0,.12);
  --bubble-me:#007aff;--bubble-me-text:#fff;--bubble-ta:#f2f2f7;--bubble-ta-text:#000;
  --quote-bg:rgba(0,0,0,.06);--quote-line:#b0b0b8;
}
[data-theme="cream"]{
  --bg-base:#fdfbf6;--bg-grouped:#f6f2e9;--bg-card:#ffffff;--bg-soft:#f6f2e9;--bg-input:#f1ebdd;
  --bg-overlay:rgba(60,40,20,.35);--bg-blur:rgba(253,251,246,.82);
  --text-primary:#2b2418;--text-secondary:#8a7f6a;--text-tertiary:#c7bda8;--text-placeholder:#b8ad96;
  --accent:#c67c3e;--accent-soft:rgba(198,124,62,.12);--accent-shadow:rgba(198,124,62,.28);
  --border:rgba(80,60,30,.1);--border-strong:rgba(80,60,30,.18);
  --danger:#d94a3d;--success:#6a9e5a;--warn:#d18b2e;
  --shadow-sm:0 1px 3px rgba(120,90,40,.06);--shadow-md:0 4px 16px rgba(120,90,40,.08);--shadow-lg:0 12px 32px rgba(120,90,40,.12);
  --bubble-me:#c67c3e;--bubble-me-text:#fff;--bubble-ta:#f6f2e9;--bubble-ta-text:#2b2418;
  --quote-bg:rgba(80,60,30,.07);--quote-line:#c7bda8;
}
[data-theme="graphite"]{
  --bg-base:#f5f5f7;--bg-grouped:#eaeaec;--bg-card:#ffffff;--bg-soft:#eaeaec;--bg-input:#e5e5e7;
  --bg-overlay:rgba(0,0,0,.4);--bg-blur:rgba(245,245,247,.82);
  --text-primary:#1d1d1f;--text-secondary:#6e6e73;--text-tertiary:#b8b8bc;--text-placeholder:#a5a5a9;
  --accent:#1d1d1f;--accent-soft:rgba(29,29,31,.08);--accent-shadow:rgba(29,29,31,.2);
  --border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15);
  --danger:#ff3b30;--success:#34c759;--warn:#ff9500;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --bubble-me:#1d1d1f;--bubble-me-text:#fff;--bubble-ta:#eaeaec;--bubble-ta-text:#1d1d1f;
  --quote-bg:rgba(0,0,0,.06);--quote-line:#b8b8bc;
}
[data-theme="midnight"]{
  --bg-base:#000000;--bg-grouped:#0d0d0f;--bg-card:#1c1c1e;--bg-soft:#1c1c1e;--bg-input:#2c2c2e;
  --bg-overlay:rgba(0,0,0,.6);--bg-blur:rgba(28,28,30,.78);
  --text-primary:#ffffff;--text-secondary:#8e8e93;--text-tertiary:#48484a;--text-placeholder:#636366;
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.18);--accent-shadow:rgba(10,132,255,.32);
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --danger:#ff453a;--success:#32d74b;--warn:#ff9f0a;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --bubble-me:#0a84ff;--bubble-me-text:#fff;--bubble-ta:#2c2c2e;--bubble-ta-text:#fff;
  --quote-bg:rgba(255,255,255,.08);--quote-line:#636366;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:var(--bg-grouped);color:var(--text-primary);
  display:flex;justify-content:center;align-items:center;transition:background-color .35s,color .35s;
}
.phone{width:100%;max-width:430px;height:100vh;max-height:932px;background:var(--bg-base);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:background-color .35s;}
@media(min-width:480px){.phone{height:92vh;border-radius:48px;box-shadow:var(--shadow-lg),0 0 0 1px var(--border);}}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:env(safe-area-inset-top,0px) 26px 0;height:calc(env(safe-area-inset-top,0px) + 44px);font-size:15px;font-weight:600;color:var(--text-primary);flex-shrink:0;letter-spacing:-.3px;position:relative;z-index:5;}
.status-time{font-variant-numeric:tabular-nums;}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.screen::-webkit-scrollbar{display:none;}
.page{display:none;animation:fadeIn .22s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ===== 新头部：左标题 + 右侧双头像切换 ===== */
.page-hero{padding:8px 20px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.hero-left{flex:1;min-width:0;}
.hero-title{font-size:32px;font-weight:800;letter-spacing:-1.3px;color:var(--text-primary);line-height:1.05;}
.hero-sub{font-size:13px;color:var(--text-secondary);margin-top:4px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hero-pair{display:flex;flex-shrink:0;padding-bottom:2px;}
.hero-pair .mini-av{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);border:2.5px solid var(--bg-base);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:transform .15s;}
.hero-pair .mini-av:active{transform:scale(.9);}
.hero-pair .mini-av+.mini-av{margin-left:-14px;}
.hero-pair .mini-av img{width:100%;height:100%;object-fit:cover;}
.hero-pair .mini-av svg{width:18px;height:18px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.hero-pair .mini-av.me{border-color:var(--accent);}

/* ===== 动态流 ===== */
.feed{padding:0 16px 120px;display:flex;flex-direction:column;gap:18px;}
.feed-hero{position:relative;margin:0 16px 18px;border-radius:26px;overflow:hidden;background:var(--bg-soft);aspect-ratio:16/8;box-shadow:var(--shadow-md);}
.feed-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(var(--hero-blur,0px));transform:scale(1.08);}
.feed-hero-bg.ph{display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);filter:none;transform:none;}
.feed-hero-bg.ph svg{width:44px;height:44px;stroke-width:1.3;fill:none;stroke:currentColor;}
.feed-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.42));}
.feed-hero-av{position:absolute;right:20px;bottom:16px;width:72px;height:72px;border-radius:50%;background:var(--bg-soft);border:4px solid rgba(255,255,255,.95);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;}
.feed-hero-av img{width:100%;height:100%;object-fit:cover;}
.feed-hero-av svg{width:30px;height:30px;stroke-width:1.4;fill:none;stroke:var(--text-tertiary);}
.feed-hero-name{position:absolute;left:20px;bottom:22px;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.4);max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.post{background:var(--bg-card);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:var(--shadow-md);border:1px solid var(--border);}
.post:active{transform:scale(.982);box-shadow:var(--shadow-sm);}
.post-media{width:100%;aspect-ratio:4/3;background:var(--bg-soft);overflow:hidden;position:relative;}
.post-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.post:active .post-media img{transform:scale(1.03);}
.post-body{padding:16px 18px 14px;}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.post-av{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;}
.post-av img{width:100%;height:100%;object-fit:cover;}
.post-av svg{width:20px;height:20px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.post-meta{flex:1;min-width:0;}
.post-name{font-size:15px;font-weight:700;color:var(--text-primary);letter-spacing:-.2px;cursor:pointer;}
.post-time{font-size:12px;color:var(--text-secondary);margin-top:1px;}
.post-time.scheduled{color:var(--warn);}
.post-text{font-size:16px;line-height:1.55;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.2px;}
.post-foot{display:flex;align-items:center;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border);}
.post-stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);font-weight:600;background:var(--bg-soft);padding:5px 11px;border-radius:20px;}
.post-stat svg{width:15px;height:15px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.post-stat.has-cmt{color:var(--accent);background:var(--accent-soft);}
.post-read{margin-left:auto;font-size:12px;color:var(--text-tertiary);font-weight:600;}
.post-read.read{color:var(--success);}
.post-read.pending{color:var(--warn);}

.empty{padding:100px 40px;text-align:center;color:var(--text-secondary);}
.empty svg{width:56px;height:56px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);margin-bottom:18px;}
.empty-title{font-size:17px;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--text-secondary);line-height:1.5;}

/* ===== 详情 ===== */
.detail{position:absolute;inset:0;background:var(--bg-grouped);z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);}
.detail.open{transform:translateX(0);}
.detail-nav{display:flex;align-items:center;gap:8px;padding:env(safe-area-inset-top,0px) 12px 0;height:calc(env(safe-area-inset-top,0px) + 48px);background:var(--bg-blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:2;}
.detail-nav-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;}
.detail-nav-btn svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.detail-nav-title{font-size:16px;font-weight:700;color:var(--text-primary);}
.detail-scroll{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--bg-base);}
.detail-scroll::-webkit-scrollbar{display:none;}
.detail-hero{width:100%;background:var(--bg-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.detail-hero img{width:100%;height:auto;display:block;max-height:60vh;object-fit:contain;}
.detail-body{padding:20px 22px;}
.detail-author{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
.detail-av{width:48px;height:48px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;}
.detail-av img{width:100%;height:100%;object-fit:cover;}
.detail-av svg{width:24px;height:24px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.detail-name{font-size:16px;font-weight:700;color:var(--text-primary);cursor:pointer;}
.detail-time{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.detail-text{font-size:17px;line-height:1.6;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;letter-spacing:-.2px;}

/* ===== 评论区：微信式引用条 + 对齐不乱 ===== */
.cmt-wrap{padding:0 16px 110px;}
.cmt-header{display:flex;align-items:center;justify-content:space-between;padding:16px 6px 14px;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;}
.cmt-list{display:flex;flex-direction:column;gap:16px;}
.cmt{display:flex;gap:10px;align-items:flex-start;}
.cmt-av{width:34px;height:34px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;}
.cmt-av img{width:100%;height:100%;object-fit:cover;}
.cmt-av svg{width:17px;height:17px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.cmt-body{flex:1;min-width:0;}
.cmt-name{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:4px;padding:0 2px;}
.cmt-name .time{font-weight:500;color:var(--text-tertiary);font-size:11px;margin-left:6px;}
.cmt-bubble{background:var(--bg-soft);color:var(--text-primary);padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.55;word-break:break-word;display:block;max-width:100%;}
.cmt.me .cmt-bubble{background:var(--bubble-me);color:var(--bubble-me-text);}
.cmt-reply-quote{display:flex;align-items:stretch;gap:8px;background:var(--quote-bg);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;}
.cmt-reply-quote .bar{width:3px;border-radius:2px;background:var(--quote-line);flex-shrink:0;}
.cmt-reply-quote .q-body{flex:1;min-width:0;}
.cmt-reply-quote .q-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:1px;}
.cmt.me .cmt-reply-quote .q-name{color:var(--bubble-me-text);opacity:.9;}
.cmt-reply-quote .q-text{font-size:13px;color:var(--text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cmt.me .cmt-reply-quote .q-text{color:var(--bubble-me-text);opacity:.85;}
.cmt.me .cmt-reply-quote{background:rgba(255,255,255,.16);}
.cmt.me .cmt-reply-quote .bar{background:rgba(255,255,255,.6);}
.cmt-actions{display:flex;gap:16px;margin-top:6px;padding:0 2px;}
.cmt-actions button{background:none;border:none;padding:0;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.cmt-actions button:active{color:var(--accent);}
.cmt-actions .del:active{color:var(--danger);}
.cmt-show-more{margin-top:8px;font-size:12px;color:var(--accent);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;text-align:left;padding:4px 2px;}

.detail-bar{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg-blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);flex-shrink:0;}
.reply-preview{display:flex;align-items:center;gap:8px;background:var(--quote-bg);border-radius:10px;padding:7px 10px;margin-bottom:8px;font-size:12px;}
.reply-preview .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);}
.reply-preview .rp-body{flex:1;min-width:0;}
.reply-preview .rp-name{font-weight:700;color:var(--accent);}
.reply-preview .rp-text{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.reply-preview .close{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:15px;font-family:inherit;padding:0 4px;}
.detail-bar-row{display:flex;gap:10px;align-items:center;}
.detail-input{flex:1;border:none;background:var(--bg-input);border-radius:22px;padding:11px 18px;font-size:15px;font-family:inherit;color:var(--text-primary);outline:none;border:1.5px solid transparent;transition:border .18s;}
.detail-input:focus{border-color:var(--accent);}
.detail-send{background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:9px 16px;border-radius:20px;transition:transform .15s,opacity .15s;}
.detail-send:active{transform:scale(.95);}
.detail-send:disabled{opacity:.3;pointer-events:none;}

/* ===== Tab Bar：新图标 + 动态小红点 ===== */
.tabbar{position:absolute;bottom:0;left:0;right:0;background:var(--bg-blur);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--border);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-family:inherit;transition:color .2s;position:relative;}
.tab.active{color:var(--accent);}
.tab .tab-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;position:relative;}
.tab svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.tab .lbl{font-size:10px;font-weight:600;}
.tab .dot{position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--bg-base);}

.fab{position:absolute;bottom:calc(88px + env(safe-area-inset-bottom,0px));right:18px;width:58px;height:58px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;box-shadow:0 8px 24px var(--accent-shadow);display:flex;align-items:center;justify-content:center;z-index:20;transition:transform .18s;}
.fab:active{transform:scale(.9);}
.fab svg{width:26px;height:26px;stroke-width:2.4;fill:none;stroke:currentColor;stroke-linecap:round;}
.fab.hidden{display:none;}

/* ===== 全局消息弹窗（顶部滑下） ===== */
.msg-pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:12px;right:12px;background:var(--bg-blur);backdrop-filter:saturate(200%) blur(28px);-webkit-backdrop-filter:saturate(200%) blur(28px);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);border:1px solid var(--border);z-index:120;transform:translateY(-160%);transition:transform .42s cubic-bezier(.16,1,.3,1),opacity .3s;cursor:pointer;opacity:0;}
.msg-pop.show{transform:translateY(0);opacity:1;}
.msg-pop-av{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.msg-pop-av img{width:100%;height:100%;object-fit:cover;}
.msg-pop-av svg{width:19px;height:19px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.msg-pop-body{flex:1;min-width:0;}
.msg-pop-title{font-size:13px;font-weight:700;color:var(--text-primary);}
.msg-pop-text{font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===== 设置 ===== */
.settings{padding:0 16px 120px;}
.sg{margin-bottom:24px;}
.sg-title{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:0 10px 8px;}
.sg-body{background:var(--bg-card);border-radius:20px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.si{display:flex;align-items:center;gap:13px;padding:14px 18px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);}
.si:last-child{border-bottom:none;}
.si:active{background:var(--bg-soft);}
.si-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent);color:#fff;}
.si-icon svg{width:17px;height:17px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.si-label{flex:1;font-size:15px;color:var(--text-primary);font-weight:500;}
.si-value{font-size:13px;color:var(--text-secondary);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.si-arrow{color:var(--text-tertiary);width:16px;height:16px;flex-shrink:0;}
.si-arrow svg{width:100%;height:100%;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}
.si.danger .si-label{color:var(--danger);}
.si.danger .si-icon{background:var(--danger);}

/* ===== 我的 / Ta 的主页 ===== */
.profile{padding-bottom:120px;}
.profile-cover{width:100%;aspect-ratio:16/9;background:var(--bg-soft);overflow:hidden;position:relative;cursor:pointer;border-radius:0 0 28px 28px;}
.profile-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-cover-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.profile-cover-ph svg{width:48px;height:48px;stroke-width:1.3;fill:none;stroke:currentColor;}
.profile-cover .edit-tag{position:absolute;bottom:16px;right:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border-radius:16px;padding:6px 14px;color:#fff;font-size:11px;font-weight:600;}
.profile-header{padding:0 24px;display:flex;align-items:flex-start;gap:18px;margin-top:-44px;position:relative;z-index:2;}
.profile-av{width:88px;height:88px;border-radius:50%;background:var(--bg-soft);border:4px solid var(--bg-base);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 28px rgba(0,0,0,.14);}
.profile-av img{width:100%;height:100%;object-fit:cover;}
.profile-av svg{width:38px;height:38px;stroke-width:1.3;fill:none;stroke:var(--text-tertiary);}
.profile-text{padding-top:52px;flex:1;min-width:0;}
.profile-name{font-size:22px;font-weight:800;letter-spacing:-.6px;color:var(--text-primary);cursor:pointer;word-break:break-word;line-height:1.15;}
.profile-bio{font-size:13px;color:var(--text-secondary);margin-top:5px;cursor:pointer;line-height:1.4;word-break:break-word;}
.profile-bio.empty{color:var(--text-tertiary);font-style:italic;}
.profile-stats{display:flex;gap:10px;padding:18px 20px 6px;}
.stat-card{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow-sm);}
.stat-num{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.5px;}
.stat-lbl{font-size:10px;color:var(--text-secondary);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.profile-section{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:22px 24px 10px;}

/* ===== 日历：CSS Grid 绝对对齐 ===== */
.cal-wrap{padding:0 16px 120px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 16px;}
.cal-month{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text-primary);}
.cal-btns{display:flex;gap:4px;}
.cal-btn{width:34px;height:34px;border-radius:50%;background:var(--bg-soft);border:none;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;}
.cal-btn:active{background:var(--accent-soft);}
.cal-btn svg{width:20px;height:20px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

.cal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;}
.cal-week span{text-align:center;font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.5px;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;cursor:pointer;background:transparent;transition:background .14s,transform .14s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.cal-cell.empty{cursor:default;pointer-events:none;}
.cal-cell:not(.empty):active{transform:scale(.9);}
.cal-cell.today{background:var(--bg-soft);}
.cal-cell.selected{background:var(--accent);box-shadow:0 4px 12px var(--accent-shadow);}
.cal-num{font-size:13px;font-weight:600;color:var(--text-primary);line-height:1;}
.cal-cell.today .cal-num{color:var(--accent);font-weight:800;}
.cal-cell.selected .cal-num{color:#fff;font-weight:800;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.cal-dot.done{background:var(--success);}
.cal-cell.selected .cal-dot{background:rgba(255,255,255,.95);}

.cal-detail{margin-top:16px;background:var(--bg-card);border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);}
.cal-detail-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cal-detail-date{font-size:15px;font-weight:800;color:var(--text-primary);letter-spacing:-.3px;}
.cal-detail-week{font-size:11px;color:var(--text-secondary);margin-top:2px;font-weight:600;}
.cal-detail-add{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px var(--accent-shadow);}
.cal-detail-add svg{width:17px;height:17px;stroke-width:2.4;fill:none;stroke:currentColor;stroke-linecap:round;}
.cal-todos{padding:4px 0;}
.cal-todo{display:flex;align-items:flex-start;gap:11px;padding:10px 18px;}
.cal-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-tertiary);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:all .15s;}
.cal-check.done{background:var(--accent);border-color:var(--accent);}
.cal-check svg{width:12px;height:12px;stroke-width:2.8;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s;}
.cal-check.done svg{opacity:1;}
.cal-todo-body{flex:1;min-width:0;}
.cal-todo-text{font-size:14px;color:var(--text-primary);line-height:1.45;word-break:break-word;font-weight:500;}
.cal-todo-text.done{text-decoration:line-through;color:var(--text-tertiary);}
.cal-todo-meta{font-size:11px;color:var(--text-secondary);margin-top:3px;}
.cal-todo-del{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:5px;flex-shrink:0;}
.cal-todo-del svg{width:15px;height:15px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;}
.cal-empty{padding:24px 18px;text-align:center;color:var(--text-tertiary);font-size:13px;}
.cal-note{padding:14px 18px;border-top:1px solid var(--border);background:var(--bg-soft);}
.cal-note-label{font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.cal-note-text{font-size:13px;color:var(--text-primary);line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.cal-note-input{width:100%;border:none;background:transparent;font-size:13px;font-family:inherit;color:var(--text-primary);outline:none;resize:none;line-height:1.55;min-height:36px;}
.cal-note-input::placeholder{color:var(--text-placeholder);}

/* ===== 纪念日 ===== */
.anniv-wrap{padding:0 20px 120px;display:flex;flex-direction:column;align-items:center;}
.anniv-card{width:100%;max-width:340px;aspect-ratio:1/1;border-radius:32px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, #fff));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden;text-align:center;box-shadow:0 16px 40px var(--accent-shadow);margin:8px auto 0;}
.anniv-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(var(--anniv-blur,0px));z-index:0;transform:scale(1.1);}
.anniv-overlay{position:absolute;inset:0;background:rgba(0,0,0,.22);z-index:1;}
.anniv-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:24px;}
.anniv-label{font-size:16px;opacity:.95;margin-bottom:8px;font-weight:600;letter-spacing:-.3px;}
.anniv-days{font-size:72px;font-weight:800;letter-spacing:-3px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.18);}
.anniv-unit{font-size:16px;font-weight:600;opacity:.9;margin-left:4px;}
.anniv-date{font-size:13px;opacity:.88;margin-top:12px;letter-spacing:.3px;}
.anniv-btns{display:flex;gap:10px;margin-top:20px;}
.anniv-btns .btn{padding:11px 24px;border-radius:14px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:transform .15s;}
.anniv-btns .btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-shadow);}
.btn-ghost{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);}
.anniv-controls{width:100%;max-width:340px;margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.anniv-row{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow-sm);}
.anniv-row label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;}
.anniv-row input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--bg-input);outline:none;}
.anniv-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 6px var(--accent-shadow);}
.anniv-empty{background:var(--bg-card);border-radius:24px;padding:48px 28px;text-align:center;border:1px solid var(--border);width:100%;max-width:340px;box-shadow:var(--shadow-sm);}
.anniv-empty svg{width:48px;height:48px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);margin-bottom:12px;}
.anniv-empty-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:20px;}
.custom-anniv{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;max-width:340px;box-shadow:var(--shadow-sm);transition:transform .15s;}
.custom-anniv:active{transform:scale(.98);background:var(--bg-soft);}
.ca-body{flex:1;min-width:0;}
.ca-title{font-size:14px;font-weight:700;color:var(--text-primary);word-break:break-word;}
.ca-date{font-size:11px;color:var(--text-secondary);margin-top:3px;}
.ca-days{font-size:13px;font-weight:800;color:var(--warn);flex-shrink:0;}
.ca-days.today{color:var(--danger);}
.ca-del{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:5px;flex-shrink:0;}
.ca-del svg{width:15px;height:15px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;}
.add-anniv{width:100%;max-width:340px;padding:14px;border-radius:16px;border:1.5px dashed var(--border-strong);background:transparent;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
.anniv-sec{width:100%;max-width:340px;font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:24px 6px 12px;}

.seg{display:flex;background:var(--bg-soft);border-radius:12px;padding:3px;margin:0 16px 22px;}
.seg button{flex:1;padding:9px;border-radius:9px;background:none;border:none;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .18s;}
.seg button.active{background:var(--bg-card);color:var(--text-primary);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* ===== 编辑器 ===== */
.editor{position:absolute;inset:0;background:var(--bg-base);z-index:80;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);}
.editor.open{transform:translateY(0);}
.editor-nav{display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 12px 0;height:calc(env(safe-area-inset-top,0px) + 48px);border-bottom:1px solid var(--border);flex-shrink:0;}
.editor-nav button{background:none;border:none;font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;padding:8px 14px;border-radius:12px;}
.editor-nav .pub{color:#fff;font-weight:700;background:var(--accent);padding:8px 18px;border-radius:18px;}
.editor-nav .pub:disabled{opacity:.35;pointer-events:none;}
.editor-body{flex:1;padding:26px 22px;overflow-y:auto;}
.editor-ta{width:100%;border:none;background:transparent;resize:none;font-size:18px;line-height:1.55;color:var(--text-primary);outline:none;font-family:inherit;min-height:180px;letter-spacing:-.2px;}
.editor-ta::placeholder{color:var(--text-placeholder);}
.editor-pv{margin-top:18px;border-radius:20px;overflow:hidden;position:relative;box-shadow:var(--shadow-md);}
.editor-pv img{width:100%;display:block;max-height:400px;object-fit:cover;}
.editor-pv .rm{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:34px;height:34px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.editor-pv .rm svg{width:17px;height:17px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}
.editor-tools{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:10px;}
.tool{display:flex;align-items:center;gap:7px;background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:11px 16px;font-size:13px;font-weight:600;color:var(--text-primary);cursor:pointer;font-family:inherit;}
.tool svg{width:19px;height:19px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

/* ===== 模态 ===== */
.modal{position:absolute;inset:0;background:var(--bg-overlay);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;}
.modal.open{opacity:1;visibility:visible;}
.modal-box{background:var(--bg-card);border-radius:24px;padding:24px;width:100%;max-width:340px;max-height:85%;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-title{font-size:18px;font-weight:800;color:var(--text-primary);text-align:center;margin-bottom:20px;letter-spacing:-.3px;}
.modal-input{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border-strong);background:var(--bg-soft);font-size:15px;outline:none;color:var(--text-primary);font-family:inherit;margin-bottom:12px;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s;}
.modal-btn:active{transform:scale(.97);}
.modal-btn.cancel{background:var(--bg-soft);color:var(--text-primary);}
.modal-btn.confirm{background:var(--accent);color:#fff;box-shadow:0 3px 12px var(--accent-shadow);}
.modal-btn.danger{background:var(--danger);color:#fff;}

.sheet{position:absolute;inset:0;background:var(--bg-overlay);backdrop-filter:blur(8px);z-index:100;display:none;align-items:flex-end;padding:12px;}
.sheet.open{display:flex;}
.sheet-box{width:100%;animation:sheetIn .28s cubic-bezier(.16,1,.3,1);}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-btn{display:block;width:100%;padding:17px;background:var(--bg-card);border:none;font-size:16px;font-weight:600;color:var(--accent);border-radius:16px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
.sheet-btn.danger{color:var(--danger);}
.sheet-btn.cancel{color:var(--text-primary);font-weight:700;}

.todo-modal{position:absolute;inset:0;background:var(--bg-overlay);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
.todo-modal.open{opacity:1;visibility:visible;}
.todo-panel{background:var(--bg-base);border-radius:28px 28px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-height:85%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);}
.todo-modal.open .todo-panel{transform:translateY(0);}
.todo-grab{width:38px;height:5px;background:var(--text-tertiary);border-radius:3px;margin:0 auto 18px;}
.todo-title{font-size:19px;font-weight:800;color:var(--text-primary);text-align:center;letter-spacing:-.3px;}
.todo-sub{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px;margin-bottom:18px;}
.todo-input-row{display:flex;gap:10px;margin-bottom:16px;}
.todo-input{flex:1;border:1.5px solid var(--border-strong);background:var(--bg-soft);border-radius:14px;padding:12px 16px;font-size:14px;outline:none;color:var(--text-primary);font-family:inherit;}
.todo-input:focus{border-color:var(--accent);}
.todo-add{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.todo-list{flex:1;overflow-y:auto;scrollbar-width:none;}
.todo-list::-webkit-scrollbar{display:none;}

.crop{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column;padding:16px;color:#fff;}
.crop.open{display:flex;}
.crop-head{display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 0 0;height:calc(env(safe-area-inset-top,0px) + 44px);flex-shrink:0;}
.crop-head button{background:none;border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;padding:8px;}
.crop-head .primary{color:#0a84ff;font-weight:800;}
.crop-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.crop-wrap{position:relative;line-height:0;touch-action:none;user-select:none;}
.crop-wrap img{max-width:100%;max-height:70vh;display:block;border-radius:10px;pointer-events:none;}
.crop-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);box-sizing:border-box;touch-action:none;}
.crop-h{position:absolute;width:28px;height:28px;z-index:2;touch-action:none;}
.crop-h::after{content:'';position:absolute;width:18px;height:18px;border:3px solid #fff;border-radius:3px;}
.crop-h.tl{top:-14px;left:-14px;}.crop-h.tl::after{top:11px;left:11px;border-right:none;border-bottom:none;}
.crop-h.tr{top:-14px;right:-14px;}.crop-h.tr::after{top:11px;right:11px;border-left:none;border-bottom:none;}
.crop-h.bl{bottom:-14px;left:-14px;}.crop-h.bl::after{bottom:11px;left:11px;border-right:none;border-top:none;}
.crop-h.br{bottom:-14px;right:-14px;}.crop-h.br::after{bottom:11px;right:11px;border-left:none;border-top:none;}
.crop-hint{text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin-top:14px;padding:0 20px;}

.theme-picker{position:absolute;inset:0;z-index:200;pointer-events:none;}
.theme-picker.open{pointer-events:auto;}
.theme-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;}
.theme-picker.open .theme-overlay{opacity:1;}
.theme-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg-base);border-radius:28px 28px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow-y:auto;}
.theme-picker.open .theme-panel{transform:translateY(0);}
.theme-grab{width:38px;height:5px;background:var(--text-tertiary);border-radius:3px;margin:0 auto 18px;}
.theme-title{font-size:18px;font-weight:800;color:var(--text-primary);text-align:center;margin-bottom:22px;letter-spacing:-.3px;}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.theme-opt{background:var(--bg-soft);border:2px solid transparent;border-radius:18px;padding:12px;cursor:pointer;position:relative;transition:border .18s;}
.theme-opt.active{border-color:var(--accent);}
.theme-pv{height:64px;border-radius:12px;overflow:hidden;display:flex;margin-bottom:10px;position:relative;border:1px solid var(--border);}
.theme-pv-card{position:absolute;top:8px;left:8px;right:8px;bottom:8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.theme-pv-dot{position:absolute;bottom:7px;right:7px;width:13px;height:13px;border-radius:50%;}
.theme-name{font-size:12px;font-weight:600;color:var(--text-primary);text-align:center;}
.theme-opt.active .theme-name{font-weight:800;color:var(--accent);}
.theme-check{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.custom-panel{background:var(--bg-soft);border-radius:18px;padding:16px;margin-top:4px;display:none;}
.custom-panel.open{display:block;}
.custom-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.custom-row:last-child{margin-bottom:0;}
.custom-row label{flex:1;font-size:13px;font-weight:600;color:var(--text-primary);}
.custom-row input[type=color]{width:48px;height:34px;border:none;border-radius:9px;cursor:pointer;background:transparent;padding:0;}

.entry{position:absolute;inset:0;background:var(--bg-base);z-index:150;display:flex;flex-direction:column;padding:0 24px;overflow-y:auto;transition:opacity .3s,visibility .3s;}
.entry.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.entry-inner{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 calc(40px + env(safe-area-inset-bottom,0px));min-height:100%;justify-content:center;}
.entry-logo{width:80px;height:80px;border-radius:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 16px 40px var(--accent-shadow);}
.entry-logo svg{width:40px;height:40px;stroke-width:1.7;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;}
.entry-title{font-size:28px;font-weight:800;color:var(--text-primary);text-align:center;margin-bottom:8px;letter-spacing:-.6px;}
.entry-sub{font-size:13px;color:var(--text-secondary);text-align:center;margin-bottom:34px;line-height:1.5;}
.entry-sec-title{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:0 6px 12px;}
.entry-room{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s;}
.entry-room:active{transform:scale(.98);background:var(--bg-soft);}
.entry-room-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.entry-room-icon svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.entry-room-info{flex:1;min-width:0;}
.entry-room-name{font-size:15px;font-weight:700;color:var(--text-primary);word-break:break-word;letter-spacing:-.2px;}
.entry-room-code{font-size:11px;color:var(--text-secondary);margin-top:3px;font-family:ui-monospace,monospace;letter-spacing:1.5px;}
.entry-room-arrow{color:var(--text-tertiary);width:16px;height:16px;flex-shrink:0;}
.entry-room-arrow svg{width:100%;height:100%;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}
.entry-divider{font-size:11px;color:var(--text-tertiary);text-align:center;margin:20px 0 16px;letter-spacing:2px;}
.entry-tabs{display:flex;background:var(--bg-soft);border-radius:14px;padding:3px;margin-bottom:20px;}
.entry-tab{flex:1;padding:10px;border-radius:11px;background:none;border:none;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .18s;}
.entry-tab.active{background:var(--bg-card);color:var(--text-primary);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.entry-input{width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--border-strong);background:var(--bg-soft);font-size:15px;margin-bottom:12px;outline:none;color:var(--text-primary);font-family:inherit;}
.entry-input:focus{border-color:var(--accent);}
.entry-input::placeholder{color:var(--text-placeholder);}
.entry-input.code{text-align:center;letter-spacing:6px;font-family:ui-monospace,monospace;text-transform:lowercase;font-size:17px;font-weight:600;}
.entry-input.code::placeholder{letter-spacing:normal;font-family:inherit;text-transform:none;font-weight:400;}
.entry-btn{background:var(--accent);color:#fff;border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;width:100%;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px var(--accent-shadow);transition:transform .15s;}
.entry-btn:active{transform:scale(.98);}
.entry-btn:disabled{opacity:.5;pointer-events:none;}
.entry-err{margin-top:12px;font-size:12px;color:var(--danger);text-align:center;line-height:1.5;}
.entry-hint{margin-top:16px;font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.55;}

.loading{position:absolute;inset:0;background:var(--bg-base);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .3s,visibility .3s;}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.spinner{width:38px;height:38px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text-secondary);font-weight:600;}
.hidden-input{display:none;}
</style>
</head>

(function(){

const THEME_KEY='room_theme_v7';
const CUSTOM_THEME_KEY='room_custom_theme_v7';
const ROOMS_KEY='room_my_rooms_v7';
const LAST_ROOM_KEY='room_last_room_v7';

/* ---------- 颜色工具 ---------- */
function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};}
function rgba(hex,a){const{r,g,b}=hexToRgb(hex);return `rgba(${r},${g},${b},${a})`;}
function isDark(hex){const{r,g,b}=hexToRgb(hex);return(r*.299+g*.587+b*.114)<128;}

function applyTheme(id){
  if(id==='custom'){document.body.setAttribute('data-theme','white');applyCustomTheme();}
  else{
    ['--bg-base','--bg-grouped','--bg-card','--bg-soft','--bg-input','--bg-blur','--text-primary','--text-secondary','--text-tertiary','--text-placeholder','--accent','--accent-soft','--accent-shadow','--border','--border-strong','--danger','--success','--warn','--shadow-sm','--shadow-md','--shadow-lg','--bubble-me','--bubble-me-text','--bubble-ta','--bubble-ta-text','--quote-bg','--quote-line'].forEach(k=>document.documentElement.style.removeProperty(k));
    document.body.setAttribute('data-theme',id);
  }
  localStorage.setItem(THEME_KEY,id);
}
function applyCustomTheme(){
  const ct=customTheme,d=isDark(ct.bg),r=document.documentElement.style;
  r.setProperty('--bg-base',ct.bg);
  r.setProperty('--bg-grouped',d?rgba('#ffffff',.04):rgba('#000000',.03));
  r.setProperty('--bg-card',ct.card);
  r.setProperty('--bg-soft',d?rgba('#ffffff',.06):rgba('#000000',.04));
  r.setProperty('--bg-input',d?rgba('#ffffff',.08):rgba('#000000',.05));
  r.setProperty('--bg-blur',rgba(ct.bg,.85));
  r.setProperty('--text-primary',ct.text);
  r.setProperty('--text-secondary',rgba(ct.text,d?.6:.55));
  r.setProperty('--text-tertiary',rgba(ct.text,.35));
  r.setProperty('--text-placeholder',rgba(ct.text,d?.4:.45));
  r.setProperty('--accent',ct.accent);
  r.setProperty('--accent-soft',rgba(ct.accent,.1));
  r.setProperty('--accent-shadow',rgba(ct.accent,.25));
  r.setProperty('--border',d?rgba('#ffffff',.08):rgba('#000000',.07));
  r.setProperty('--border-strong',d?rgba('#ffffff',.15):rgba('#000000',.15));
  r.setProperty('--danger',d?'#ff453a':'#ff3b30');
  r.setProperty('--success',d?'#32d74b':'#34c759');
  r.setProperty('--warn',d?'#ff9f0a':'#ff9500');
  r.setProperty('--shadow-sm',d?'0 1px 3px rgba(0,0,0,.4)':'0 1px 3px rgba(0,0,0,.04)');
  r.setProperty('--shadow-md',d?'0 4px 16px rgba(0,0,0,.5)':'0 4px 16px rgba(0,0,0,.06)');
  r.setProperty('--shadow-lg',d?'0 12px 32px rgba(0,0,0,.6)':'0 12px 32px rgba(0,0,0,.1)');
  r.setProperty('--bubble-me',ct.accent);
  r.setProperty('--bubble-me-text','#fff');
  r.setProperty('--bubble-ta',d?rgba('#ffffff',.08):rgba('#000000',.05));
  r.setProperty('--bubble-ta-text',ct.text);
  r.setProperty('--quote-bg',d?rgba('#ffffff',.08):rgba('#000000',.06));
  r.setProperty('--quote-line',d?'#636366':'#b0b0b8');
}
function buildThemeGrid(){
  const g=$('themeGrid');g.innerHTML='';
  THEMES.forEach(t=>{
    const el=document.createElement('div');el.className='theme-opt';el.dataset.id=t.id;
    el.innerHTML='<div class="theme-pv" style="background:'+t.bg+';"><div class="theme-pv-card" style="background:'+t.card+';"></div><div class="theme-pv-dot" style="background:'+t.accent+';"></div></div><div class="theme-name">'+t.name+'</div>';
    el.addEventListener('click',()=>{applyTheme(t.id);updateThemeUI();});
    g.appendChild(el);
  });
  const c=document.createElement('div');c.className='theme-opt';c.dataset.id='custom';
  c.innerHTML='<div class="theme-pv" style="background:linear-gradient(135deg,#ff9a9e,#fad0c4 40%,#a1c4fd 80%);"><div class="theme-pv-card" style="background:rgba(255,255,255,.75);"></div><div class="theme-pv-dot" style="background:#007aff;"></div></div><div class="theme-name">自定义</div>';
  c.addEventListener('click',()=>{applyTheme('custom');updateThemeUI();});
  g.appendChild(c);
  updateThemeUI();
}
function updateThemeUI(){
  const cur=localStorage.getItem(THEME_KEY)||'white';
  $('themeGrid').querySelectorAll('.theme-opt').forEach(el=>{
    const on=el.dataset.id===cur;
    el.classList.toggle('active',on);
    const old=el.querySelector('.theme-check');if(old)old.remove();
    if(on){const ch=document.createElement('div');ch.className='theme-check';ch.textContent='✓';el.appendChild(ch);}
  });
  $('customPanel').classList.toggle('open',cur==='custom');
  $('cBg').value=customTheme.bg;
  $('cCard').value=customTheme.card;
  $('cAccent').value=customTheme.accent;
  $('cText').value=customTheme.text;
}
function saveCustom(){
  customTheme={bg:$('cBg').value,card:$('cCard').value,accent:$('cAccent').value,text:$('cText').value};

  if(localStorage.getItem(THEME_KEY)==='custom')applyCustomTheme();

/* ---------- 通用工具 ---------- */
function pad(n){return n.toString().padStart(2,'0');}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmtHm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDt(ts){const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtRel(ts){
  const d=new Date(ts),now=Date.now();
  const diff=Math.floor((now-ts)/1000);
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  if(diff<86400*7)return Math.floor(diff/86400)+'天前';
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts);
}
function fmtPostTime(p){
  if(p.publishAt&&p.publishAt>Date.now())return{text:'定时 · '+fmtDt(p.publishAt),scheduled:true};
  const ts=p.publishAt||p.createdAt||Date.now();
  const d=new Date(ts),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.floor((today-pd)/86400000);
  if(diff===0)return{text:fmtHm(ts),scheduled:false};
  if(diff===1)return{text:'昨天 '+fmtHm(ts),scheduled:false};
  if(diff<7)return{text:diff+'天前',scheduled:false};
  return{text:pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts),scheduled:false};
}
function isPub(p){return !p.publishAt||p.publishAt<=Date.now();}
function partnerKey(){return currentUser==='user1'?'user2':'user1';}
function partnerUser(){return state&&state.users?state.users[partnerKey()]:null;}
function meUser(){return state&&state.users?state.users[currentUser]:null;}
function userByKey(k){return state&&state.users?state.users[k]:null;}
function genId(p){return (p||'id')+Date.now()+Math.random().toString(36).slice(2,7);}
function avSvg(){return '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.2a7.5 7.5 0 0 1 15 0"/></svg>';}

/* ---------- Supabase ---------- */
async function cloudGet(code){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code)+'&select=data',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const arr=await res.json();
  if(!arr.length)return null;
  return arr[0].data;
}
async function cloudInsert(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify([{code:code,data:data,updated_at:new Date().toISOString()}])});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}
async function cloudUpdate(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code),{method:'PATCH',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({data:data,updated_at:new Date().toISOString()})});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}

/* ---------- 房间数据 ---------- */
function emptyRoom(){
  return {users:{user1:null,user2:null},posts:[],anniversary:null,customAnnivs:[],todos:{},notes:{},annivRadius:24,annivBlur:0,roomName:'',notifications:[],createdAt:Date.now(),_v:7};
}
function normRoom(data){
  if(!data||typeof data!=='object')return emptyRoom();
  const d=Object.assign(emptyRoom(),data);
  if(!d.users)d.users={user1:null,user2:null};
  if(!Array.isArray(d.posts))d.posts=[];
  if(!Array.isArray(d.customAnnivs))d.customAnnivs=[];
  if(!Array.isArray(d.notifications))d.notifications=[];
  if(!d.todos||typeof d.todos!=='object')d.todos={};
  if(!d.notes||typeof d.notes!=='object')d.notes={};
  if(typeof d.annivRadius!=='number')d.annivRadius=24;
  if(typeof d.annivBlur!=='number')d.annivBlur=0;
  if(!d.roomName)d.roomName='';
  d.posts.forEach(p=>{
    if(!p.createdAt)p.createdAt=Date.now();
    if(!p.comments)p.comments=[];
    migComments(p.comments);
    if(!p.readBy)p.readBy={};
    if(!p.id)p.id=genId('p');
  });
  return d;
}
function migComments(arr){
  arr.forEach(c=>{
    if(!c.id)c.id=genId('c');
    if(!c.replies)c.replies=[];
    if(c.createdAt===undefined)c.createdAt=Date.now();
    if(c.replies.length)migComments(c.replies);
  });
}

function saveRoom(){
  if(!roomCode||!state)return;
  localStorage.setItem('cache_'+roomCode,JSON.stringify(state));
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRoom,700);
}
async function pushRoom(){
  if(!roomCode||!state||isSyncing)return;
  const js=JSON.stringify(state);
  if(js===lastSyncedJSON)return;
  isSyncing=true;
  try{await cloudUpdate(roomCode,state);lastSyncedJSON=js;}
  catch(e){console.warn('同步失败',e);setTimeout(()=>{isSyncing=false;pushRoom();},2000);return;}
  isSyncing=false;
}
async function pullRoom(){
  if(!roomCode||isSyncing)return;
  try{
    const data=await cloudGet(roomCode);
    if(!data)return;
    const n=normRoom(data);
    const js=JSON.stringify(n);
    if(js!==lastSyncedJSON){
      const old=state;
      state=n;
      lastSyncedJSON=js;
      localStorage.setItem('cache_'+roomCode,js);
      detectNewComments(old,n);
      rerenderCurrent();
    }
  }catch(e){}
}
function rerenderCurrent(){
  if(currentTab==='feed')renderFeed();
  else if(currentTab==='me')renderMe();
  else if(currentTab==='partner')renderPartner();
  else if(currentTab==='other')renderOther();
  else if(currentTab==='settings')renderSettings();
  if(detailPostId&&$('detail').classList.contains('open'))renderDetail(detailPostId);
  updateFeedDot();
}

/* ---------- 检测新评论 ---------- */
function detectNewComments(oldS,newS){
  if(!oldS||!currentUser)return;
  const pk=partnerKey();
  let hasNew=false;
  newS.posts.forEach(p=>{
    if(p.author!==currentUser)return;
    const oldP=oldS.posts?oldS.posts.find(x=>x.id===p.id):null;
    const oldCnt=oldP?countAllComments(oldP.comments||[]):0;
    const newCnt=countAllComments(p.comments||[]);
    if(newCnt>oldCnt){
      const latest=findLatestCommentBy(p.comments,pk);
      if(latest){
        // 已存在相同通知就不重复弹
        if(!newS.notifications)newS.notifications=[];
        const dup=newS.notifications.some(n=>n.type==='comment'&&n.from===pk&&n.postId===p.id&&n.text===latest.text);
        if(!dup){
          newS.notifications.unshift({id:genId('n'),type:'comment',postId:p.id,from:pk,text:latest.text,createdAt:Date.now(),read:false});
          if(newS.notifications.length>80)newS.notifications.length=80;
          showMsgPop(latest.text,pk,p.id);
          hasNew=true;
        }
      }
    }
  });
  if(hasNew){
    unreadInteractions++;
    updateFeedDot();
  }
}

function updateFeedDot(){

}

/* ---------- 计数 ---------- */
function countAllComments(arr){let n=0;arr.forEach(c=>{n++;if(c.replies)n+=countAllComments(c.replies);});return n;}
function findLatestCommentBy(arr,author){
  let l=null;
  arr.forEach(c=>{
    if(c.author===author&&(!l||(c.createdAt||0)>(l.createdAt||0)))l=c;
    if(c.replies){const r=findLatestCommentBy(c.replies,author);if(r&&(!l||(r.createdAt||0)>(l.createdAt||0)))l=r;}
  });
  return l;
}
function findComment(arr,id){for(const c of arr){if(c.id===id)return c;const r=findComment(c.replies||[],id);if(r)return r;}return null;}
function rmComment(arr,id){for(let i=0;i<arr.length;i++){if(arr[i].id===id){arr.splice(i,1);return true;}if(arr[i].replies&&rmComment(arr[i].replies,id))return true;}return false;}
function findParentComment(arr,childId){
  for(const c of arr){
    if(c.replies&&c.replies.some(r=>r.id===childId))return c;
    if(c.replies){const p=findParentComment(c.replies,childId);if(p)return p;}
  }
  return null;
}

    tJoin.addEventListener('click',()=>{mode='join';draw();});
    tabs.appendChild(tCreate);tabs.appendChild(tJoin);c.appendChild(tabs);

    const codeInput=document.createElement('input');
    codeInput.type='text';codeInput.className='entry-input code';codeInput.placeholder='邀请码 4字母+4数字';codeInput.maxLength=8;codeInput.autocomplete='off';
    c.appendChild(codeInput);
    const nameInput=document.createElement('input');
    nameInput.type='text';nameInput.className='entry-input';nameInput.placeholder='你的昵称';nameInput.maxLength=16;nameInput.autocomplete='off';
    c.appendChild(nameInput);
    const btn=document.createElement('button');btn.className='entry-btn';btn.textContent=mode==='create'?'创建并进入':'进入房间';c.appendChild(btn);
    const hint=document.createElement('div');hint.className='entry-hint';
    hint.textContent=mode==='create'?'邀请码自己定，4个小写字母 + 4个数字':'输入邀请码 + 你注册时的昵称';
    c.appendChild(hint);
    const err=document.createElement('div');err.className='entry-err';c.appendChild(err);

    codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);});

    const submit=async()=>{
      err.textContent='';
      const code=codeInput.value.trim().toLowerCase();
      const name=nameInput.value.trim();
      if(!/^[a-z]{4}[0-9]{4}$/.test(code)){err.textContent='邀请码格式：4个小写字母 + 4个数字';codeInput.focus();return;}
      if(!name){err.textContent='请输入昵称';nameInput.focus();return;}
      btn.disabled=true;btn.textContent='处理中…';
      try{
        const existing=await cloudGet(code);
        if(mode==='create'){
          if(existing){
            const d=normRoom(existing);
            let slot=null;
            if(d.users.user1&&d.users.user1.name===name)slot='user1';
            else if(d.users.user2&&d.users.user2.name===name)slot='user2';
            else if(!d.users.user1)slot='user1';
            else if(!d.users.user2)slot='user2';
            else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='创建并进入';return;}
            if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
            if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};

            myIdentities[code]=slot;
            myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
            myRooms[code].lastVisit=Date.now();
            localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
            localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
            await openRoom(code,name);
            return;
          }
          const data=emptyRoom();
          data.users.user1={name:name,bio:'',avatar:null,cover:null};
          data.roomName='房间 '+code;
          await cloudInsert(code,data);
          myRooms[code]={name:data.roomName,joinedAt:Date.now(),lastVisit:Date.now()};
          myIdentities[code]='user1';
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }else{
          if(!existing){err.textContent='房间不存在，检查邀请码';btn.disabled=false;btn.textContent='进入房间';return;}
          const d=normRoom(existing);
          let slot=null;
          if(d.users.user1&&d.users.user1.name===name)slot='user1';
          else if(d.users.user2&&d.users.user2.name===name)slot='user2';
          else if(!d.users.user1)slot='user1';
          else if(!d.users.user2)slot='user2';
          else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='进入房间';return;}
          if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
          if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};
          await cloudUpdate(code,d);
          myIdentities[code]=slot;
          myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
          myRooms[code].lastVisit=Date.now();
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }
      }catch(e){
        console.error(e);
        err.textContent='网络错误：'+e.message;
        btn.disabled=false;btn.textContent=mode==='create'?'创建并进入':'进入房间';
      }
    };
    btn.addEventListener('click',submit);
    codeInput.addEventListener('keypress',e=>{if(e.key==='Enter')nameInput.focus();});
    nameInput.addEventListener('keypress',e=>{if(e.key==='Enter')submit();});
    setTimeout(()=>codeInput.focus(),100);
  }
  draw();
}

async function openRoom(code,name){
  showLoad('正在进入…');
  try{
    const data=await cloudGet(code);
    if(!data)throw new Error('房间不存在');
    state=normRoom(data);
    roomCode=code;
    currentUser=myIdentities[code];
    if(!currentUser){
      if(name){
        if(state.users.user1&&state.users.user1.name===name)currentUser='user1';
        else if(state.users.user2&&state.users.user2.name===name)currentUser='user2';
      }
      if(!currentUser){hideLoad();showEntry();return;}
      myIdentities[code]=currentUser;
      localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
    }
    localStorage.setItem(LAST_ROOM_KEY,code);
    lastSyncedJSON=JSON.stringify(state);
    localStorage.setItem('cache_'+code,lastSyncedJSON);
    if(!myRooms[code])myRooms[code]={name:state.roomName||('房间 '+code),joinedAt:Date.now()};
    myRooms[code].lastVisit=Date.now();
    localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
    const t=new Date();
    selectedDate=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
    hideLoad();
    enterMain();
  }catch(e){
    console.error(e);
    hideLoad();
    alert('进入失败：'+e.message);
    showEntry();
  }
}

/* ---------- 详情 ---------- */
function openDetail(postId){
  if(!state)return;
  const p=state.posts.find(x=>x.id===postId);
  if(!p)return;
  detailPostId=postId;
  replyingTo=null;
  renderDetail(postId);
  $('detail').classList.add('open');
  $('detailInput').value='';
  $('detailSend').disabled=true;
  renderReplyPreview();
  if(p.author!==currentUser){
    if(!p.readBy)p.readBy={};
    if(!p.readBy[currentUser]){p.readBy[currentUser]=Date.now();saveRoom();}
  }
}
function closeDetail(){$('detail').classList.remove('open');detailPostId=null;replyingTo=null;}

function renderDetail(postId){
  const p=state.posts.find(x=>x.id===postId);
  if(!p)return;
  const u=state.users[p.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const t=fmtPostTime(p);
  $('detailHero').innerHTML=p.image?'<div class="detail-hero"><img src="'+p.image+'"></div>':'';
  $('detailAv').innerHTML=av;
  $('detailName').textContent=name;
  $('detailTime').textContent=t.text;
  $('detailText').textContent=p.text||'';
  $('detailAv').onclick=()=>{closeDetail();if(p.author===currentUser)switchTab('me');else switchTab('partner');};
  $('detailName').onclick=$('detailAv').onclick;
  const cs=p.comments||[];
  $('cmtCount').textContent=cs.length>0?countAllComments(cs)+' 条':'';
  if(!cs.length){
    $('cmtList').innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:30px 0;">还没有评论</div>';
  }else{
    $('cmtList').innerHTML=cs.map(c=>renderComment(c,postId)).join('');
  }
  bindDetailEvents();
}

/* 渲染一条评论（微信式引用条，对齐不乱） */
function renderComment(c,postId){
  const u=state.users[c.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const isMe=c.author===currentUser;
  const canDel=isMe;
  // 找被引用的父评论
  let quoteHtml='';
  if(c.replyTo){
    const parent=findComment((state.posts.find(x=>x.id===postId).comments||[]),c.replyTo);
    if(parent){
      const pu=state.users[parent.author];
      quoteHtml='<div class="cmt-reply-quote"><div class="bar"></div><div class="q-body"><div class="q-name">'+esc(pu?pu.name:'Ta')+'</div><div class="q-text">'+esc(parent.text||'')+'</div></div></div>';
    }
  }
  const timeStr=fmtRel(c.createdAt||Date.now());
  return '<div class="cmt '+(isMe?'me':'')+'" data-comment-id="'+c.id+'">'+
    '<div class="cmt-av" data-uid="'+c.author+'">'+av+'</div>'+
    '<div class="cmt-body">'+
      '<div class="cmt-name">'+esc(name)+'<span class="time">'+timeStr+'</span></div>'+
      '<div class="cmt-bubble">'+quoteHtml+esc(c.text||'')+'</div>'+
      '<div class="cmt-actions">'+
        '<button class="reply-btn" data-post-id="'+postId+'" data-comment-id="'+c.id+'">回复</button>'+
        (canDel?'<button class="del" data-post-id="'+postId+'" data-comment-id="'+c.id+'">删除</button>':'')+
      '</div>'+
    '</div>'+
  '</div>';
}

function bindDetailEvents(){
  $('cmtList').querySelectorAll('.del').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!confirm('删除这条评论？'))return;
      const p=state.posts.find(x=>x.id===b.dataset.postId);
      if(!p)return;
      rmComment(p.comments,b.dataset.commentId);
      saveRoom();renderDetail(detailPostId);
    });
  });
  $('cmtList').querySelectorAll('.reply-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const pid=b.dataset.postId,cid=b.dataset.commentId;
      const p=state.posts.find(x=>x.id===pid);
      if(!p)return;
      const c=findComment(p.comments,cid);
      if(!c)return;
      replyingTo={postId:pid,commentId:cid};
      renderReplyPreview();
      $('detailInput').focus();
    });
  });
  $('cmtList').querySelectorAll('.cmt-av').forEach(el=>{
    el.addEventListener('click',()=>{
      const uid=el.dataset.uid;
      if(!uid)return;
      closeDetail();
      if(uid===currentUser)switchTab('me');else switchTab('partner');
    });
  });
}

function renderReplyPreview(){
  const w=$('replyPreview');
  if(!replyingTo){w.innerHTML='';return;}
  const p=state.posts.find(x=>x.id===replyingTo.postId);
  if(!p){w.innerHTML='';return;}
  const c=findComment(p.comments||[],replyingTo.commentId);
  if(!c){w.innerHTML='';return;}
  const u=state.users[c.author];
  w.innerHTML='<div class="reply-preview"><div class="bar"></div><div class="rp-body"><div class="rp-name">'+esc(u?u.name:'Ta')+'</div><div class="rp-text">'+esc(c.text||'')+'</div></div><button class="close" id="rpClose">✕</button></div>';
  $('rpClose').addEventListener('click',()=>{replyingTo=null;renderReplyPreview();});
}

/* 输入框事件 */
$('detailInput').addEventListener('input',e=>{$('detailSend').disabled=!e.target.value.trim();});
$('detailInput').addEventListener('keypress',e=>{if(e.key==='Enter')$('detailSend').click();});
$('detailSend').addEventListener('click',()=>{
  const v=$('detailInput').value.trim();
  if(!v||!detailPostId)return;
  const p=state.posts.find(x=>x.id===detailPostId);
  if(!p)return;
  const nc={id:genId('c'),author:currentUser,text:v,replies:[],createdAt:Date.now()};

});
