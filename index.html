<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>喵喵说 · icity</title>
<link rel="icon" href="🐱图标URL🐱" type="image/png">
<link rel="apple-touch-icon" href="🐱图标URL🐱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="喵喵说">
<style>
/* ========== 基础 Token（与主题无关，固定不变） ========== */
:root{
  --radius-xs:6px; --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-xl:22px; --radius-full:9999px;
  --space-2:4px; --space-3:6px; --space-4:8px; --space-5:12px; --space-6:16px; --space-7:20px; --space-8:24px;
  --shadow-subtle: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-normal: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-elevated: 0 8px 24px rgba(0,0,0,0.08);
  --blur-light: saturate(180%) blur(16px);
  --blur-heavy: saturate(200%) blur(24px);
  --ease-ios: cubic-bezier(0.17, 0.89, 0.32, 1.00);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{
  height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:var(--bg-grouped);color:var(--text-primary);
  display:flex;justify-content:center;align-items:center;transition:background-color .35s,color .35s;
}
.phone{
  width:100%;max-width:430px;
  height:100vh;height:100dvh;
  max-height:100vh;max-height:100dvh;
  background:var(--bg-base);overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:background-color .35s;
}
@media(min-width:480px){
  .phone{height:92vh;height:92dvh;max-height:932px;border-radius:48px;box-shadow:var(--shadow-elevated),0 0 0 1px var(--border);}
}

.status-bar{
  height:calc(env(safe-area-inset-top,0px) + 40px);
  padding:env(safe-area-inset-top,0px) 20px 0;
  background:var(--bg-base);color:var(--text-primary);
  display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:600;letter-spacing:-.3px;
  flex-shrink:0;position:relative;z-index:5;
}
.status-time{font-variant-numeric:tabular-nums;}
.status-right{display:flex;gap:5px;align-items:center;font-size:13px;}
.status-right svg{width:16px;height:16px;fill:currentColor;}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.screen::-webkit-scrollbar{display:none;}
.page{display:none;animation:pageIn .25s var(--ease-ios);}
.page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.page-hero{padding:var(--space-3) var(--space-6) var(--space-6);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);}
.hero-left{flex:1;min-width:0;}
.hero-title{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--text-primary);line-height:1.05;}
.hero-sub{font-size:12px;color:var(--text-secondary);margin-top:var(--space-2);letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hero-pair{display:flex;flex-shrink:0;padding-bottom:2px;}
.hero-pair .mini-av{width:38px;height:38px;border-radius:50%;background:var(--bg-soft);border:2.5px solid var(--bg-base);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-subtle);transition:transform .15s;}
.hero-pair .mini-av:active{transform:scale(.96);}
.hero-pair .mini-av+.mini-av{margin-left:-13px;}
.hero-pair .mini-av img{width:100%;height:100%;object-fit:cover;}
.hero-pair .mini-av svg{width:17px;height:17px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.hero-pair .mini-av.me{border-color:var(--accent);}

.feed{padding:0 var(--space-5) 120px;display:flex;gap:var(--space-4);align-items:flex-start;}
.feed .feed-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-4);}

.post{background:var(--bg-card);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:transform .18s var(--ease-ios),box-shadow .18s,opacity .2s;box-shadow:var(--shadow-subtle);border:1px solid var(--border);}
.post:active{transform:scale(.988);box-shadow:var(--shadow-subtle);}
.post.hidden-post{opacity:.5;}
.post.hidden-post .post-text{filter:blur(3px);}
.post.hidden-post .post-media img{filter:blur(3px);}
.post-media{width:100%;background:var(--bg-soft);overflow:hidden;position:relative;line-height:0;}
.post-media img{width:100%;height:auto;display:block;transition:transform .4s;}
.post:active .post-media img{transform:scale(1.02);}
.post-body{padding:var(--space-5) var(--space-5) var(--space-4);}
.post-head{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-4);}
.post-av{width:28px;height:28px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-subtle);cursor:pointer;}
.post-av img{width:100%;height:100%;object-fit:cover;}
.post-av svg{width:15px;height:15px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.post-meta{flex:1;min-width:0;}
.post-name{font-size:12.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-time{font-size:10.5px;color:var(--text-secondary);margin-top:1px;}
.post-time.scheduled{color:var(--warn);}
.post-text{font-size:13.5px;line-height:1.55;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.2px;}
.post-foot{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5) var(--space-5);border-top:1px solid var(--border);}
.post-stat{display:flex;align-items:center;gap:var(--space-2);font-size:10.5px;color:var(--text-secondary);font-weight:600;background:var(--bg-soft);padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);}
.post-stat svg{width:12px;height:12px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.post-stat.has-cmt{color:var(--accent);background:var(--accent-soft);}
.post-read{margin-left:auto;font-size:10.5px;color:var(--text-tertiary);font-weight:600;}
.post-read.read{color:var(--success);}
.post-read.pending{color:var(--warn);}
.post-more{margin-left:auto;background:none;border:none;padding:4px 6px;cursor:pointer;display:flex;align-items:center;border-radius:6px;color:var(--text-tertiary);}
.post-more:active{background:var(--bg-soft);}
.post-more svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}

.empty{padding:100px var(--space-8);text-align:center;color:var(--text-secondary);}
.empty svg{width:56px;height:56px;stroke-width:1.2;fill:none;stroke:var(--text-tertiary);margin-bottom:var(--space-6);}
.empty-title{font-size:17px;font-weight:700;color:var(--text-primary);margin-bottom:var(--space-3);}
.empty-sub{font-size:14px;color:var(--text-secondary);line-height:1.5;}

.notify-wrap{padding:0 var(--space-5) 120px;}
.notify-group{margin-bottom:var(--space-6);}
.notify-group-title{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:0 var(--space-5) var(--space-4);}
.notify-item{display:flex;gap:var(--space-5);padding:var(--space-5) var(--space-6);background:var(--bg-card);border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;}
.notify-item:active{background:var(--bg-soft);}
.notify-item:first-child{border-radius:var(--radius-md) var(--radius-md) 0 0;}
.notify-item:last-child{border-radius:0 0 var(--radius-md) var(--radius-md);border-bottom:none;}
.notify-av{width:36px;height:36px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-subtle);}
.notify-av img{width:100%;height:100%;object-fit:cover;}
.notify-av svg{width:18px;height:18px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.notify-body{flex:1;min-width:0;}
.notify-name{font-size:13px;font-weight:700;color:var(--text-primary);}
.notify-text{font-size:12.5px;color:var(--text-secondary);margin-top:2px;line-height:1.45;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.notify-time{font-size:10.5px;color:var(--text-tertiary);margin-top:var(--space-2);}
.notify-item.unread::after{content:'';position:absolute;top:50%;left:var(--space-4);transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--accent);}
.notify-toolbar{display:flex;justify-content:flex-end;padding:0 var(--space-5) var(--space-5);}
.notify-toolbar button{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 8px;}

.detail{position:absolute;inset:0;background:var(--bg-grouped);z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .34s var(--ease-ios);}
.detail.open{transform:translateX(0);}
.detail-nav{display:flex;align-items:center;gap:var(--space-4);padding:env(safe-area-inset-top,0px) var(--space-5) 0;height:calc(env(safe-area-inset-top,0px) + 46px);background:var(--bg-blur);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);border-bottom:1px solid var(--border);flex-shrink:0;z-index:2;}
.detail-nav-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;}
.detail-nav-btn svg{width:21px;height:21px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.detail-nav-title{font-size:15px;font-weight:700;color:var(--text-primary);}
.detail-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;background:var(--bg-base);}
.detail-scroll::-webkit-scrollbar{display:none;}
.detail-hero{width:100%;background:var(--bg-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.detail-hero img{width:100%;height:auto;display:block;max-height:60vh;object-fit:contain;}
.detail-body{padding:var(--space-6) var(--space-7);}
.detail-author{display:flex;align-items:center;gap:var(--space-5);margin-bottom:var(--space-6);}
.detail-av{width:44px;height:44px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-subtle);cursor:pointer;}
.detail-av img{width:100%;height:100%;object-fit:cover;}
.detail-av svg{width:22px;height:22px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.detail-name{font-size:15px;font-weight:700;color:var(--text-primary);cursor:pointer;}
.detail-time{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.detail-text{font-size:16px;line-height:1.6;color:var(--text-primary);word-break:break-word;white-space:pre-wrap;letter-spacing:-.2px;}

.cmt-wrap{padding:0 var(--space-5) 110px;}
.cmt-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-6) var(--space-4) var(--space-5);font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;}
.cmt-list{display:flex;flex-direction:column;gap:var(--space-6);}
.cmt{display:flex;gap:var(--space-5);align-items:flex-start;}
.cmt-av{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-subtle);cursor:pointer;}
.cmt-av img{width:100%;height:100%;object-fit:cover;}
.cmt-av svg{width:16px;height:16px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.cmt-body{flex:1;min-width:0;}
.cmt-name{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:var(--space-2);padding:0 2px;}
.cmt-name .time{font-weight:500;color:var(--text-tertiary);font-size:11px;margin-left:var(--space-3);}
.cmt-bubble{background:var(--bubble-ta);color:var(--bubble-ta-text);padding:var(--space-5) var(--space-6);border-radius:var(--radius-lg);font-size:14px;line-height:1.55;word-break:break-word;display:block;max-width:100%;}
.cmt.me .cmt-bubble{background:var(--bubble-me);color:var(--bubble-me-text);}
.cmt-reply-quote{display:flex;align-items:stretch;gap:var(--space-4);background:var(--quote-bg);border-radius:var(--radius-sm);padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);cursor:pointer;}
.cmt-reply-quote .bar{width:3px;border-radius:2px;background:var(--quote-line);flex-shrink:0;}
.cmt-reply-quote .q-body{flex:1;min-width:0;}
.cmt-reply-quote .q-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:1px;}
.cmt.me .cmt-reply-quote .q-name{color:var(--bubble-me-text);opacity:.9;}
.cmt-reply-quote .q-text{font-size:12px;color:var(--text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cmt.me .cmt-reply-quote .q-text{color:var(--bubble-me-text);opacity:.85;}
.cmt.me .cmt-reply-quote{background:rgba(255,255,255,.16);}
.cmt.me .cmt-reply-quote .bar{background:rgba(255,255,255,.6);}
.cmt-actions{display:flex;gap:var(--space-6);margin-top:var(--space-3);padding:0 2px;}
.cmt-actions button{background:none;border:none;padding:0;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.cmt-actions button:active{color:var(--accent);}
.cmt-actions .del:active{color:var(--danger);}

.detail-bar{padding:var(--space-4) var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom,0px));background:var(--bg-blur);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);border-top:1px solid var(--border);flex-shrink:0;}
.reply-preview{display:flex;align-items:center;gap:var(--space-4);background:var(--quote-bg);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-5);margin-bottom:var(--space-4);font-size:12px;}
.reply-preview .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);}
.reply-preview .rp-body{flex:1;min-width:0;}
.reply-preview .rp-name{font-weight:700;color:var(--accent);}
.reply-preview .rp-text{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.reply-preview .close{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:15px;font-family:inherit;padding:0 var(--space-2);}
.detail-bar-row{display:flex;gap:var(--space-5);align-items:center;}
.detail-input{flex:1;border:none;background:var(--bg-input);border-radius:var(--radius-xl);padding:var(--space-5) var(--space-6);font-size:14px;font-family:inherit;color:var(--text-primary);outline:none;border:1.5px solid transparent;transition:border .18s;}
.detail-input:focus{border-color:var(--accent);}
.detail-send{background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:var(--space-4) var(--space-6);border-radius:var(--radius-xl);transition:transform .15s var(--ease-ios);}
.detail-send:active{transform:scale(.97);}
.detail-send:disabled{opacity:.3;pointer-events:none;}

.tabbar{position:absolute;bottom:0;left:0;right:0;background:var(--bg-blur);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border-top:1px solid var(--border);display:flex;padding:var(--space-2) var(--space-4) calc(var(--space-2) + env(safe-area-inset-bottom,0px));z-index:30;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-3) 0;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-family:inherit;transition:color .2s;position:relative;}
.tab.active{color:var(--accent);}
.tab .tab-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;position:relative;}
.tab svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.tab .lbl{font-size:10px;font-weight:600;}
.tab .dot{position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--bg-base);}
.tab .dot.num{width:auto;min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;top:-3px;right:-6px;}

.fab{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:var(--space-6);width:54px;height:54px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;box-shadow:var(--shadow-normal);display:flex;align-items:center;justify-content:center;z-index:20;transition:transform .18s var(--ease-ios);}
.fab:active{transform:scale(.94);}
.fab svg{width:24px;height:24px;stroke-width:2.4;fill:none;stroke:currentColor;stroke-linecap:round;}
.fab.hidden{display:none;}

.msg-pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);left:var(--space-5);right:var(--space-5);background:var(--bg-blur);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);display:flex;align-items:center;gap:var(--space-5);box-shadow:var(--shadow-elevated);border:1px solid var(--border);z-index:120;transform:translateY(-160%);transition:transform .42s var(--ease-ios),opacity .3s;cursor:pointer;opacity:0;}
.msg-pop.show{transform:translateY(0);opacity:1;}
.msg-pop-av{width:38px;height:38px;border-radius:50%;background:var(--bg-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.msg-pop-av img{width:100%;height:100%;object-fit:cover;}
.msg-pop-av svg{width:18px;height:18px;stroke-width:1.6;fill:none;stroke:var(--text-tertiary);}
.msg-pop-body{flex:1;min-width:0;}
.msg-pop-title{font-size:13px;font-weight:700;color:var(--text-primary);}
.msg-pop-text{font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.settings{padding:0 var(--space-5) 120px;}
.sg{margin-bottom:var(--space-7);}
.sg-title{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:0 var(--space-5) var(--space-4);}
.sg-body{background:var(--bg-card);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-subtle);}
.si{display:flex;align-items:center;gap:var(--space-5);padding:var(--space-6) var(--space-6);cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);}
.si:last-child{border-bottom:none;}
.si:active{background:var(--bg-soft);}
.si-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent);color:#fff;}
.si-icon svg{width:16px;height:16px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.si-label{flex:1;font-size:14px;color:var(--text-primary);font-weight:500;}
.si-value{font-size:12px;color:var(--text-secondary);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.si-arrow{color:var(--text-tertiary);width:15px;height:15px;flex-shrink:0;}
.si-arrow svg{width:100%;height:100%;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;}
.si.danger .si-label{color:var(--danger);}
.si.danger .si-icon{background:var(--danger);}

.profile{padding-bottom:120px;background:var(--bg-grouped);min-height:100%;}
.profile-hero{position:relative;height:230px;overflow:hidden;background:var(--bg-soft);}
.profile-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-hero-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);background:linear-gradient(135deg,var(--accent-soft),var(--bg-soft));}
.profile-hero-ph svg{width:52px;height:52px;stroke-width:1.3;fill:none;stroke:currentColor;}
.profile-hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 100%);pointer-events:none;}

  position:relative;

  user-select:none;

  position:absolute;
  top:50%;left:50%;
  transform-origin:center center;
  pointer-events:none;
  -webkit-user-drag:none;
  max-width:none;
  will-change:transform;
}

.crop-mask{
  position:absolute;inset:0;pointer-events:none;
}
.crop-viewport.square .crop-mask{
  box-shadow:inset 0 0 0 9999px rgba(0,0,0,.55);
}
.crop-viewport.round .crop-mask{
  background:radial-gradient(circle at center, transparent 0, transparent calc(50% - 1px), rgba(0,0,0,.55) calc(50% - 1px));
}

.crop-frame{
  position:absolute;inset:0;pointer-events:none;
  border:1.5px solid rgba(255,255,255,.9);
}
.crop-viewport.round .crop-frame{ border:none; }
.crop-viewport.round .crop-frame::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.9);
}
.crop-viewport.square .crop-frame .crop-grid{
  position:absolute;inset:0;
  background:
    linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,.25) calc(33.33% - 1px), rgba(255,255,255,.25) calc(33.33% + 0px), transparent calc(33.33% + 0px)),
    linear-gradient(to right, transparent calc(66.66% - 1px), rgba(255,255,255,.25) calc(66.66% - 1px), rgba(255,255,255,.25) calc(66.66% + 0px), transparent calc(66.66% + 0px)),
    linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,.25) calc(33.33% - 1px), rgba(255,255,255,.25) calc(33.33% + 0px), transparent calc(33.33% + 0px)),
    linear-gradient(to bottom, transparent calc(66.66% - 1px), rgba(255,255,255,.25) calc(66.66% - 1px), rgba(255,255,255,.25) calc(66.66% + 0px), transparent calc(66.66% + 0px));
}
.crop-viewport.round .crop-frame .crop-grid{ display:none; }

.crop-foot{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));
  flex-shrink:0;
}
.crop-reset{
  background:rgba(255,255,255,.14);border:none;color:#fff;
  font-size:13px;font-weight:600;font-family:inherit;
  padding:9px 16px;border-radius:10px;cursor:pointer;
}
.crop-reset:active{background:rgba(255,255,255,.24);}
.crop-zoom{flex:1;display:flex;align-items:center;gap:10px;}
.crop-zoom svg{
  width:18px;height:18px;stroke:rgba(255,255,255,.75);
  stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;
}
.crop-zoom input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;border-radius:2px;background:rgba(255,255,255,.25);outline:none;
}
.crop-zoom input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:#fff;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* ========== 主题选择器 ========== */
.theme-picker{position:absolute;inset:0;z-index:200;pointer-events:none;}
.theme-picker.open{pointer-events:auto;}
.theme-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;}
.theme-picker.open .theme-overlay{opacity:1;}
.theme-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg-base);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:var(--space-5) var(--space-7) calc(var(--space-8) + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s var(--ease-ios);max-height:85%;overflow-y:auto;}
.theme-picker.open .theme-panel{transform:translateY(0);}
.theme-grab{width:38px;height:5px;background:var(--text-tertiary);border-radius:3px;margin:0 auto var(--space-6);}
.theme-title{font-size:17px;font-weight:800;color:var(--text-primary);text-align:center;margin-bottom:var(--space-7);letter-spacing:-.3px;}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-5);margin-bottom:var(--space-6);}
.theme-opt{background:var(--bg-soft);border:2px solid transparent;border-radius:var(--radius-lg);padding:var(--space-5);cursor:pointer;position:relative;transition:border .18s;}
.theme-opt.active{border-color:var(--accent);}
.theme-pv{height:58px;border-radius:var(--radius-md);overflow:hidden;display:flex;margin-bottom:var(--space-4);position:relative;border:1px solid var(--border);}
.theme-pv-card{position:absolute;top:8px;left:8px;right:8px;bottom:8px;border-radius:var(--radius-sm);box-shadow:var(--shadow-subtle);}
.theme-pv-dot{position:absolute;bottom:7px;right:7px;width:12px;height:12px;border-radius:50%;}
.theme-name{font-size:12px;font-weight:600;color:var(--text-primary);text-align:center;}
.theme-opt.active .theme-name{font-weight:800;color:var(--accent);}
.theme-check{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.custom-panel{background:var(--bg-soft);border-radius:var(--radius-lg);padding:var(--space-6);margin-top:var(--space-4);display:none;}
.custom-panel.open{display:block;}
.custom-row{display:flex;align-items:center;gap:var(--space-5);margin-bottom:var(--space-5);}
.custom-row:last-child{margin-bottom:0;}
.custom-row label{flex:1;font-size:13px;font-weight:600;color:var(--text-primary);}
.custom-row input[type=color]{width:46px;height:32px;border:none;border-radius:var(--radius-sm);cursor:pointer;background:transparent;padding:0;}

/* ========== 入口页 ========== */
.entry{
  position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;
  padding:0 var(--space-7);overflow-y:auto;
  transition:opacity .3s var(--ease-ios),visibility .3s;
  background:
    linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.30)),
    url('🎨背景图URL🎨') center/cover no-repeat,
    var(--bg-base);
}
.entry.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.entry-inner{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 calc(40px + env(safe-area-inset-bottom,0px));
  min-height:100%;justify-content:center;
  animation:entryIn .6s var(--ease-ios) both;
}
@keyframes entryIn{
  from{opacity:0;transform:translateY(24px) scale(.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.entry-logo{
  width:76px;height:76px;border-radius:var(--radius-xl);background:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-7);
  box-shadow:var(--shadow-elevated);overflow:hidden;
  animation:logoPop .7s var(--ease-ios) .1s both;
}
@keyframes logoPop{
  0%{opacity:0;transform:scale(.5) rotate(-12deg);}
  60%{opacity:1;transform:scale(1.08) rotate(3deg);}
  100%{opacity:1;transform:scale(1) rotate(0);}
}
.entry-logo svg{width:38px;height:38px;stroke-width:1.7;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;}
.entry-logo img{width:100%;height:100%;object-fit:cover;}
.entry-title{font-size:26px;font-weight:800;color:#fff;text-align:center;margin-bottom:var(--space-4);letter-spacing:-.6px;text-shadow:0 2px 10px rgba(0,0,0,.35);animation:entryIn .6s var(--ease-ios) .15s both;}
.entry-sub{font-size:13px;color:rgba(255,255,255,.85);text-align:center;margin-bottom:var(--space-8);line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,.3);animation:entryIn .6s var(--ease-ios) .22s both;}
.entry-sec-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.8px;padding:0 var(--space-3) var(--space-5);text-shadow:0 1px 4px rgba(0,0,0,.3);}
.entry-room-scroll{display:flex;gap:var(--space-5);overflow-x:auto;scrollbar-width:none;padding-bottom:var(--space-4);margin-bottom:var(--space-6);-webkit-overflow-scrolling:touch;animation:entryIn .6s var(--ease-ios) .3s both;}
.entry-room-scroll::-webkit-scrollbar{display:none;}
.entry-room{flex:0 0 200px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;align-items:center;gap:var(--space-5);cursor:pointer;box-shadow:var(--shadow-subtle);transition:transform .15s var(--ease-ios);}
.entry-room:active{transform:scale(.98);background:var(--bg-soft);}
.entry-room-icon{width:42px;height:42px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.entry-room-icon svg{width:21px;height:21px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.entry-room-info{flex:1;min-width:0;}
.entry-room-name{font-size:14px;font-weight:700;color:var(--text-primary);word-break:break-word;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry-room-code{font-size:11px;color:var(--text-secondary);margin-top:var(--space-2);font-family:ui-monospace,monospace;letter-spacing:1.5px;}
.entry-divider{font-size:11px;color:rgba(255,255,255,.8);text-align:center;margin:var(--space-6) 0 var(--space-5);letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.3);}
.entry-tabs{display:flex;background:rgba(255,255,255,.9);border-radius:var(--radius-md);padding:3px;margin-bottom:var(--space-6);animation:entryIn .6s var(--ease-ios) .3s both;}
.entry-tab{flex:1;padding:var(--space-4);border-radius:var(--radius-sm);background:none;border:none;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .18s;}
.entry-tab.active{background:var(--bg-card);color:var(--text-primary);font-weight:700;box-shadow:var(--shadow-subtle);}
.entry-input{width:100%;padding:var(--space-6);border-radius:var(--radius-md);border:1.5px solid var(--border-strong);background:rgba(255,255,255,.92);font-size:15px;margin-bottom:var(--space-5);outline:none;color:var(--text-primary);font-family:inherit;animation:entryIn .6s var(--ease-ios) .35s both;}
.entry-input:focus{border-color:var(--accent);}
.entry-input::placeholder{color:var(--text-placeholder);}
.entry-input.code{text-align:center;letter-spacing:6px;font-family:ui-monospace,monospace;text-transform:lowercase;font-size:16px;font-weight:600;}
.entry-input.code::placeholder{letter-spacing:normal;font-family:inherit;text-transform:none;font-weight:400;}
.entry-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);padding:var(--space-6);font-size:16px;font-weight:700;width:100%;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-subtle);transition:transform .15s var(--ease-ios);animation:entryIn .6s var(--ease-ios) .4s both;}
.entry-btn:active{transform:scale(.98);}
.entry-btn:disabled{opacity:.5;pointer-events:none;}
.entry-err{margin-top:var(--space-5);font-size:12px;color:#ffd6d6;text-align:center;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.entry-hint{margin-top:var(--space-6);font-size:12px;color:rgba(255,255,255,.85);text-align:center;line-height:1.55;text-shadow:0 1px 4px rgba(0,0,0,.3);}

.loading{position:absolute;inset:0;background:var(--bg-base);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-7);transition:opacity .3s var(--ease-ios),visibility .3s;}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text-secondary);font-weight:600;}
.hidden-input{display:none;}
</style>
<style id="themeVars"></style>
</head>
<body>
<div class="phone" id="phone">
  <div class="loading" id="loading"><div class="spinner"></div><div class="loading-text" id="loadingText">连接中…</div></div>
  <div class="entry hidden" id="entry"><div class="entry-inner" id="entryInner"></div></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">00:00</div>
    <div class="status-right">
      <svg viewBox="0 0 24 24"><path d="M2 20h3v-6H2v6zm5 0h3v-10H7v10zm5 0h3V7h-3v13zm5 0h3V4h-3v16z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.5c-.9-.7-2.1-1.1-3.5-1.1s-2.6.4-3.5 1.1L12 21zm0-7c1.8 0 3.5.6 4.9 1.6L18.5 13c-1.8-1.3-4-2-6.5-2s-4.7.7-6.5 2l1.6 2.6C8.5 14.6 10.2 14 12 14zm0-5c2.8 0 5.4.9 7.5 2.4L21 8.7C18.4 6.9 15.3 6 12 6s-6.4.9-9 2.7l1.5 2.7C6.6 9.9 9.2 9 12 9z"/></svg>
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="9" width="12" height="6" rx="1" fill="currentColor"/><rect x="21" y="10.5" width="1.5" height="3" rx=".7" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="msg-pop" id="msgPop"><div class="msg-pop-av" id="msgPopAv"></div><div class="msg-pop-body"><div class="msg-pop-title" id="msgPopTitle"></div><div class="msg-pop-text" id="msgPopText"></div></div></div>

  <div class="screen" id="screen" style="display:none;">
    <div class="page active" id="page-feed">
      <div class="page-hero">
        <div class="hero-left">
          <div class="hero-title">动态</div>
          <div class="hero-sub" id="feedSub">你和 Ta 的专属空间</div>
        </div>
        <div class="hero-pair" id="heroPair"></div>
      </div>
      <div class="feed" id="feedList"></div>
    </div>

    <div class="page" id="page-notify">
      <div class="page-hero">
        <div class="hero-left"><div class="hero-title">通知</div><div class="hero-sub" id="notifySub">评论与互动</div></div>
        <div class="hero-pair" id="notifyPair"></div>
      </div>
      <div class="notify-wrap" id="notifyList"></div>
    </div>

    <div class="page" id="page-other">
      <div class="page-hero">
        <div class="hero-left"><div class="hero-title">其他</div></div>
        <div class="hero-pair" id="otherPair"></div>
      </div>
      <div class="seg"><button class="active" id="segCal">日历</button><button id="segAnniv">纪念日</button></div>
      <div id="viewCal"></div>
      <div id="viewAnniv" style="display:none;"></div>
    </div>

    <div class="page" id="page-me"><div class="profile" id="meProfile"></div></div>

    <div class="page" id="page-settings">
      <div class="page-hero"><div class="hero-left"><div class="hero-title">设置</div></div></div>
      <div class="settings" id="settingsBox"></div>
    </div>

    <div class="page" id="page-partner"><div class="profile" id="partnerProfile"></div></div>
  </div>

  <div class="tabbar" id="tabbar" style="display:none;">
    <button class="tab active" data-tab="feed">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v7A2.5 2.5 0 0 1 17.5 17H9l-3.6 3.1A.8.8 0 0 1 4 19.5z"/><path d="M8 9.5h8M8 13h5"/></svg><span class="dot" id="feedDot" style="display:none;"></span></div>
      <span class="lbl">动态</span>
    </button>
    <button class="tab" data-tab="notify">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot" id="notifyDot" style="display:none;"></span></div>
      <span class="lbl">通知</span>
    </button>
    <button class="tab" data-tab="other">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 2.8v4M16 2.8v4M3.5 10h17"/><circle cx="8.5" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r=".9" fill="currentColor" stroke="none"/></svg></div>
      <span class="lbl">其他</span>
    </button>
    <button class="tab" data-tab="me">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.2a7.5 7.5 0 0 1 15 0"/></svg></div>
      <span class="lbl">我</span>
    </button>
    <button class="tab" data-tab="settings">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/></svg></div>
      <span class="lbl">设置</span>
    </button>
  </div>

  <button class="fab hidden" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="detail" id="detail">
    <div class="detail-nav"><button class="detail-nav-btn" id="detailBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="detail-nav-title">动态</div></div>
    <div class="detail-scroll" id="detailScroll">
      <div id="detailHero"></div>
      <div class="detail-body">
        <div class="detail-author"><div class="detail-av" id="detailAv"></div><div><div class="detail-name" id="detailName"></div><div class="detail-time" id="detailTime"></div></div></div>

    <div class="detail-bar">
      <div id="replyPreview"></div>
      <div class="detail-bar-row">
        <input type="text" class="detail-input" id="detailInput" placeholder="写下评论…">

  </div>

  <div class="editor" id="editor">

    <input type="file" id="editorImg" class="hidden-input" accept="image/*">
  </div>

  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
  <div class="todo-modal" id="todoModal">
    <div class="todo-panel"><div class="todo-grab"></div><div class="todo-title" id="todoTitle"></div><div class="todo-sub" id="todoSub"></div><div class="todo-input-row"><input type="text" class="todo-input" id="todoInput" placeholder="添加待办…" maxlength="60"><button class="todo-add" id="todoAdd">添加</button></div><div class="todo-list" id="todoList"></div></div>
  </div>
  <div class="sheet" id="sheet"><div class="sheet-box" id="sheetBox"></div></div>

  <div class="crop" id="crop">
    <div class="crop-head">
      <button id="cropCancel">取消</button>
      <div class="crop-title" id="cropTitle">裁剪</div>
      <button class="primary" id="cropConfirm">完成</button>
    </div>
    <div class="crop-stage" id="cropStage">
      <div class="crop-viewport" id="cropViewport">
        <img id="cropImg" src="" alt="">
        <div class="crop-mask" id="cropMask"></div>
        <div class="crop-frame" id="cropFrame">
          <div class="crop-grid"></div>
        </div>
      </div>
    </div>
    <div class="crop-foot">
      <button class="crop-reset" id="cropReset">还原</button>
      <div class="crop-zoom">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6M11 8v6"/></svg>
        <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
      </div>
    </div>
  </div>

  <div class="theme-picker" id="themePicker">
    <div class="theme-overlay" id="themeOverlay"></div>
    <div class="theme-panel"><div class="theme-grab"></div><div class="theme-title">主题</div><div class="theme-grid" id="themeGrid"></div>
      <div class="custom-panel" id="customPanel">
        <div class="custom-row"><label>背景色</label><input type="color" id="cBg" value="#ffffff"></div>
        <div class="custom-row"><label>卡片色</label><input type="color" id="cCard" value="#ffffff"></div>
        <div class="custom-row"><label>主色调</label><input type="color" id="cAccent" value="#007aff"></div>
        <div class="custom-row"><label>文字色</label><input type="color" id="cText" value="#000000"></div>
        <div class="custom-row"><label>我的气泡</label><input type="color" id="cBubbleMe" value="#007aff"></div>
        <div class="custom-row"><label>对方气泡</label><input type="color" id="cBubbleTa" value="#f2f2f7"></div>

function hex2rgb(hex){
  hex = String(hex).replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  return {r:parseInt(hex.slice(0,2),16), g:parseInt(hex.slice(2,4),16), b:parseInt(hex.slice(4,6),16)};
}
function rgbaOf(hex, a){
  const {r,g,b} = hex2rgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function isDarkColor(hex){
  const {r,g,b} = hex2rgb(hex);

}

}

function pad(n){return n.toString().padStart(2,'0');}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmtHm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDt(ts){const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtRel(ts){
  const now=Date.now(),diff=Math.floor((now-ts)/1000);
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  if(diff<86400*7)return Math.floor(diff/86400)+'天前';
  const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts);
}
function fmtPostTime(p){
  if(p.publishAt&&p.publishAt>Date.now())return{text:'定时 · '+fmtDt(p.publishAt),scheduled:true};
  const ts=p.publishAt||p.createdAt||Date.now();
  const d=new Date(ts),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.floor((today-pd)/86400000);
  if(diff===0)return{text:fmtHm(ts),scheduled:false};
  if(diff===1)return{text:'昨天 '+fmtHm(ts),scheduled:false};
  if(diff<7)return{text:diff+'天前',scheduled:false};
  return{text:pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtHm(ts),scheduled:false};
}
function isPub(p){return !p.publishAt||p.publishAt<=Date.now();}

async function cloudGet(code){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code)+'&select=data',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const arr=await res.json();
  if(!arr.length)return null;
  return arr[0].data;
}
async function cloudInsert(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify([{code:code,data:data,updated_at:new Date().toISOString()}])});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}
async function cloudUpdate(code,data){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rooms?code=eq.'+encodeURIComponent(code),{method:'PATCH',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({data:data,updated_at:new Date().toISOString()})});
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}

function emptyRoom(){
  return {users:{user1:null,user2:null},posts:[],anniversary:null,customAnnivs:[],todos:{},notes:{},annivRadius:24,annivBlur:0,roomName:'',notifications:[],createdAt:Date.now(),_v:8};
}
function normRoom(data){
  if(!data||typeof data!=='object')return emptyRoom();
  const d=Object.assign(emptyRoom(),data);
  if(!d.users)d.users={user1:null,user2:null};
  if(!Array.isArray(d.posts))d.posts=[];
  if(!Array.isArray(d.customAnnivs))d.customAnnivs=[];
  if(!Array.isArray(d.notifications))d.notifications=[];
  if(!d.todos||typeof d.todos!=='object')d.todos={};
  if(!d.notes||typeof d.notes!=='object')d.notes={};
  if(typeof d.annivRadius!=='number')d.annivRadius=24;
  if(typeof d.annivBlur!=='number')d.annivBlur=0;
  if(!d.roomName)d.roomName='';
  d.posts.forEach(p=>{
    if(!p.createdAt)p.createdAt=Date.now();
    if(!p.comments)p.comments=[];
    migComments(p.comments);
    if(!p.readBy)p.readBy={};
    if(!p.id)p.id=genId('p');
  });
  return d;
}
function migComments(arr){
  arr.forEach(c=>{
    if(!c.id)c.id=genId('c');
    if(!c.replies)c.replies=[];
    if(c.createdAt===undefined)c.createdAt=Date.now();
    if(c.replies.length)migComments(c.replies);
  });
}
function saveRoom(){
  if(!roomCode||!state)return;
  localStorage.setItem('cache_'+roomCode,JSON.stringify(state));
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRoom,700);
}
async function pushRoom(){
  if(!roomCode||!state||isSyncing)return;
  const js=JSON.stringify(state);
  if(js===lastSyncedJSON)return;
  isSyncing=true;
  try{await cloudUpdate(roomCode,state);lastSyncedJSON=js;}
  catch(e){console.warn('同步失败',e);setTimeout(()=>{isSyncing=false;pushRoom();},2000);return;}
  isSyncing=false;
}
async function pullRoom(){
  if(!roomCode||isSyncing)return;
  try{
    const data=await cloudGet(roomCode);
    if(!data)return;
    const n=normRoom(data);
    const js=JSON.stringify(n);
    if(js!==lastSyncedJSON){
      const old=state;
      state=n;
      lastSyncedJSON=js;
      localStorage.setItem('cache_'+roomCode,js);
      detectNewComments(old,n);
      rerenderCurrent();
    }
  }catch(e){}
}
function rerenderCurrent(){
  if(currentTab==='feed')renderFeed();
  else if(currentTab==='notify')renderNotify();
  else if(currentTab==='me')renderMe();
  else if(currentTab==='partner')renderPartner();
  else if(currentTab==='other')renderOther();
  else if(currentTab==='settings')renderSettings();
  if(detailPostId&&$('detail').classList.contains('open'))renderDetail(detailPostId);
  updateBadges();
}
function detectNewComments(oldS,newS){
  if(!oldS||!currentUser)return;
  const pk=partnerKey();
  let hasNew=false;
  newS.posts.forEach(p=>{
    if(p.author!==currentUser)return;
    const oldP=oldS.posts?oldS.posts.find(x=>x.id===p.id):null;
    const oldCnt=oldP?countAllComments(oldP.comments||[]):0;
    const newCnt=countAllComments(p.comments||[]);
    if(newCnt>oldCnt){
      const latest=findLatestCommentBy(p.comments,pk);
      if(latest){
        if(!newS.notifications)newS.notifications=[];
        const dup=newS.notifications.some(n=>n.type==='comment'&&n.from===pk&&n.postId===p.id&&n.text===latest.text);
        if(!dup){
          newS.notifications.unshift({id:genId('n'),type:'comment',postId:p.id,from:pk,text:latest.text,createdAt:Date.now(),read:false});
          if(newS.notifications.length>80)newS.notifications.length=80;
          showMsgPop(latest.text,pk,p.id);
          hasNew=true;
        }
      }
    }
  });
  if(hasNew){unreadInteractions++;updateBadges();}
}
function showMsgPop(text,fromKey,postId){
  const u=userByKey(fromKey);
  $('msgPopAv').innerHTML=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  $('msgPopTitle').textContent=(u?u.name:'Ta')+' 评论了你';
  $('msgPopText').textContent=text;
  const el=$('msgPop');
  el.classList.add('show');
  el.onclick=()=>{el.classList.remove('show');if(postId)openDetail(postId);};
  clearTimeout(msgPopTimer);
  msgPopTimer=setTimeout(()=>el.classList.remove('show'),4200);
}
function markAllRead(){
  if(!state)return;
  (state.notifications||[]).forEach(n=>{n.read=true;});
  unreadInteractions=0;
  updateBadges();
  saveRoom();
}
function updateBadges(){
  if(!state)return;
  const unread=(state.notifications||[]).filter(n=>!n.read).length;
  const has=unread>0||unreadInteractions>0;
  const fdot=$('feedDot'),ndot=$('notifyDot');
  if(fdot){
    fdot.style.display=has?'block':'none';
    fdot.textContent=unread>9?'9+':(unread||'');
    fdot.classList.toggle('num',unread>0);
  }
  if(ndot){
    ndot.style.display=has?'block':'none';
    ndot.textContent=unread>9?'9+':(unread||'');
    ndot.classList.toggle('num',unread>0);
  }
}
function countAllComments(arr){let n=0;arr.forEach(c=>{n++;if(c.replies)n+=countAllComments(c.replies);});return n;}
function findLatestCommentBy(arr,author){
  let l=null;
  arr.forEach(c=>{
    if(c.author===author&&(!l||(c.createdAt||0)>(l.createdAt||0)))l=c;
    if(c.replies){const r=findLatestCommentBy(c.replies,author);if(r&&(!l||(r.createdAt||0)>(l.createdAt||0)))l=r;}
  });
  return l;
}
function findComment(arr,id){for(const c of arr){if(c.id===id)return c;const r=findComment(c.replies||[],id);if(r)return r;}return null;}
function rmComment(arr,id){for(let i=0;i<arr.length;i++){if(arr[i].id===id){arr.splice(i,1);return true;}if(arr[i].replies&&rmComment(arr[i].replies,id))return true;}return false;}

    const tJoin=document.createElement('button');tJoin.className='entry-tab'+(mode==='join'?' active':'');tJoin.textContent='加入房间';
    tJoin.addEventListener('click',()=>{mode='join';draw();});
    tabs.appendChild(tCreate);tabs.appendChild(tJoin);c.appendChild(tabs);

    const codeInput=document.createElement('input');
    codeInput.type='text';codeInput.className='entry-input code';codeInput.placeholder='邀请码 4字母+4数字';codeInput.maxLength=8;codeInput.autocomplete='off';
    c.appendChild(codeInput);
    const nameInput=document.createElement('input');
    nameInput.type='text';nameInput.className='entry-input';nameInput.placeholder='你的昵称';nameInput.maxLength=16;nameInput.autocomplete='off';
    c.appendChild(nameInput);
    const btn=document.createElement('button');btn.className='entry-btn';btn.textContent=mode==='create'?'创建并进入':'进入房间';c.appendChild(btn);
    const hint=document.createElement('div');hint.className='entry-hint';
    hint.textContent=mode==='create'?'邀请码自己定，4个小写字母 + 4个数字':'输入邀请码 + 你注册时的昵称';
    c.appendChild(hint);
    const err=document.createElement('div');err.className='entry-err';c.appendChild(err);

    codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);});

    const submit=async()=>{
      err.textContent='';
      const code=codeInput.value.trim().toLowerCase();
      const name=nameInput.value.trim();
      if(!/^[a-z]{4}[0-9]{4}$/.test(code)){err.textContent='邀请码格式：4个小写字母 + 4个数字';codeInput.focus();return;}
      if(!name){err.textContent='请输入昵称';nameInput.focus();return;}
      btn.disabled=true;btn.textContent='处理中…';
      try{
        const existing=await cloudGet(code);
        if(mode==='create'){
          if(existing){
            const d=normRoom(existing);
            let slot=null;
            if(d.users.user1&&d.users.user1.name===name)slot='user1';
            else if(d.users.user2&&d.users.user2.name===name)slot='user2';
            else if(!d.users.user1)slot='user1';
            else if(!d.users.user2)slot='user2';
            else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='创建并进入';return;}
            if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
            if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,d);
            myIdentities[code]=slot;
            myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
            myRooms[code].lastVisit=Date.now();
            localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
            localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
            await openRoom(code,name);
            return;
          }
          const data=emptyRoom();
          data.users.user1={name:name,bio:'',avatar:null,cover:null};
          data.roomName='房间 '+code;
          await cloudInsert(code,data);
          myRooms[code]={name:data.roomName,joinedAt:Date.now(),lastVisit:Date.now()};
          myIdentities[code]='user1';
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }else{
          if(!existing){err.textContent='房间不存在，检查邀请码';btn.disabled=false;btn.textContent='进入房间';return;}
          const d=normRoom(existing);
          let slot=null;
          if(d.users.user1&&d.users.user1.name===name)slot='user1';
          else if(d.users.user2&&d.users.user2.name===name)slot='user2';
          else if(!d.users.user1)slot='user1';
          else if(!d.users.user2)slot='user2';
          else{err.textContent='房间已满，名字不匹配';btn.disabled=false;btn.textContent='进入房间';return;}
          if(slot==='user1'&&!d.users.user1)d.users.user1={name:name,bio:'',avatar:null,cover:null};
          if(slot==='user2'&&!d.users.user2)d.users.user2={name:name,bio:'',avatar:null,cover:null};
          await cloudUpdate(code,d);
          myIdentities[code]=slot;
          myRooms[code]=myRooms[code]||{name:d.roomName||('房间 '+code),joinedAt:Date.now()};
          myRooms[code].lastVisit=Date.now();
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }
      }catch(e){
        console.error(e);
        err.textContent='网络错误：'+e.message;
        btn.disabled=false;btn.textContent=mode==='create'?'创建并进入':'进入房间';
      }
    };
    btn.addEventListener('click',submit);
    codeInput.addEventListener('keypress',e=>{if(e.key==='Enter')nameInput.focus();});
    nameInput.addEventListener('keypress',e=>{if(e.key==='Enter')submit();});
    setTimeout(()=>codeInput.focus(),100);
  }
  draw();
}

async function openRoom(code,name){
  showLoad('正在进入…');
  try{
    const data=await cloudGet(code);
    if(!data)throw new Error('房间不存在');
    state=normRoom(data);
    roomCode=code;
    currentUser=myIdentities[code];
    if(!currentUser){
      if(name){
        if(state.users.user1&&state.users.user1.name===name)currentUser='user1';
        else if(state.users.user2&&state.users.user2.name===name)currentUser='user2';
      }
      if(!currentUser){hideLoad();showEntry();return;}
      myIdentities[code]=currentUser;
      localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
    }
    localStorage.setItem(LAST_ROOM_KEY,code);
    lastSyncedJSON=JSON.stringify(state);
    localStorage.setItem('cache_'+code,lastSyncedJSON);
    if(!myRooms[code])myRooms[code]={name:state.roomName||('房间 '+code),joinedAt:Date.now()};
    myRooms[code].lastVisit=Date.now();
    localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
    const t=new Date();
    selectedDate=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
    calAnchor=new Date();
    hideLoad();
    enterMain();
  }catch(e){
    console.error(e);
    hideLoad();
    alert('进入失败：'+e.message);
    showEntry();
  }
}

function enterMain(){
  $('entry').classList.add('hidden');
  $('screen').style.display='block';
  $('tabbar').style.display='flex';
  $('fab').classList.remove('hidden');
  switchTab('feed');
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(pullRoom,4000);
}
function showLoad(t){$('loadingText').textContent=t||'加载中…';$('loading').classList.remove('hidden');}
function hideLoad(){$('loading').classList.add('hidden');}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(tab==='partner')$('page-partner').classList.add('active');
  else $('page-'+tab).classList.add('active');
  $('screen').scrollTop=0;
  if(tab==='feed'){renderFeed();}
  else if(tab==='notify'){renderNotify();}
  else if(tab==='other')renderOther();
  else if(tab==='me')renderMe();
  else if(tab==='partner')renderPartner();
  else if(tab==='settings')renderSettings();
  $('fab').classList.toggle('hidden',tab!=='feed');
  updateBadges();
}

function layoutWaterfallAsync(posts,cardHtmlFn,container){
  const left=document.createElement('div');left.className='feed-col';
  const right=document.createElement('div');right.className='feed-col';
  container.appendChild(left);container.appendChild(right);
  let lh=0,rh=0;
  posts.forEach(p=>{
    const tmp=document.createElement('div');
    tmp.innerHTML=cardHtmlFn(p);
    const card=tmp.firstElementChild;
    const wrapper=document.createElement('div');
    wrapper.style.visibility='hidden';
    wrapper.style.position='absolute';
    wrapper.appendChild(card);
    document.body.appendChild(wrapper);
    const h=card.offsetHeight||200;
    document.body.removeChild(wrapper);
    if(lh<=rh){left.appendChild(card);lh+=h;}
    else{right.appendChild(card);rh+=h;}
  });
}

function renderFeed(){
  if(!state)return;
  const u=meUser(),pk=partnerUser();
  const sub=$('feedSub');
  if(sub)sub.textContent = u && pk ? (u.name||'你')+' 和 '+(pk.name||'Ta')+' 的专属空间' : '你和 Ta 的专属空间';
  renderHeroPair($('heroPair'));

  const ps=state.posts
    .filter(isPub)
    .filter(p=>!p.hidden||p.author===currentUser)
    .sort((a,b)=>(b.publishAt||b.createdAt||0)-(a.publishAt||a.createdAt||0));
  const c=$('feedList');
  c.innerHTML='';
  if(!ps.length){
    c.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div class="empty-title">还没有新动态</div><div class="empty-sub">点右下角 + 发第一条吧</div></div>';
    return;

  layoutWaterfallAsync(ps,renderCard,c);

function bindFeedEvents(c){
  c.querySelectorAll('.post').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.post-av')||e.target.closest('.post-name')||e.target.closest('.post-more'))return;
      openDetail(el.dataset.postId);
    });
  });
  c.querySelectorAll('.post-av,.post-name').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const pid=el.closest('.post').dataset.postId;
      const p=state.posts.find(x=>x.id===pid);
      if(!p)return;
      if(p.author===currentUser)switchTab('me');
      else switchTab('partner');
    });
  });
  c.querySelectorAll('.post-more').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const pid=b.dataset.postId;
      const p=state.posts.find(x=>x.id===pid);
      if(!p)return;
      const isMine=p.author===currentUser;
      const items=[];
      if(isMine){
        items.push({text:'编辑',fn:()=>openEditor(p)});
        items.push({text:p.hidden?'取消隐藏':'隐藏',fn:()=>{p.hidden=!p.hidden;saveRoom();rerenderCurrent();}});
        items.push({text:'删除',danger:true,fn:()=>{
          openActionSheet([
            {text:'确认删除这条动态？',danger:true,fn:()=>{
              state.posts=state.posts.filter(x=>x.id!==pid);
              saveRoom();rerenderCurrent();
            }},
            {text:'取消',cancel:true}
          ]);
        }});
      }else{
        items.push({text:p.hidden?'取消隐藏':'隐藏',fn:()=>{p.hidden=!p.hidden;saveRoom();rerenderCurrent();}});
      }
      items.push({text:'取消',cancel:true});
      openActionSheet(items);
    });
  });
}

function renderCard(p){
  const u=state.users[p.author];
  if(!u)return '';
  const name=u.name||'Ta';
  const av=u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const t=fmtPostTime(p);
  const cnt=countAllComments(p.comments||[]);
  let readTag='';
  if(p.author===currentUser){
    const pk=partnerKey();
    if(!isPub(p))readTag='<span class="post-read pending">待发布</span>';
    else if(p.readBy&&p.readBy[pk])readTag='<span class="post-read read">已读</span>';
    else readTag='<span class="post-read">未读</span>';
  }
  return '<div class="post'+(p.hidden?' hidden-post':'')+'" data-post-id="'+p.id+'">'+
    (p.image?'<div class="post-media"><img src="'+p.image+'"></div>':'')+
    '<div class="post-body"><div class="post-head"><div class="post-av" data-uid="'+p.author+'">'+av+'</div><div class="post-meta"><div class="post-name" data-uid="'+p.author+'">'+esc(name)+'</div><div class="post-time '+(t.scheduled?'scheduled':'')+'">'+esc(t.text)+'</div></div></div>'+
    (p.text?'<div class="post-text">'+esc(p.text)+'</div>':'')+
    '</div>'+
    '<div class="post-foot">'+
      '<div class="post-stat '+(cnt>0?'has-cmt':'')+'"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+(cnt>0?cnt:'评论')+'</div>'+
      readTag+
      '<button class="post-more" data-post-id="'+p.id+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
    '</div>'+
  '</div>';
}

  h+='<div class="notify-group"><div class="notify-group-title">全部通知</div>';
  ns.forEach(n=>{
    const u=state.users[n.from];
    const name=u?u.name:'Ta';
    const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
    const isUnread=!n.read;

      '<div class="notify-av">'+av+'</div>'+
      '<div class="notify-body"><div class="notify-name">'+esc(name)+' 评论了你</div><div class="notify-text">'+esc(n.text||'')+'</div><div class="notify-time">'+fmtRel(n.createdAt||Date.now())+'</div></div>'+
    '</div>';
  });
  h+='</div>';
  c.innerHTML=h;
  const mab=$('markAllReadBtn');
  if(mab)mab.addEventListener('click',()=>{markAllRead();renderNotify();});
  c.querySelectorAll('.notify-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const nid=el.dataset.id;
      const n=(state.notifications||[]).find(x=>x.id===nid);
      if(n&&!n.read){n.read=true;saveRoom();}
      const pid=el.dataset.post;
      if(pid)openDetail(pid);
      updateBadges();
      renderNotify();
    });
  });
}

function renderProfile(user,isMe){
  const mine=state.posts.filter(p=>p.author===(isMe?currentUser:partnerKey()));
  const totalComments=mine.reduce((s,p)=>s+countAllComments(p.comments||[]),0);
  const totalRead=mine.reduce((s,p)=>s+(p.readBy?Object.keys(p.readBy).length:0),0);

  const coverHtml=user.cover
    ? '<img src="'+user.cover+'">'
    : '<div class="profile-hero-ph"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>';
  const avHtml=user.avatar?'<img src="'+user.avatar+'">':avSvg();

  let h='';
  h+='<div class="profile-hero" '+(isMe?'id="meCover"':'')+'>';
  h+=coverHtml;
  h+='<div class="profile-hero-mask"></div>';
  if(isMe)h+='<button class="profile-hero-edit" id="meCoverBtn">更换封面</button>';
  h+='<div class="profile-hero-bottom">';
  h+='<div class="profile-hero-av" '+(isMe?'id="meAv"':'')+'>'+avHtml+'</div>';
  h+='<div class="profile-hero-name" '+(isMe?'id="meName"':'')+'>'+esc(user.name||(isMe?'我':'Ta'))+'</div>';
  h+='</div></div>';

  h+='<div class="profile-body">';
  h+='<div class="profile-bio-card" '+(isMe?'id="meBio"':'')+'>';
  h+='<div class="profile-bio-label">'+(isMe?'个性签名':'Ta 的签名')+'</div>';
  h+='<div class="profile-bio '+(user.bio?'':'empty')+'">'+(user.bio?esc(user.bio):(isMe?'点击设置签名':'Ta 还没有写签名'))+'</div>';
  h+='</div>';

  h+='<div class="profile-stats">';
  h+='<div class="stat-pill"><div class="stat-num">'+mine.length+'</div><div class="stat-lbl">动态</div></div>';
  h+='<div class="stat-pill"><div class="stat-num">'+totalComments+'</div><div class="stat-lbl">评论</div></div>';
  h+='<div class="stat-pill"><div class="stat-num">'+totalRead+'</div><div class="stat-lbl">被读</div></div>';
  h+='</div>';

  h+='<div class="profile-section-title">'+(isMe?'我的动态':'Ta 的动态')+'</div>';

  }
  h+='</div>';
  return {html:h,posts:sorted,listId:isMe?'meList':'pList'};
}

  const p=state.posts.find(x=>x.id===postId);

  if(p.hidden&&p.author!==currentUser)return;
  detailPostId=postId;

  $('detailInput').value='';

function closeDetail(){$('detail').classList.remove('open');detailPostId=null;replyingTo=null;}

function renderDetail(postId){
  const p=state.posts.find(x=>x.id===postId);
  if(!p)return;
  const u=state.users[p.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const t=fmtPostTime(p);
  $('detailHero').innerHTML=p.image?'<div class="detail-hero"><img src="'+p.image+'"></div>':'';
  $('detailAv').innerHTML=av;
  $('detailName').textContent=name;
  $('detailTime').textContent=t.text;
  $('detailText').textContent=p.text||'';
  $('detailAv').onclick=()=>{closeDetail();if(p.author===currentUser)switchTab('me');else switchTab('partner');};
  $('detailName').onclick=$('detailAv').onclick;
  const cs=p.comments||[];
  $('cmtCount').textContent=cs.length>0?countAllComments(cs)+' 条':'';

    $('cmtList').innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:30px 0;">还没有评论</div>';
  }else{
    $('cmtList').innerHTML=cs.map(c=>renderComment(c,postId)).join('');
  }
  bindDetailEvents();

function renderComment(c,postId){
  const u=state.users[c.author];
  const name=u?u.name:'Ta';
  const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
  const isMe=c.author===currentUser;
  const canDel=isMe;
  let quoteHtml='';
  if(c.replyTo){
    const parent=findComment((state.posts.find(x=>x.id===postId).comments||[]),c.replyTo);
    if(parent){
      const pu=state.users[parent.author];
      quoteHtml='<div class="cmt-reply-quote"><div class="bar"></div><div class="q-body"><div class="q-name">'+esc(pu?pu.name:'Ta')+'</div><div class="q-text">'+esc(parent.text||'')+'</div></div></div>';
    }
  }
  const timeStr=fmtRel(c.createdAt||Date.now());
  return '<div class="cmt '+(isMe?'me':'')+'" data-comment-id="'+c.id+'">'+
    '<div class="cmt-av" data-uid="'+c.author+'">'+av+'</div>'+
    '<div class="cmt-body">'+
      '<div class="cmt-name">'+esc(name)+'<span class="time">'+timeStr+'</span></div>'+

function renderCalendar(){
  const c=$('viewCal');
  const year=calAnchor.getFullYear();
  const month=calAnchor.getMonth();
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const prevLast=new Date(year,month,0);
  const firstWeek=first.getDay();
  const cells=[];
  for(let i=firstWeek;i>0;i--){
    const d=prevLast.getDate()-i+1;
    const ds=new Date(year,month-1,d);
    cells.push({d:d,other:true,date:ds});
  }
  const today=new Date();
  for(let i=1;i<=last.getDate();i++){
    const ds=new Date(year,month,i);
    const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===i;
    cells.push({d:i,other:false,date:ds,today:isToday});
  }
  while(cells.length<42){
    const idx=cells.length-(firstWeek+last.getDate())+1;
    const ds=new Date(year,month+1,idx);
    cells.push({d:idx,other:true,date:ds});
  }

  let h='<div class="cal-wrap">';
  h+='<div class="cal-nav"><div class="cal-month">'+year+'年 '+(month+1)+'月</div><div class="cal-btns"><button class="cal-btn" id="calPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="cal-btn" id="calNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></div>';
  h+='<div class="cal-card">';
  h+='<div class="cal-week-row"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>';
  h+='<div class="cal-day-grid" id="calDayBox">';
  cells.forEach(cell=>{
    const ds=cell.date.getFullYear()+'-'+pad(cell.date.getMonth()+1)+'-'+pad(cell.date.getDate());
    const todos=state.todos[ds]||[];
    let cls='cal-day-item';
    if(cell.other)cls+=' other-month';
    if(cell.today)cls+=' today';
    if(ds===selectedDate)cls+=' selected';
    let dot='';
    if(!cell.other&&todos.length){
      const undone=todos.some(t=>!t.done);
      dot='<div class="cal-dot '+(undone?'':'done')+'"></div>';
    }
    h+='<div class="'+cls+'" data-date="'+ds+'">'+cell.d+' '+dot+'</div>';
  });
  h+='</div></div>';

  const sd=selectedDate;
  const sdd=new Date(sd+'T00:00:00');
  const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
  const todos=state.todos[sd]||[];
  const note=state.notes[sd]||'';
  h+='<div class="cal-detail"><div class="cal-detail-head"><div><div class="cal-detail-date">'+(sdd.getMonth()+1)+'月'+sdd.getDate()+'日</div><div class="cal-detail-week">'+weekdays[sdd.getDay()]+'</div></div><button class="cal-detail-add" id="calAddTodo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="cal-todos">';
  if(!todos.length)h+='<div class="cal-empty">还没有待办</div>';
  else todos.forEach(t=>{
    const u=state.users[t.by];
    h+='<div class="cal-todo"><div class="cal-check '+(t.done?'done':'')+'" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div><div class="cal-todo-body"><div class="cal-todo-text '+(t.done?'done':'')+'">'+esc(t.text)+'</div><div class="cal-todo-meta">'+esc(u?u.name:'Ta')+' · '+fmtHm(t.createdAt)+'</div></div><button class="cal-todo-del" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  });
  h+='</div>';

  h+='<div class="cal-note"><div class="cal-note-label">备注留言</div>';
  const notes=state.notes[sd];
  if(notes&&typeof notes==='object'&&!Array.isArray(notes)){
    h+='<div class="cal-note-list">';
    Object.keys(notes).forEach(uid=>{
      const u=state.users[uid];
      const txt=notes[uid];
      if(!txt)return;
      const av=u&&u.avatar?'<img src="'+u.avatar+'">':avSvg();
      h+='<div class="cal-note-item"><div class="cal-note-av">'+av+'</div><div class="cal-note-content"><div class="cal-note-name">'+esc(u?u.name:'Ta')+'</div><div class="cal-note-text">'+esc(txt)+'</div></div></div>';
    });
    h+='</div>';
    h+='<div class="cal-note-add"><textarea class="cal-note-input" id="calNoteInput" placeholder="添加你的备注…" maxlength="300"></textarea></div>';
  }else{
    const oldTxt=typeof notes==='string'?notes:'';
    if(oldTxt)h+='<div class="cal-note-text" style="margin-bottom:12px;">'+esc(oldTxt)+'</div>';
    h+='<div class="cal-note-add"><textarea class="cal-note-input" id="calNoteInput" placeholder="添加你的备注…" maxlength="300"></textarea></div>';
  }
  h+='</div>';
  h+='</div></div>';
  c.innerHTML=h;

  $('calPrev').addEventListener('click',()=>{calAnchor.setMonth(calAnchor.getMonth()-1);renderCalendar();});
  $('calNext').addEventListener('click',()=>{calAnchor.setMonth(calAnchor.getMonth()+1);renderCalendar();});
  c.querySelectorAll('.cal-day-item[data-date]').forEach(el=>{el.addEventListener('click',()=>{selectedDate=el.dataset.date;renderCalendar();});});
  $('calAddTodo').addEventListener('click',()=>openTodoModal(sd));
  c.querySelectorAll('.cal-check').forEach(el=>{
    el.addEventListener('click',()=>{const t=(state.todos[sd]||[]).find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;saveRoom();renderCalendar();});
  });
  c.querySelectorAll('.cal-todo-del').forEach(b=>{
    b.addEventListener('click',()=>{
      openActionSheet([
        {text:'删除待办',danger:true,fn:()=>{state.todos[sd]=(state.todos[sd]||[]).filter(x=>x.id!==b.dataset.id);if(!state.todos[sd].length)delete state.todos[sd];saveRoom();renderCalendar();}},
        {text:'取消',cancel:true}
      ]);
    });
  });
  const ni=$('calNoteInput');
  if(ni)ni.addEventListener('blur',()=>{
    const v=ni.value.trim();
    if(!state.notes[sd]||typeof state.notes[sd]!=='object')state.notes[sd]={};
    if(v)state.notes[sd][currentUser]=v;
    else delete state.notes[sd][currentUser];
    if(!Object.keys(state.notes[sd]).length)delete state.notes[sd];
    saveRoom();renderCalendar();
  });
}

function renderAnniv(){
  const c=$('viewAnniv');
  const a=state.anniversary;
  let main='';
  if(!a||!a.date){
    main='<div class="anniv-empty"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><div class="anniv-empty-title">还没有设置纪念日</div><button class="btn btn-primary" id="setAnniv">设置纪念日</button></div>';
  }else{
    const start=new Date(a.date+'T00:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const days=Math.floor((today-start)/86400000)+1;
    let bgLayer='',bgStyle='';
    if(a.cover&&a.cover.type==='color')bgStyle='background:'+a.cover.value+';';
    else if(a.cover&&a.cover.type==='image'){
      bgStyle='background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, #fff));';
      bgLayer='<div class="anniv-bg" style="background-image:url(\''+a.cover.value+'\');--anniv-blur:'+(state.annivBlur||0)+'px;"></div><div class="anniv-overlay"></div>';
    }
    main='<div class="anniv-card" style="'+bgStyle+'border-radius:'+state.annivRadius+'px;--anniv-blur:'+(state.annivBlur||0)+'px;">'+bgLayer+'<div class="anniv-content"><div class="anniv-label">'+esc(a.label||'在一起')+'</div><div class="anniv-days">'+days+'<span class="anniv-unit">天</span></div><div class="anniv-date">从 '+a.date+'</div></div></div>'+
      '<div class="anniv-btns"><button class="btn btn-ghost" id="editAnniv">编辑</button><button class="btn btn-ghost" id="editAnnivBg">背景</button></div>'+
      '<div class="anniv-controls">'+
        '<div class="anniv-row"><label><span>圆角</span><span id="rVal">'+state.annivRadius+'px</span></label><input type="range" id="rSlider" min="0" max="75" value="'+state.annivRadius+'"></div>'+
        '<div class="anniv-row"><label><span>背景模糊</span><span id="bVal">'+(state.annivBlur||0)+'px</span></label><input type="range" id="bSlider" min="0" max="20" value="'+(state.annivBlur||0)+'"></div>'+
      '</div>';
  }
  const list=state.customAnnivs||[];
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...list].map(x=>({...x,diff:Math.round((new Date(x.date+'T00:00:00')-today)/86400000)})).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
  let listH='';
  if(!sorted.length)listH='<div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px 0;width:100%;max-width:320px;">还没有自定义纪念日</div>';
  else listH=sorted.map(it=>{
    let txt;
    if(it.diff>0)txt='还有 '+it.diff+' 天';
    else if(it.diff===0)txt='今天';
    else txt='已过 '+Math.abs(it.diff)+' 天';
    return '<div class="custom-anniv" data-id="'+it.id+'"><div class="ca-body"><div class="ca-title">'+esc(it.label)+'</div><div class="ca-date">'+it.date+'</div></div><div class="ca-days '+(it.diff===0?'today':'')+'">'+txt+'</div><button class="ca-del" data-id="'+it.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  }).join('');
  c.innerHTML='<div class="anniv-wrap">'+main+'<div class="anniv-sec">自定义纪念日</div>'+listH+'<button class="add-anniv" id="addAnniv">+ 添加纪念日</button></div>';

  if(a&&a.date){
    $('editAnniv').addEventListener('click',editAnniv);
    $('editAnnivBg').addEventListener('click',editAnnivBg);
    const rs=$('rSlider');
    rs.addEventListener('input',()=>{state.annivRadius=parseInt(rs.value);$('rVal').textContent=state.annivRadius+'px';const card=c.querySelector('.anniv-card');if(card)card.style.borderRadius=state.annivRadius+'px';});
    rs.addEventListener('change',()=>saveRoom());
    const bs=$('bSlider');
    bs.addEventListener('input',()=>{state.annivBlur=parseInt(bs.value);$('bVal').textContent=state.annivBlur+'px';const bg=c.querySelector('.anniv-bg');if(bg)bg.style.setProperty('--anniv-blur',state.annivBlur+'px');});
    bs.addEventListener('change',()=>saveRoom());
  }else{
    $('setAnniv').addEventListener('click',editAnniv);
  }
  $('addAnniv').addEventListener('click',()=>editCustomAnniv(null));
  c.querySelectorAll('.custom-anniv').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.closest('.ca-del'))return;editCustomAnniv(el.dataset.id);});
  });
  c.querySelectorAll('.ca-del').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      openActionSheet([
        {text:'删除纪念日',danger:true,fn:()=>{state.customAnnivs=state.customAnnivs.filter(x=>x.id!==b.dataset.id);saveRoom();renderAnniv();}},
        {text:'取消',cancel:true}
      ]);
    });
  });
}
function editAnniv(){
  const box=$('modalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='设置纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称（如：在一起）';lab.maxLength=12;lab.value=state.anniversary?state.anniversary.label||'':'在一起';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';dt.value=state.anniversary?state.anniversary.date||'':'';box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';c.addEventListener('click',()=>$('modal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{if(!dt.value){alert('请选择日期');return;}const old=state.anniversary&&state.anniversary.cover;state.anniversary={label:lab.value.trim()||'在一起',date:dt.value,cover:old||{type:'gradient'}};saveRoom();$('modal').classList.remove('open');renderAnniv();});
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
