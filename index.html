<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>双人 · 私密房间</title>
<style>
:root{
  --bg-body:#f2f2f7; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#f8f8fc; --bg-input:#f2f2f7; --bg-modal:#ffffff;
  --text-primary:#1c1c1e; --text-secondary:#8e8e93; --text-tertiary:#c7c7cc; --text-placeholder:#b0b0b8;
  --accent:#007aff; --accent-soft:rgba(0,122,255,.1); --accent-shadow:rgba(0,122,255,.25);
  --border:rgba(0,0,0,.06); --border-strong:#e5e5ea;
  --text-on-accent:#ffffff;
  --danger:#ff3b30; --success:#34c759; --schedule:#ff9500;
  --frame-shadow:0 30px 60px rgba(0,0,0,.15);
}
[data-theme="light-pink"]{
  --bg-body:#fdf2f5; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#fdf2f5; --bg-input:#fae8ee; --bg-modal:#ffffff;
  --text-primary:#2c1e24; --text-secondary:#a88b95; --text-tertiary:#d4c2ca; --text-placeholder:#c9a8b4;
  --accent:#ff2d55; --accent-soft:rgba(255,45,85,.1); --accent-shadow:rgba(255,45,85,.25);
  --border:rgba(255,45,85,.1); --border-strong:#f5dce3;
  --danger:#ff3b30; --success:#34c759; --schedule:#ff9500;
}
[data-theme="light-cream"]{
  --bg-body:#faf6ee; --bg-frame:#fffdf7; --bg-card:#fffdf7;
  --bg-soft:#f7f1e3; --bg-input:#f2ead8; --bg-modal:#fffdf7;
  --text-primary:#3a3226; --text-secondary:#9c9280; --text-tertiary:#c9bfab; --text-placeholder:#bfb5a0;
  --accent:#e08a00; --accent-soft:rgba(224,138,0,.1); --accent-shadow:rgba(224,138,0,.25);
  --border:rgba(0,0,0,.05); --border-strong:#ecdfc8;
  --danger:#e64a19; --success:#7cb342; --schedule:#e08a00;
}
[data-theme="light-mint"]{
  --bg-body:#eef9f3; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#eef9f3; --bg-input:#e0f2e8; --bg-modal:#ffffff;
  --text-primary:#1a2e26; --text-secondary:#6b8a7d; --text-tertiary:#a8c4b8; --text-placeholder:#9dbaad;
  --accent:#00a86b; --accent-soft:rgba(0,168,107,.1); --accent-shadow:rgba(0,168,107,.25);
  --border:rgba(0,168,107,.08); --border-strong:#d5e8dd;
  --danger:#ff3b30; --success:#00a86b; --schedule:#ff9500;
}
[data-theme="light-lavender"]{
  --bg-body:#f5f2fb; --bg-frame:#ffffff; --bg-card:#ffffff;
  --bg-soft:#f5f2fb; --bg-input:#ebe4f5; --bg-modal:#ffffff;
  --text-primary:#2a2340; --text-secondary:#8078a0; --text-tertiary:#b8b0cc; --text-placeholder:#aca3c4;
  --accent:#7c5cff; --accent-soft:rgba(124,92,255,.1); --accent-shadow:rgba(124,92,255,.25);
  --border:rgba(124,92,255,.08); --border-strong:#e0d6f0;
  --danger:#ff3b30; --success:#34c759; --schedule:#ff9500;
}
[data-theme="dark"]{
  --bg-body:#0b0b0e; --bg-frame:#1c1c1e; --bg-card:#1e1e20;
  --bg-soft:#1e1e20; --bg-input:#2c2c2e; --bg-modal:#2c2c2e;
  --text-primary:#ffffff; --text-secondary:#98989e; --text-tertiary:#5a5a5e; --text-placeholder:#6a6a6e;
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --accent-shadow:rgba(10,132,255,.3);
  --border:rgba(255,255,255,.1); --border-strong:#3a3a3c;
  --danger:#ff453a; --success:#32d74b; --schedule:#ff9f0a;
}
[data-theme="dark-blue"]{
  --bg-body:#0a1220; --bg-frame:#0f1a2c; --bg-card:#152238;
  --bg-soft:#152238; --bg-input:#1e2e48; --bg-modal:#1e2e48;
  --text-primary:#e8eef8; --text-secondary:#8898b0; --text-tertiary:#4a5a72; --text-placeholder:#5a6a82;
  --accent:#4a9eff; --accent-soft:rgba(74,158,255,.2); --accent-shadow:rgba(74,158,255,.3);
  --border:rgba(255,255,255,.08); --border-strong:#2a3a52;
  --danger:#ff5a52; --success:#3ddc84; --schedule:#ffb340;
}
[data-theme="dark-purple"]{
  --bg-body:#100a1e; --bg-frame:#1a1230; --bg-card:#221842;
  --bg-soft:#221842; --bg-input:#2e2254; --bg-modal:#2e2254;
  --text-primary:#ede8f8; --text-secondary:#9888b8; --text-tertiary:#5a4a7a; --text-placeholder:#6a5a8a;
  --accent:#a78bfa; --accent-soft:rgba(167,139,250,.2); --accent-shadow:rgba(167,139,250,.3);
  --border:rgba(255,255,255,.08); --border-strong:#3a2a5a;
  --danger:#ff6a6a; --success:#4ade80; --schedule:#fbbf24;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg-body);display:flex;justify-content:center;align-items:center;min-height:100vh;transition:background-color .4s;}
.phone-frame{width:100%;max-width:430px;height:100vh;max-height:900px;background:var(--bg-frame);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:background-color .4s;}
@media(min-width:480px){.phone-frame{border-radius:44px;max-height:92vh;box-shadow:var(--frame-shadow);}}

/* ===== 状态栏 ===== */
.status-bar{padding:12px 20px 4px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-primary);flex-shrink:0;letter-spacing:-.2px;z-index:5;}

/* ===== 主内容区 ===== */
.app-screen{flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:80px;}
.app-screen::-webkit-scrollbar{display:none;}
.tab-page{display:none;padding:0 16px;}
.tab-page.active{display:block;}

/* ===== 顶部大标题 ===== */
.page-title{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--text-primary);padding:8px 4px 16px;}
.page-title.small{font-size:28px;}

/* ===== 通用卡片 ===== */
.card{background:var(--bg-card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border);}
[data-theme="dark"] .card,[data-theme="dark-blue"] .card,[data-theme="dark-purple"] .card{box-shadow:0 1px 4px rgba(0,0,0,.3);}

/* ===== 底部 Tab Bar (iMessage 风格) ===== */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:82px;background:var(--bg-frame);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;z-index:20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .4s;}
.tab-bar-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-family:inherit;padding:6px 0;transition:color .2s;position:relative;}
.tab-bar-btn.active{color:var(--accent);}
.tab-bar-btn .icon{font-size:22px;line-height:1;}
.tab-bar-btn .label{font-size:10px;font-weight:500;letter-spacing:-.1px;}
.tab-bar-btn .badge{position:absolute;top:2px;right:50%;margin-right:-18px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.tab-bar-btn .badge.hidden{display:none;}

/* ===== 悬浮发帖按钮 FAB ===== */
.fab{position:absolute;bottom:100px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;font-weight:300;cursor:pointer;box-shadow:0 6px 20px var(--accent-shadow);display:flex;align-items:center;justify-content:center;z-index:15;transition:transform .15s,box-shadow .15s;}
.fab:active{transform:scale(.92);}
.fab.hidden{display:none;}

/* ===== 帖子卡片 ===== */
.post-card{background:var(--bg-card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03);}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg-input);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-tertiary);}
.post-avatar img{width:100%;height:100%;object-fit:cover;}
.post-meta{flex:1;min-width:0;}
.post-author{font-weight:600;font-size:15px;color:var(--text-primary);}
.post-time{font-size:12px;color:var(--text-secondary);margin-top:1px;}
.post-time .scheduled-tag{color:var(--schedule);font-weight:600;}
.post-more-btn{background:none;border:none;color:var(--text-secondary);font-size:20px;font-weight:700;padding:4px 8px;cursor:pointer;font-family:inherit;line-height:1;}
.post-content{margin-bottom:10px;}
.post-text{font-size:15px;line-height:1.5;color:var(--text-primary);margin-bottom:10px;word-break:break-word;white-space:pre-wrap;}
.post-image{width:100%;border-radius:14px;object-fit:cover;max-height:400px;display:block;}
.post-footer{display:flex;align-items:center;gap:14px;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;}
.post-action-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:var(--text-secondary);font-size:13px;cursor:pointer;padding:4px 8px;border-radius:20px;font-family:inherit;}
.post-action-btn:active{background:var(--accent-soft);}
.post-action-btn.active{color:var(--accent);}
.read-status{margin-left:auto;font-size:12px;color:var(--text-secondary);}
.read-status.read{color:var(--success);}

/* ===== 评论 ===== */
.comment-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.comment-section.open{display:block;}
.comment-item{display:flex;gap:8px;margin-bottom:10px;font-size:13px;align-items:flex-start;}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg-input);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-tertiary);}
.comment-avatar img{width:100%;height:100%;object-fit:cover;}
.comment-body{flex:1;min-width:0;}
.comment-content{color:var(--text-primary);line-height:1.4;word-break:break-word;padding-top:3px;}
.comment-author{font-weight:600;margin-right:5px;}
.comment-actions{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--text-secondary);}
.comment-actions button{background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;padding:0;font-family:inherit;font-weight:500;}
.comment-actions button:active{color:var(--accent);}
.comment-actions .del:active{color:var(--danger);}
.comment-replies{margin-top:8px;padding-left:12px;border-left:2px solid var(--border);}
.comment-input-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.comment-input{flex:1;border:none;background:var(--bg-input);border-radius:20px;padding:9px 14px;font-size:13px;outline:none;color:var(--text-primary);font-family:inherit;}
.comment-input::placeholder{color:var(--text-placeholder);}
.comment-send-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:6px 8px;font-family:inherit;}
.comment-reply-hint{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:10px;margin-top:8px;display:flex;align-items:center;gap:6px;}
.comment-reply-hint .close-reply{margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;}

/* ===== 空状态 ===== */
.empty-state{text-align:center;color:var(--text-tertiary);font-size:14px;padding:60px 20px;line-height:1.7;user-select:none;}
.empty-state .icon{font-size:52px;margin-bottom:14px;display:block;opacity:.5;}

/* ===== 个人主页顶部 ===== */
.profile-header{position:relative;margin-bottom:14px;padding-top:8px;}
.cover-wrapper{width:100%;height:150px;border-radius:24px;overflow:hidden;background:var(--bg-input);margin-bottom:14px;position:relative;cursor:pointer;}
.cover-img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:13px;flex-direction:column;gap:6px;}
.cover-placeholder span:first-child{font-size:28px;}
.cover-edit-hint{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:16px;padding:5px 12px;color:#fff;font-size:11px;font-weight:500;pointer-events:none;}
.avatar-row{display:flex;align-items:flex-end;gap:14px;padding:0 6px;margin-top:-46px;margin-bottom:16px;position:relative;z-index:2;}
.avatar-wrapper{position:relative;width:88px;height:88px;border-radius:50%;background:var(--bg-input);border:3px solid var(--bg-frame);overflow:hidden;cursor:pointer;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.1);}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--text-tertiary);}
.name-bio{flex:1;min-width:0;padding-bottom:6px;}
.profile-name{font-size:22px;font-weight:700;letter-spacing:-.4px;color:var(--text-primary);display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer;word-break:break-word;}
.profile-name .edit-icon{font-size:12px;color:var(--text-secondary);}
.profile-bio{font-size:14px;color:var(--text-secondary);line-height:1.4;cursor:pointer;word-break:break-word;}
.profile-bio .bio-placeholder{color:var(--text-tertiary);font-style:italic;}

/* ===== 分段控制 ===== */
.segmented{display:flex;background:var(--bg-input);border-radius:10px;padding:2px;margin-bottom:16px;}
.segmented button{flex:1;background:none;border:none;padding:7px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:.15s;}
.segmented button.active{background:var(--bg-card);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ===== 纪念日 ===== */
.anniv-card{position:relative;width:100%;aspect-ratio:1;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-bottom:14px;background:linear-gradient(135deg,#007aff,#5ac8fa);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center;}
.anniv-card::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.15);z-index:0;}
.anniv-card>*{position:relative;z-index:1;}
.anniv-label{font-size:15px;opacity:.95;margin-bottom:8px;font-weight:500;}
.anniv-days{font-size:72px;font-weight:700;letter-spacing:-3px;line-height:1;margin-bottom:8px;text-shadow:0 3px 12px rgba(0,0,0,.2);}
.anniv-days-unit{font-size:20px;font-weight:500;opacity:.9;margin-left:6px;}
.anniv-date{font-size:13px;opacity:.9;}
.anniv-actions{position:absolute;bottom:16px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:2;}
.anniv-mini-btn{background:rgba(255,255,255,.25);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:6px 14px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.anniv-empty{background:var(--bg-soft);border-radius:24px;padding:44px 24px;text-align:center;color:var(--text-secondary);margin-bottom:14px;border:1px solid var(--border);}
.anniv-empty .icon{font-size:48px;margin-bottom:12px;display:block;}
.anniv-empty p{margin-bottom:18px;font-size:14px;}
.radius-slider-wrap{background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px;}
.radius-slider-wrap label{font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;margin-bottom:8px;font-weight:500;}
.radius-slider-wrap input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--bg-input);outline:none;}
.radius-slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px var(--accent-shadow);}
.section-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 10px;}
.custom-anniv-item{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.custom-anniv-item .ca-icon{font-size:22px;flex-shrink:0;}
.custom-anniv-item .ca-info{flex:1;min-width:0;}
.custom-anniv-item .ca-title{font-size:14px;font-weight:600;color:var(--text-primary);word-break:break-word;}
.custom-anniv-item .ca-date{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.custom-anniv-item .ca-days{font-size:13px;font-weight:600;color:var(--schedule);flex-shrink:0;text-align:right;}
.custom-anniv-item .ca-days.today{color:var(--danger);}
.custom-anniv-item .ca-del{background:none;border:none;color:var(--text-tertiary);font-size:14px;cursor:pointer;padding:6px 8px;border-radius:50%;font-family:inherit;flex-shrink:0;}
.add-anniv-btn{width:100%;padding:14px;border-radius:16px;border:1.5px dashed var(--text-tertiary);background:transparent;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;}
.custom-anniv-empty{text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px 0;}

/* ===== 日历 ===== */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px;}
.cal-nav-btn{background:var(--bg-soft);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text-primary);font-family:inherit;display:flex;align-items:center;justify-content:center;}
.cal-month-title{font-size:17px;font-weight:600;color:var(--text-primary);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;}
.cal-weekday{text-align:center;font-size:11px;color:var(--text-secondary);font-weight:600;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;border-radius:12px;background:var(--bg-soft);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;position:relative;transition:.15s;}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.has-todo{background:var(--accent-soft);}
.cal-cell:active{transform:scale(.95);}
.cal-num{font-size:12px;font-weight:600;color:var(--text-primary);line-height:1;}
.cal-cell.empty .cal-num{color:var(--text-tertiary);}
.cal-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-dot.done{background:var(--success);}
.cal-note-icon{position:absolute;top:2px;right:3px;font-size:8px;}

/* ===== 待办弹窗 ===== */
.todo-date-title{font-size:18px;font-weight:700;color:var(--text-primary);text-align:center;margin-bottom:6px;}
.todo-date-sub{font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:16px;}
.todo-list{max-height:280px;overflow-y:auto;margin-bottom:12px;}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);}
.todo-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-tertiary);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.15s;margin-top:1px;}
.todo-checkbox.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:14px;color:var(--text-primary);word-break:break-word;line-height:1.4;}
.todo-text.done{text-decoration:line-through;color:var(--text-tertiary);}
.todo-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.todo-del{background:none;border:none;color:var(--text-tertiary);font-size:14px;cursor:pointer;padding:4px;font-family:inherit;flex-shrink:0;}
.todo-add-row{display:flex;gap:8px;margin-top:8px;}
.todo-input{flex:1;border:1.5px solid var(--border-strong);background:var(--bg-soft);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;color:var(--text-primary);font-family:inherit;}
.todo-input:focus{border-color:var(--accent);}
.todo-add-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function rgba(hex,a){const {r,g,b}=hexToRgb(hex);return `rgba(${r},${g},${b},${a})`;}
function isDark(hex){const {r,g,b}=hexToRgb(hex);return (r*.299+g*.587+b*.114)<128;}

function applyTheme(id){
  if(id==='custom'){
    document.body.setAttribute('data-theme','light-blue');
    applyCustomToDOM();
  }else{
    ['--bg-body','--bg-frame','--bg-card','--bg-soft','--bg-input','--bg-modal','--text-primary','--text-secondary','--text-tertiary','--text-placeholder','--accent','--accent-soft','--accent-shadow','--border','--border-strong','--danger','--success','--schedule'].forEach(k=>document.documentElement.style.removeProperty(k));
    document.body.setAttribute('data-theme',id);
  }
  localStorage.setItem(THEME_KEY,id);
}

function pad(n){return n.toString().padStart(2,'0');}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function formatHm(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function formatDateTime(ts){const d=new Date(ts);return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function formatPostTime(post){
  if(post.publishAt&&post.publishAt>Date.now())return{text:`⏰ ${formatDateTime(post.publishAt)}`,scheduled:true};
  const ts=post.publishAt||post.createdAt||Date.now();
  const d=new Date(ts),now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.floor((today-pd)/86400000);
  if(diff===0)return{text:formatHm(ts),scheduled:false};
  if(diff===1)return{text:`昨天 ${formatHm(ts)}`,scheduled:false};
  if(diff<7)return{text:`${diff}天前`,scheduled:false};
  return{text:`${pad(d.getMonth()+1)}-${pad(d.getDate())} ${formatHm(ts)}`,scheduled:false};
}
function isPublished(p){return !p.publishAt||p.publishAt<=Date.now();}
function getPartnerKey(){return currentUser==='user1'?'user2':'user1';}
function getPartner(){return state&&state.users?state.users[getPartnerKey()]:null;}

function generateId(prefix){return (prefix||'id')+Date.now()+Math.random().toString(36).slice(2,7);}

async function cloudGet(code){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms?code=eq.${encodeURIComponent(code)}&select=data`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  const arr=await res.json();
  if(!arr.length)return null;
  return arr[0].data;
}
async function cloudUpsert(code,data){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms`,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify([{code,data,updated_at:new Date().toISOString()}])
  });
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}
async function cloudUpdate(code,data){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rooms?code=eq.${encodeURIComponent(code)}`,{
    method:'PATCH',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      'Prefer':'return=minimal'
    },
    body:JSON.stringify({data,updated_at:new Date().toISOString()})
  });
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t);}
}

function emptyRoomData(){
  return {
    users:{user1:null,user2:null},
    posts:[],
    anniversary:null,
    customAnnivs:[],
    todos:{},         // { 'YYYY-MM-DD': [{id,text,done,by,createdAt}] }
    notes:{},         // { 'YYYY-MM-DD': 'text' }
    annivRadius:24,
    roomName:'',
    createdAt:Date.now(),
    _v:1
  };
}

function normalizeRoom(data){
  if(!data||typeof data!=='object')return emptyRoomData();
  const d=Object.assign(emptyRoomData(),data);
  if(!d.users)d.users={user1:null,user2:null};
  if(!Array.isArray(d.posts))d.posts=[];
  if(!Array.isArray(d.customAnnivs))d.customAnnivs=[];
  if(!d.todos||typeof d.todos!=='object')d.todos={};
  if(!d.notes||typeof d.notes!=='object')d.notes={};
  if(typeof d.annivRadius!=='number')d.annivRadius=24;
  if(!d.roomName)d.roomName='';
  // 迁移评论
  d.posts.forEach(p=>{
    if(!p.createdAt)p.createdAt=Date.now();
    if(!p.comments)p.comments=[];
    migrateComments(p.comments);
    if(!p.readBy)p.readBy={};
    if(!p.id)p.id=generateId('p');
  });
  return d;
}
function migrateComments(arr){
  arr.forEach(c=>{
    if(!c.id)c.id=generateId('c');
    if(!c.replies)c.replies=[];
    if(c.replies.length)migrateComments(c.replies);
  });
}

// 保存到云端（防抖 800ms）
function saveRoom(){
  if(!roomCode||!state)return;
  localStorage.setItem('cache_room_'+roomCode,JSON.stringify(state));
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRoom,800);
}
async function pushRoom(){
  if(!roomCode||!state||isSyncing)return;
  const js=JSON.stringify(state);
  if(js===lastSyncedJSON)return;
  isSyncing=true;
  try{
    await cloudUpdate(roomCode,state);
    lastSyncedJSON=js;
  }catch(e){
    console.warn('同步失败',e);
    // 重试一次
    setTimeout(()=>{isSyncing=false;pushRoom();},2000);
    return;
  }
  isSyncing=false;
}

// 从云端拉取，检测更新
async function pullRoom(){
  if(!roomCode||isSyncing)return;
  try{
    const data=await cloudGet(roomCode);
    if(!data)return;
    const normalized=normalizeRoom(data);
    const incoming=JSON.stringify(normalized);
    if(incoming!==lastSyncedJSON){
      const oldState=state;
      state=normalized;
      lastSyncedJSON=incoming;
      localStorage.setItem('cache_room_'+roomCode,incoming);
      // 检测新评论
      detectNewComments(oldState,state);
      // 重新渲染
      if(currentTab==='feed')renderFeed();
      else if(currentTab==='me')renderMe();
      else if(currentTab==='other'){renderOther();}
      else if(currentTab==='settings')renderSettings();
      renderTabBadge();
    }
  }catch(e){
    console.warn('拉取失败',e);
  }
}

// 检测有没有新评论
function detectNewComments(oldS,newS){
  if(!oldS||!currentUser)return;
  const me=currentUser;
  newS.posts.forEach(p=>{
    if(p.author!==me)return; // 只看自己的帖子
    const oldP=oldS.posts?oldS.posts.find(x=>x.id===p.id):null;
    const oldCount=oldP?countAllComments(oldP.comments):0;
    const newCount=countAllComments(p.comments);
    if(newCount>oldCount){
      // 找最新的评论（对方发的）
      const latest=findLatestCommentBy(p.comments,getPartnerKey());
      if(latest){
        showToast({
          avatar:getPartner()&&getPartner().avatar,
          title:(getPartner()&&getPartner().name||'Ta')+' 评论了你',
          text:latest.text,
          postId:p.id
        });
      }
    }
  });
}
function countAllComments(arr){
  let n=0;
  arr.forEach(c=>{n++;if(c.replies)n+=countAllComments(c.replies);});
  return n;
}
function findLatestCommentBy(arr,author){
  let latest=null;
  arr.forEach(c=>{
    if(c.author===author&&(!latest||c.id>latest.id))latest=c;
    if(c.replies){
      const r=findLatestCommentBy(c.replies,author);
      if(r&&(!latest||r.id>latest.id))latest=r;
    }
  });
  return latest;
}

function renderEntry(){
  const c=$('entryContent');
  const hasRooms=Object.keys(myRooms).length>0;
  let mode='create'; // 默认创建

  function draw(){
    c.innerHTML='';
    const logo=document.createElement('div');
    logo.className='entry-logo';logo.textContent='💌';
    c.appendChild(logo);

    const title=document.createElement('div');
    title.className='entry-title';title.textContent='私密房间';
    c.appendChild(title);

    const sub=document.createElement('div');
    sub.className='entry-subtitle';sub.textContent='和Ta的专属小空间';
    c.appendChild(sub);

    // 如果有房间，先显示房间列表
    if(hasRooms){
      const listTitle=document.createElement('div');
      listTitle.style.cssText='font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;align-self:flex-start;';
      listTitle.textContent='我的房间';
      c.appendChild(listTitle);

      Object.keys(myRooms).sort((a,b)=>(myRooms[b].lastVisit||0)-(myRooms[a].lastVisit||0)).forEach(code=>{
        const room=myRooms[code];
        const card=document.createElement('div');
        card.className='room-card';
        card.style.width='100%';
        const icon=document.createElement('div');
        icon.className='r-icon';icon.textContent='🚪';
        const info=document.createElement('div');
        info.className='r-info';
        const nm=document.createElement('div');nm.className='r-name';nm.textContent=room.name||code;
        const cd=document.createElement('div');cd.className='r-code';cd.textContent=code;
        info.appendChild(nm);info.appendChild(cd);
        const check=document.createElement('div');check.className='r-check';check.textContent='›';
        card.appendChild(icon);card.appendChild(info);card.appendChild(check);
        card.addEventListener('click',()=>openRoom(code));
        c.appendChild(card);
      });

      const divider=document.createElement('div');
      divider.style.cssText='font-size:12px;color:var(--text-tertiary);margin:20px 0 12px;';
      divider.textContent='— 或 —';
      c.appendChild(divider);
    }

    // Tab: 创建 / 加入
    const tabs=document.createElement('div');
    tabs.className='entry-tabs';
    const tabCreate=document.createElement('button');
    tabCreate.className='entry-tab'+(mode==='create'?' active':'');
    tabCreate.textContent='创建房间';
    tabCreate.addEventListener('click',()=>{mode='create';draw();});
    const tabJoin=document.createElement('button');
    tabJoin.className='entry-tab'+(mode==='join'?' active':'');
    tabJoin.textContent='加入房间';
    tabJoin.addEventListener('click',()=>{mode='join';draw();});
    tabs.appendChild(tabCreate);tabs.appendChild(tabJoin);
    c.appendChild(tabs);

    // 输入 1：邀请码
    const codeInput=document.createElement('input');
    codeInput.type='text';
    codeInput.className='entry-input';
    codeInput.placeholder='邀请码（4字母+4数字）';
    codeInput.maxLength=8;
    codeInput.autocomplete='off';
    codeInput.style.textTransform='lowercase';
    c.appendChild(codeInput);

    // 输入 2：昵称
    const nameInput=document.createElement('input');
    nameInput.type='text';
    nameInput.className='entry-input';
    nameInput.placeholder='你的昵称';
    nameInput.maxLength=16;
    nameInput.autocomplete='off';
    nameInput.style.letterSpacing='normal';
    c.appendChild(nameInput);

    const btn=document.createElement('button');
    btn.className='entry-btn';
    btn.textContent=mode==='create'?'创建并进入':'加入';
    c.appendChild(btn);

    const hint=document.createElement('div');
    hint.className='entry-hint';
    hint.textContent=mode==='create'?'邀请码自己定，4个字母+4个数字':'输入对方的邀请码，进入同一个房间';
    c.appendChild(hint);

    const errBox=document.createElement('div');
    errBox.className='entry-error';
    c.appendChild(errBox);

    codeInput.addEventListener('input',()=>{
      codeInput.value=codeInput.value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
    });

    const submit=async()=>{
      errBox.textContent='';
      const code=codeInput.value.trim().toLowerCase();
      const name=nameInput.value.trim();
      if(!/^[a-z]{4}[0-9]{4}$/.test(code)){
        errBox.textContent='邀请码格式：4个小写字母 + 4个数字（例如 love1234）';
        codeInput.focus();return;
      }
      if(!name){errBox.textContent='请输入昵称';nameInput.focus();return;}

      btn.disabled=true;btn.textContent='处理中…';
      try{
        const existing=await cloudGet(code);

        if(mode==='create'){
          if(existing){
            errBox.textContent='这个邀请码已被使用，换一个吧';
            btn.disabled=false;btn.textContent='创建并进入';return;
          }
          const data=emptyRoomData();
          data.users.user1={name,bio:'',avatar:null,cover:null};
          data.roomName='房间 '+code;
          await cloudUpsert(code,data);
          myRooms[code]={name:data.roomName,joinedAt:Date.now(),lastVisit:Date.now()};
          myIdentities[code]='user1';
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }else{
          if(!existing){
            errBox.textContent='房间不存在，检查邀请码是否正确';
            btn.disabled=false;btn.textContent='加入';return;
          }
          const data=normalizeRoom(existing);
          // 检查名字是否匹配已有成员
          if(data.users.user1&&data.users.user1.name===name){
            myIdentities[code]='user1';
          }else if(data.users.user2&&data.users.user2.name===name){
            myIdentities[code]='user2';
          }else if(!data.users.user2){
            data.users.user2={name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,data);
            myIdentities[code]='user2';
          }else if(!data.users.user1){
            data.users.user1={name,bio:'',avatar:null,cover:null};
            await cloudUpdate(code,data);
            myIdentities[code]='user1';
          }else{
            errBox.textContent='房间已满，只有已注册的昵称能进入';
            btn.disabled=false;btn.textContent='加入';return;
          }
          myRooms[code]=myRooms[code]||{name:data.roomName||('房间 '+code),joinedAt:Date.now()};
          myRooms[code].lastVisit=Date.now();
          localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
          localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
          await openRoom(code,name);
        }
      }catch(e){
        console.error(e);
        errBox.textContent='网络错误，请重试：'+e.message;
        btn.disabled=false;btn.textContent=mode==='create'?'创建并进入':'加入';
      }
    };
    btn.addEventListener('click',submit);
    codeInput.addEventListener('keypress',e=>{if(e.key==='Enter')nameInput.focus();});
    nameInput.addEventListener('keypress',e=>{if(e.key==='Enter')submit();});
    setTimeout(()=>codeInput.focus(),100);
  }
  draw();
}

// 打开房间
async function openRoom(code,userName){
  showLoading('正在进入房间…');
  try{
    const data=await cloudGet(code);
    if(!data)throw new Error('房间不存在');
    state=normalizeRoom(data);
    roomCode=code;
    currentUser=myIdentities[code];
    if(!currentUser){
      // 从数据反推身份
      if(userName){
        if(state.users.user1&&state.users.user1.name===userName)currentUser='user1';
        else if(state.users.user2&&state.users.user2.name===userName)currentUser='user2';
      }
      if(!currentUser){
        showEntry();
        hideLoading();
        return;
      }
      myIdentities[code]=currentUser;
      localStorage.setItem(IDENTITY_KEY,JSON.stringify(myIdentities));
    }
    localStorage.setItem(LAST_ROOM_KEY,code);
    lastSyncedJSON=JSON.stringify(state);
    localStorage.setItem('cache_room_'+code,lastSyncedJSON);
    // 记录到我的房间
    if(!myRooms[code])myRooms[code]={name:state.roomName||('房间 '+code),joinedAt:Date.now()};
    myRooms[code].lastVisit=Date.now();
    localStorage.setItem(ROOMS_KEY,JSON.stringify(myRooms));
    // 进入主界面
    hideLoading();
    enterMain();
  }catch(e){
    console.error(e);
    hideLoading();
    alert('进入房间失败：'+e.message);
    showEntry();
  }
}

function showLoading(t){$('loadingText').textContent=t||'加载中…';$('loadingOverlay').classList.remove('hidden');}
function hideLoading(){$('loadingOverlay').classList.add('hidden');}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-bar-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  $('page-'+tab).classList.add('active');
  $('app').querySelector('.app-screen').scrollTop=0;

  if(tab==='feed')renderFeed();
  else if(tab==='other')renderOther();
  else if(tab==='me')renderMe();
  else if(tab==='settings')renderSettings();

  // FAB 只在动态页显示
  $('fabBtn').classList.toggle('hidden',tab!=='feed');
}

// ============================================================
// 渲染：动态流
// ============================================================
function renderFeed(){
  if(!state)return;
  const pubPosts=state.posts.filter(isPublished);
  pubPosts.sort((a,b)=>{
    const ta=a.publishAt||a.createdAt||0,tb=b.publishAt||b.createdAt||0;
    return tb-ta;
  });
  const c=$('feedContainer');
  if(!pubPosts.length){
    c.innerHTML=`<div class="empty-state"><span class="icon">✨</span>还没有动态<br>点右下角 ＋ 发第一条吧</div>`;
    return;
  }
  c.innerHTML=pubPosts.map(p=>renderPostCard(p,false)).join('');
  bindPostEvents(c);
}

// ============================================================
// 帖子卡片
// ============================================================
function renderPostCard(post,isMine){
  const author=state.users[post.author];
  if(!author)return'';
  const name=author.name||'Ta';
  const av=author.avatar?`<img src="${author.avatar}" alt="">`:'👤';
  const time=formatPostTime(post);
  const comments=post.comments||[];
  const totalComments=countAllComments(comments);
  let readStatus='';
  if(isMine&&post.author===currentUser){
    const pk=getPartnerKey();
    if(!isPublished(post))readStatus='<span class="read-status">待发布</span>';
    else if(post.readBy&&post.readBy[pk])readStatus='<span class="read-status read">✓ 已读</span>';
    else readStatus='<span class="read-status">未读</span>';
  }
  const commentsHtml=comments.map(c=>renderComment(c,post.id)).join('');
  return `<div class="post-card" data-post-id="${post.id}">
    <div class="post-header">
      <div class="post-avatar">${av}</div>
      <div class="post-meta">
        <div class="post-author">${escapeHtml(name)}${isMine?' · 我':''}</div>
        <div class="post-time">${time.scheduled?`<span class="scheduled-tag">${time.text}</span>`:time.text}</div>
      </div>
      ${isMine?`<button class="post-more-btn" data-post-id="${post.id}">⋯</button>`:''}
    </div>
    <div class="post-content">
      ${post.text?`<div class="post-text">${escapeHtml(post.text)}</div>`:''}
      ${post.image?`<img class="post-image" src="${post.image}">`:''}
    </div>
    <div class="post-footer">
      <button class="post-action-btn comment-btn" data-post-id="${post.id}">💬 ${totalComments||''} 评论</button>
      ${readStatus}
    </div>
    <div class="comment-section" id="comments-${post.id}">
      <div class="comment-list">${commentsHtml}</div>
      <div id="reply-hint-${post.id}"></div>
      <div class="comment-input-row">
        <input type="text" class="comment-input" placeholder="写评论…" data-post-id="${post.id}">
        <button class="comment-send-btn" data-post-id="${post.id}">发送</button>
      </div>
    </div>
  </div>`;
}

function renderComment(c,postId){
  const cu=state.users[c.author];
  const name=cu?cu.name:'Ta';
  const av=cu&&cu.avatar?`<img src="${cu.avatar}" alt="">`:'👤';
  const canDel=c.author===currentUser;
  const replies=(c.replies||[]).map(r=>renderComment(r,postId)).join('');
  return `<div class="comment-item" data-comment-id="${c.id}">
    <div class="comment-avatar">${av}</div>
    <div class="comment-body">
      <div class="comment-content"><span class="comment-author">${escapeHtml(name)}</span>${escapeHtml(c.text)}</div>
      <div class="comment-actions">
        <button class="reply-btn" data-post-id="${postId}" data-comment-id="${c.id}">回复</button>
        ${canDel?`<button class="del comment-del" data-comment-id="${c.id}" data-post-id="${postId}">删除</button>`:''}
      </div>
      ${replies?`<div class="comment-replies">${replies}</div>`:''}
    </div>
  </div>`;
}

function bindPostEvents(container){
  container.querySelectorAll('.comment-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const s=$('comments-'+b.dataset.postId);
      if(s)s.classList.toggle('open');
    });
  });
  container.querySelectorAll('.comment-send-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const id=b.dataset.postId;
      const input=container.querySelector(`.comment-input[data-post-id="${id}"]`);
      if(!input||!input.value.trim())return;
      const post=state.posts.find(p=>p.id===id);
      if(!post)return;
      const nc={id:generateId('c'),author:currentUser,text:input.value.trim(),replies:[]};
      if(replyingTo&&replyingTo.postId===id){
        const t=findComment(post.comments,replyingTo.commentId);
        if(t){if(!t.replies)t.replies=[];t.replies.push(nc);}
        else post.comments.push(nc);
        replyingTo=null;
      }else post.comments.push(nc);
      input.value='';
      saveRoom();
      if(currentTab==='feed')renderFeed();else renderMe();
      setTimeout(()=>{const s=$('comments-'+id);if(s)s.classList.add('open');},0);
    });
  });
  container.querySelectorAll('.comment-input').forEach(inp=>{
    inp.addEventListener('keypress',e=>{
      if(e.key==='Enter'){const b=inp.closest('.comment-input-row').querySelector('.comment-send-btn');if(b)b.click();}
    });
  });
  container.querySelectorAll('.comment-del').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!confirm('删除这条评论？'))return;
      const post=state.posts.find(p=>p.id===b.dataset.postId);
      if(!post)return;
      removeComment(post.comments,b.dataset.commentId);
      saveRoom();
      if(currentTab==='feed')renderFeed();else renderMe();
    });
  });
  container.querySelectorAll('.reply-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const pid=b.dataset.postId,cid=b.dataset.commentId;
      const post=state.posts.find(p=>p.id===pid);if(!post)return;
      const c=findComment(post.comments,cid);if(!c)return;
      const cu=state.users[c.author];
      replyingTo={postId:pid,commentId:cid};
      const hint=$('reply-hint-'+pid);
      if(hint){
        hint.innerHTML=`<div class="comment-reply-hint">回复 <strong>${escapeHtml(cu?cu.name:'Ta')}</strong>：<button class="close-reply">✕</button></div>`;
        hint.querySelector('.close-reply').addEventListener('click',()=>{replyingTo=null;hint.innerHTML='';});
      }
      const s=$('comments-'+pid);if(s)s.classList.add('open');
      const inp=container.querySelector(`.comment-input[data-post-id="${pid}"]`);
      if(inp)setTimeout(()=>inp.focus(),50);
    });
  });
  container.querySelectorAll('.post-more-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      actionSheetPostId=b.dataset.postId;
      openPostActions();
    });
  });
}
function findComment(arr,id){
  for(const c of arr){
    if(c.id===id)return c;
    const r=findComment(c.replies||[],id);
    if(r)return r;
  }
  return null;
}
function removeComment(arr,id){
  for(let i=0;i<arr.length;i++){
    if(arr[i].id===id){arr.splice(i,1);return true;}
    if(arr[i].replies&&removeComment(arr[i].replies,id))return true;
  }
  return false;
}

function openEditor(post){

  updatePublishBtn();

function closeEditor(){

}
function renderEditorImage(){

  if(!editorImage){w.innerHTML='';return;}
  w.innerHTML=`<div class="post-editor-image-preview"><img src="${editorImage}"><button class="remove-img" id="removeEditorImg">✕</button></div>`;
  $('removeEditorImg').addEventListener('click',()=>{editorImage=null;renderEditorImage();updatePublishBtn();});
}
function renderEditorSchedule(){
  const w=$('editorScheduleHintWrap');
  if(!editorScheduleAt){w.innerHTML='';return;}
  w.innerHTML=`<div class="comment-reply-hint" style="margin-top:12px;">⏰ 将于 ${formatDateTime(editorScheduleAt)} 发布<button class="close-reply" id="cancelSchedule">✕</button></div>`;

function updatePublishBtn(){

}
$('editorText').addEventListener('input',updatePublishBtn);
$('editorCancel').addEventListener('click',closeEditor);
$('toolbarImage').addEventListener('click',()=>$('editorImageInput').click());
$('editorImageInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>openCrop(ev.target.result,url=>{editorImage=url;renderEditorImage();updatePublishBtn();});
  r.readAsDataURL(f);
  e.target.value='';
});
$('toolbarSchedule').addEventListener('click',()=>{
  showScheduleDialog(editorScheduleAt,(t)=>{

    else editorScheduleAt=null;
    renderEditorSchedule();
  });
});
$('editorPublish').addEventListener('click',()=>{
  const text=$('editorText').value.trim();
  if(!text&&!editorImage)return;
  if(editingPostId){
    const p=state.posts.find(x=>x.id===editingPostId);if(!p)return;
    p.text=text;p.image=editorImage;
    if(editorScheduleAt)p.publishAt=editorScheduleAt;else delete p.publishAt;
  }else{
    state.posts.push({
      id:generateId('p'),
      author:currentUser,
      text,image:editorImage,
      createdAt:Date.now(),
      publishAt:editorScheduleAt||null,
      comments:[],
      readBy:{}
    });
  }
  saveRoom();
  closeEditor();
  if(currentTab==='feed')renderFeed();
  else if(currentTab==='me')renderMe();
});

// 定时弹窗
function showScheduleDialog(initial,cb){
  const box=$('genericModalBox');
  box.innerHTML='';
  const title=document.createElement('div');title.className='modal-title';title.textContent='定时发布';
  box.appendChild(title);
  const inp=document.createElement('input');
  inp.type='datetime-local';inp.className='modal-input';
  const def=initial?new Date(initial):new Date(Date.now()+3600000);
  inp.value=`${def.getFullYear()}-${pad(def.getMonth()+1)}-${pad(def.getDate())}T${pad(def.getHours())}:${pad(def.getMinutes())}`;
  box.appendChild(inp);
  const actions=document.createElement('div');actions.className='modal-actions';
  const cancel=document.createElement('button');cancel.className='modal-btn cancel';cancel.textContent='取消';
  cancel.addEventListener('click',()=>{$('genericModal').classList.remove('open');cb(null);});
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    const t=new Date(inp.value).getTime();
    if(isNaN(t)||t<=Date.now()){alert('请选择未来的时间');return;}
    $('genericModal').classList.remove('open');cb(t);
  });
  actions.appendChild(cancel);actions.appendChild(ok);
  box.appendChild(actions);
  $('genericModal').classList.add('open');
}

// ---------- 日历 ----------
function renderCalendar(){
  const c=$('subCalendar');
  const first=new Date(calYear,calMonth,1);
  const startWeekday=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  let html=`
    <div class="cal-header">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <div class="cal-month-title">${calYear}年${calMonth+1}月</div>
      <button class="cal-nav-btn" id="calNext">›</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div>
      <div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div>
      <div class="cal-weekday">六</div>
    </div>
    <div class="cal-grid">
  `;
  for(let i=0;i<startWeekday;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const todos=state.todos[dateStr]||[];
    const undone=todos.filter(t=>!t.done).length;
    const hasNote=!!state.notes[dateStr];
    const cls=['cal-cell'];
    if(dateStr===todayStr)cls.push('today');
    if(todos.length&&undone===0)cls.push('has-todo');
    let dots='';
    if(todos.length){
      dots='<div class="cal-dots">';
      todos.slice(0,4).forEach(t=>{
        dots+=`<div class="cal-dot${t.done?' done':''}"></div>`;
      });
      dots+='</div>';
    }
    html+=`<div class="${cls.join(' ')}" data-date="${dateStr}">
      <div class="cal-num">${d}</div>
      ${dots}
      ${hasNote?'<span class="cal-note-icon">📝</span>':''}
    </div>`;
  }
  html+='</div>';
  c.innerHTML=html;

  $('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();});
  $('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();});
  c.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    el.addEventListener('click',()=>openTodoModal(el.dataset.date));
  });
}

function openTodoModal(dateStr){
  currentTodoDate=dateStr;
  const d=new Date(dateStr+'T00:00:00');
  $('todoTitle').textContent=`${d.getMonth()+1}月${d.getDate()}日`;
  $('todoSub').textContent=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  renderTodoList();
  $('noteInput').value=state.notes[dateStr]||'';
  $('todoModal').classList.add('open');
  setTimeout(()=>$('todoInput').focus(),100);
}
function renderTodoList(){
  const list=$('todoList');
  const todos=state.todos[currentTodoDate]||[];
  if(!todos.length){list.innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px 0;">还没有待办</div>';return;}
  list.innerHTML=todos.map(t=>{
    const cu=state.users[t.by];
    return `<div class="todo-item" data-id="${t.id}">
      <div class="todo-checkbox${t.done?' done':''}" data-id="${t.id}">${t.done?'✓':''}</div>
      <div class="todo-body">
        <div class="todo-text${t.done?' done':''}">${escapeHtml(t.text)}</div>
        <div class="todo-meta">${cu?escapeHtml(cu.name):'Ta'} · ${formatHm(t.createdAt)}</div>
      </div>
      <button class="todo-del" data-id="${t.id}">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.todo-checkbox').forEach(el=>{
    el.addEventListener('click',()=>toggleTodo(el.dataset.id));
  });
  list.querySelectorAll('.todo-del').forEach(el=>{
    el.addEventListener('click',()=>deleteTodo(el.dataset.id));
  });
}
function toggleTodo(id){
  const arr=state.todos[currentTodoDate]||[];
  const t=arr.find(x=>x.id===id);
  if(!t)return;
  t.done=!t.done;
  saveRoom();
  renderTodoList();
}
function deleteTodo(id){
  if(!confirm('删除这条待办？'))return;
  state.todos[currentTodoDate]=(state.todos[currentTodoDate]||[]).filter(x=>x.id!==id);
  if(!state.todos[currentTodoDate].length)delete state.todos[currentTodoDate];
  saveRoom();
  renderTodoList();
}
$('todoAddBtn').addEventListener('click',()=>{
  const v=$('todoInput').value.trim();
  if(!v)return;
  if(!state.todos[currentTodoDate])state.todos[currentTodoDate]=[];
  state.todos[currentTodoDate].push({id:generateId('t'),text:v,done:false,by:currentUser,createdAt:Date.now()});
  $('todoInput').value='';
  saveRoom();
  renderTodoList();
});
$('todoInput').addEventListener('keypress',e=>{if(e.key==='Enter')$('todoAddBtn').click();});
$('noteInput').addEventListener('blur',()=>{
  const v=$('noteInput').value.trim();
  if(v)state.notes[currentTodoDate]=v;
  else delete state.notes[currentTodoDate];
  saveRoom();
});
$('todoCloseBtn').addEventListener('click',()=>{$('todoModal').classList.remove('open');});

// ---------- 纪念日 ----------
function renderAnniv(){
  const c=$('subAnniv');
  const a=state.anniversary;
  let main='';
  if(!a||!a.date){
    main=`<div class="anniv-empty"><span class="icon">💕</span><p>还没有设置纪念日</p><button class="modal-btn confirm" id="annivSetBtn" style="max-width:200px;margin:0 auto;">设置纪念日</button></div>`;
  }else{
    const start=new Date(a.date+'T00:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const days=Math.floor((today-start)/86400000)+1;
    let bg='';
    if(a.cover&&a.cover.type==='color')bg=`background:${a.cover.value};`;
    else if(a.cover&&a.cover.type==='image')bg=`background:url('${a.cover.value}') center/cover;`;
    main=`<div class="anniv-card" style="${bg};border-radius:${state.annivRadius}px;">
      <div class="anniv-label">${escapeHtml(a.label||'在一起')}</div>
      <div class="anniv-days">${days}<span class="anniv-days-unit">天</span></div>
      <div class="anniv-date">从 ${a.date} 开始</div>
      <div class="anniv-actions">
        <button class="anniv-mini-btn" id="annivEditBtn">✎ 编辑</button>
        <button class="anniv-mini-btn" id="annivBgBtn">🎨 背景</button>
      </div>
    </div>
    <div class="radius-slider-wrap">
      <label><span>圆角大小</span><span id="radiusVal">${state.annivRadius}px</span></label>
      <input type="range" id="radiusSlider" min="0" max="80" value="${state.annivRadius}">
    </div>`;
  }
  const list=state.customAnnivs||[];
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...list].map(x=>({...x,diff:Math.round((new Date(x.date+'T00:00:00')-today)/86400000)})).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
  let listHtml='';
  if(!sorted.length)listHtml='<div class="custom-anniv-empty">还没有自定义纪念日</div>';
  else{
    listHtml=sorted.map(item=>{
      let txt;
      if(item.diff>0)txt=`还有 ${item.diff} 天`;
      else if(item.diff===0)txt='就是今天';
      else txt=`已过 ${Math.abs(item.diff)} 天`;
      return `<div class="custom-anniv-item" data-id="${item.id}">
        <div class="ca-icon">🎉</div>
        <div class="ca-info"><div class="ca-title">${escapeHtml(item.label)}</div><div class="ca-date">${item.date}</div></div>
        <div class="ca-days${item.diff===0?' today':''}">${txt}</div>
        <button class="ca-del" data-id="${item.id}">✕</button>
      </div>`;
    }).join('');
  }
  c.innerHTML=main+`<div class="section-title">自定义纪念日</div>${listHtml}<button class="add-anniv-btn" id="addCustomAnniv">+ 添加纪念日</button>`;

  if(a&&a.date){
    $('annivEditBtn').addEventListener('click',editAnniv);
    $('annivBgBtn').addEventListener('click',editAnnivBg);
    const s=$('radiusSlider');
    s.addEventListener('input',()=>{
      state.annivRadius=parseInt(s.value);
      $('radiusVal').textContent=state.annivRadius+'px';
      const card=c.querySelector('.anniv-card');
      if(card)card.style.borderRadius=state.annivRadius+'px';
    });
    s.addEventListener('change',()=>saveRoom());
  }else{
    $('annivSetBtn').addEventListener('click',editAnniv);
  }
  $('addCustomAnniv').addEventListener('click',()=>editCustomAnniv(null));
  c.querySelectorAll('.custom-anniv-item').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.ca-del'))return;
      editCustomAnniv(el.dataset.id);
    });
  });
  c.querySelectorAll('.ca-del').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm('删除这个纪念日？'))return;
      state.customAnnivs=state.customAnnivs.filter(x=>x.id!==b.dataset.id);
      saveRoom();renderAnniv();
    });
  });
}

function editAnniv(){
  const box=$('genericModalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='设置纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称（如：在一起）';lab.maxLength=12;
  lab.value=state.anniversary?state.anniversary.label||'':'在一起';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';
  dt.value=state.anniversary?state.anniversary.date||'':'';box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('genericModal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{
    if(!dt.value){alert('请选择日期');return;}
    const old=state.anniversary&&state.anniversary.cover;
    state.anniversary={label:lab.value.trim()||'在一起',date:dt.value,cover:old||{type:'gradient'}};
    saveRoom();$('genericModal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('genericModal').classList.add('open');
}
function editAnnivBg(){
  const a=state.anniversary;if(!a)return;
  const cover=a.cover||{type:'gradient'};
  const box=$('genericModalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent='背景';box.appendChild(t);
  const tabs=document.createElement('div');tabs.className='segmented';
  const bColor=document.createElement('button');bColor.textContent='纯色';bColor.className=cover.type==='color'?'active':'';
  const bImg=document.createElement('button');bImg.textContent='图片';bImg.className=cover.type==='image'?'active':'';
  tabs.appendChild(bColor);tabs.appendChild(bImg);box.appendChild(tabs);
  const panel=document.createElement('div');box.appendChild(panel);
  function drawColor(){
    panel.innerHTML='';
    const ci=document.createElement('input');ci.type='color';ci.value=cover.type==='color'?cover.value:'#007aff';
    ci.style.cssText='width:100%;height:52px;border:none;border-radius:14px;cursor:pointer;background:transparent;';
    panel.appendChild(ci);
    const sw=document.createElement('div');
    sw.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px;';
    ['#007aff','#5ac8fa','#ff2d55','#ff9500','#34c759','#af52de','#ffcc00','#1c1c1e'].forEach(col=>{
      const s=document.createElement('div');
      s.style.cssText=`aspect-ratio:1;border-radius:50%;background:${col};cursor:pointer;`;
      s.addEventListener('click',()=>{ci.value=col;});
      sw.appendChild(s);
    });
    panel.appendChild(sw);
    panel._getColor=()=>ci.value;
  }
  function drawImg(){
    panel.innerHTML='';
    const btn=document.createElement('button');btn.className='modal-btn confirm';btn.textContent='上传图片';
    btn.style.width='100%';
    const prev=document.createElement('div');
    prev.style.cssText='margin-top:12px;border-radius:14px;overflow:hidden;background:var(--bg-input);min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;';
    prev.textContent=cover.type==='image'?'已设置图片':'未选择图片';
    let img=cover.type==='image'?cover.value:null;
    btn.addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>openCrop(ev.target.result,url=>{
          img=url;prev.innerHTML=`<img src="${url}" style="width:100%;display:block;max-height:200px;object-fit:cover;">`;
        });
        r.readAsDataURL(f);
      });
      inp.click();
    });
    panel.appendChild(btn);panel.appendChild(prev);
    panel._getImg=()=>img;
  }
  bColor.addEventListener('click',()=>{bColor.classList.add('active');bImg.classList.remove('active');drawColor();});
  bImg.addEventListener('click',()=>{bImg.classList.add('active');bColor.classList.remove('active');drawImg();});
  if(cover.type==='image')drawImg();else drawColor();
  const ac=document.createElement('div');ac.className='modal-actions';ac.style.marginTop='16px';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('genericModal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='确定';
  ok.addEventListener('click',()=>{
    if(bColor.classList.contains('active')){
      a.cover={type:'color',value:panel._getColor()};
    }else{
      const img=panel._getImg();
      if(!img){alert('请先选择图片');return;}
      a.cover={type:'image',value:img};
    }
    saveRoom();$('genericModal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('genericModal').classList.add('open');
}
function editCustomAnniv(id){
  const item=id?state.customAnnivs.find(x=>x.id===id):null;
  const box=$('genericModalBox');box.innerHTML='';
  const t=document.createElement('div');t.className='modal-title';t.textContent=item?'编辑纪念日':'添加纪念日';box.appendChild(t);
  const lab=document.createElement('input');lab.className='modal-input';lab.placeholder='名称';lab.maxLength=20;
  lab.value=item?item.label:'';box.appendChild(lab);
  const dt=document.createElement('input');dt.type='date';dt.className='modal-input';
  dt.value=item?item.date:new Date().toISOString().slice(0,10);box.appendChild(dt);
  const ac=document.createElement('div');ac.className='modal-actions';
  const c=document.createElement('button');c.className='modal-btn cancel';c.textContent='取消';
  c.addEventListener('click',()=>$('genericModal').classList.remove('open'));
  const ok=document.createElement('button');ok.className='modal-btn confirm';ok.textContent='保存';
  ok.addEventListener('click',()=>{
    if(!lab.value.trim()){alert('请输入名称');return;}
    if(!dt.value){alert('请选择日期');return;}
    if(item){item.label=lab.value.trim();item.date=dt.value;}
    else state.customAnnivs.push({id:generateId('a'),label:lab.value.trim(),date:dt.value});
    saveRoom();$('genericModal').classList.remove('open');renderAnniv();
  });
  ac.appendChild(c);ac.appendChild(ok);box.appendChild(ac);
  $('genericModal').classList.add('open');
}

// ============================================================
// 图片裁剪
// ============================================================
let cropState={imgW:0,imgH:0,dispW:0,dispH:0,x:0,y:0,w:0,h:0};
let cropCallback=null;

function openCrop(src,cb){
  cropCallback=cb;
  $('cropImage').onload=function(){
    requestAnimationFrame(()=>{
      const wrap=$('cropImageWrap');
      const area=wrap.parentElement;
      const maxW=area.clientWidth-20,maxH=area.clientHeight-20;
      const ratio=$('cropImage').naturalWidth/$('cropImage').naturalHeight;
      let dw=maxW,dh=maxW/ratio;
      if(dh>maxH){dh=maxH;dw=maxH*ratio;}
      wrap.style.width=dw+'px';wrap.style.height=dh+'px';
      $('cropImage').style.width=dw+'px';$('cropImage').style.height=dh+'px';
      cropState.dispW=dw;cropState.dispH=dh;
      cropState.imgW=$('cropImage').naturalWidth;cropState.imgH=$('cropImage').naturalHeight;
      const sw=dw*.6,sh=dh*.6;
      cropState.w=sw;cropState.h=sh;
      cropState.x=(dw-sw)/2;cropState.y=(dh-sh)/2;
      updateCropSel();
      $('cropModal').classList.add('open');
    });
  };
  $('cropImage').src=src;
}
function updateCropSel(){
  const s=$('cropSelection');
  s.style.left=cropState.x+'px';s.style.top=cropState.y+'px';
  s.style.width=cropState.w+'px';s.style.height=cropState.h+'px';
}
$('cropSelection').addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('crop-handle'))return;
  dragStart={type:'move',sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y};
  e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
$('cropSelection').querySelectorAll('.crop-handle').forEach(h=>{
  h.addEventListener('pointerdown',e=>{
    dragStart={type:h.dataset.dir,sx:e.clientX,sy:e.clientY,x:cropState.x,y:cropState.y,w:cropState.w,h:cropState.h};
    e.target.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();
  });
});
$('cropSelection').addEventListener('pointermove',e=>{
  if(!dragStart)return;
  const dx=e.clientX-dragStart.sx,dy=e.clientY-dragStart.sy,min=40;
  if(dragStart.type==='move'){
    let nx=dragStart.x+dx,ny=dragStart.y+dy;
    nx=Math.max(0,Math.min(cropState.dispW-cropState.w,nx));
    ny=Math.max(0,Math.min(cropState.dispH-cropState.h,ny));
    cropState.x=nx;cropState.y=ny;
  }else{
    let nx=dragStart.x,ny=dragStart.y,nw=dragStart.w,nh=dragStart.h;
    if(dragStart.type==='tl'){nx+=dx;ny+=dy;nw-=dx;nh-=dy;}
    if(dragStart.type==='tr'){ny+=dy;nw+=dx;nh-=dy;}
    if(dragStart.type==='bl'){nx+=dx;nw-=dx;nh+=dy;}
    if(dragStart.type==='br'){nw+=dx;nh+=dy;}
    if(nw<min){nw=min;if(dragStart.type.includes('l'))nx=dragStart.x+dragStart.w-min;}
    if(nh<min){nh=min;if(dragStart.type.includes('t'))ny=dragStart.y+dragStart.h-min;}
    if(nx<0){nw+=nx;nx=0;}
    if(ny<0){nh+=ny;ny=0;}
    if(nx+nw>cropState.dispW)nw=cropState.dispW-nx;
    if(ny+nh>cropState.dispH)nh=cropState.dispH-ny;
    cropState.x=nx;cropState.y=ny;cropState.w=nw;cropState.h=nh;
  }
  updateCropSel();
});
$('cropSelection').addEventListener('pointerup',()=>{dragStart=null;});
$('cropSelection').addEventListener('pointercancel',()=>{dragStart=null;});
$('cropCancel').addEventListener('click',()=>{$('cropModal').classList.remove('open');cropCallback=null;});
$('cropConfirm').addEventListener('click',()=>{
  const sx=cropState.x*(cropState.imgW/cropState.dispW);
  const sy=cropState.y*(cropState.imgH/cropState.dispH);
  const sw=cropState.w*(cropState.imgW/cropState.dispW);
  const sh=cropState.h*(cropState.imgH/cropState.dispH);
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(sw);canvas.height=Math.round(sh);
  canvas.getContext('2d').drawImage($('cropImage'),sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  const url=canvas.toDataURL('image/jpeg',.85);
  $('cropModal').classList.remove('open');
  if(cropCallback)cropCallback(url);
  cropCallback=null;
});
